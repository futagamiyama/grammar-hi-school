id: g104
file: g104.yaml

title: what節
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: what + 不完全文を「〜すること・もの」として読めるか？

core_concept:
  relative_what_clause:
    form: what + 主語 + 動詞
    meaning: 〜すること、〜するもの
    image: what = the thing which / the things which
    examples:
      - sentence: What he said was true.
        ja: 彼が言ったことは本当だった。
        point: what は said の目的語を含んでいる。
      - sentence: I do not understand what she means.
        ja: 私は彼女が言っていることがわからない。
        point: what she means で「彼女が意味していること」。
      - sentence: This is what I wanted.
        ja: これが私の欲しかったものです。
        point: what I wanted が be動詞の補語。

  what_as_subject_in_clause:
    form: what + 動詞 + 目的語
    meaning: 〜するもの、〜であること
    image: what が節の中の主語になる
    examples:
      - sentence: What matters most is honesty.
        ja: 最も重要なのは正直さだ。
        point: what が matters の主語。
      - sentence: What happened surprised everyone.
        ja: 起こったことは皆を驚かせた。
        point: what が happened の主語。
      - sentence: What caused the accident is still unknown.
        ja: 何がその事故を引き起こしたのかはまだ不明だ。
        point: what が caused の主語。

  what_vs_that:
    form: what + 不完全文 / that + 完全文
    meaning: what は「〜すること・もの」、that は「〜ということ」
    image: what は名詞の役割も含むが、that は節を名詞化するだけ
    examples:
      - sentence: I believe that he is honest.
        ja: 私は彼が正直だということを信じている。
        point: he is honest は完全文なので that を使う。
      - sentence: I believe what he said.
        ja: 私は彼が言ったことを信じている。
        point: he said は目的語が欠けているので what を使う。
      - sentence: That he failed surprised us.
        ja: 彼が失敗したことは私たちを驚かせた。
        point: he failed は完全文なので That を使う。

  what_to_do:
    form: what + to + 動詞原形
    meaning: 何を〜すべきか
    image: what以下が名詞句として働く
    examples:
      - sentence: I do not know what to do.
        ja: 私は何をすべきかわからない。
        point: what to do で「何をすべきか」。
      - sentence: Please tell me what to buy.
        ja: 何を買うべきか教えてください。
        point: what to buy が tell の目的語。
      - sentence: We must decide what to do next.
        ja: 私たちは次に何をすべきか決めなければならない。
        point: what to do next が decide の目的語。

main_rule: >
  what節は、what + 不完全文で「〜すること・もの」を表す。
  What he said was true. は「彼が言ったことは本当だった」。
  he said の後ろには目的語が欠けており、what がその目的語を含んでいる。
  what は the thing which / the things which に近い働きをする。
  一方、that節は that + 完全文で「〜ということ」を表す。
  I believe that he is honest. では、he is honest は完全文なので that を使う。
  I believe what he said. では、he said の目的語が欠けているので what を使う。
  what が節の中の主語になることもある。
  What happened surprised everyone. では、what が happened の主語。
  また、what to do は「何をすべきか」という名詞句として使われる。

contrast_pairs:
  - what_clause: I believe what he said.
    that_clause: I believe that he is honest.
    point: >
      what he said は「彼が言ったこと」。
      that he is honest は「彼が正直だということ」。
      what の後ろは不完全文、that の後ろは完全文。

  - what_object: What he said was true.
    that_subject: That he lied was clear.
    point: >
      What he said では what が said の目的語を含む。
      That he lied では he lied が完全文。

  - what_clause: This is what I wanted.
    relative_that: This is the book that I wanted.
    point: >
      what は「もの」を含むので、what I wanted だけで名詞節になる。
      that は前の名詞 the book を修飾する関係代名詞。

