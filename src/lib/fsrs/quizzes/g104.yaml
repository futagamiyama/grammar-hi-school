common_mistakes:
  - mistake: what を常に「何」とだけ訳す
    correction: >
      what節は「何」だけでなく、「〜すること・もの」と訳すことが多い。
      what he said は「彼が言ったこと」。
  - mistake: what と that を同じように使ってしまう
    correction: >
      what の後ろは不完全文。
      that の後ろは完全文。
      I believe what he said / I believe that he is honest。
  - mistake: What he said を「彼が何を言ったか」とだけ読む
    correction: >
      文脈によっては「彼が言ったこと」という関係代名詞 what の名詞節として読む。
  - mistake: what の前に先行詞を置いてしまう
    correction: >
      what は the thing which の意味を含む。
      the thing what とはしない。
  - mistake: what to do を目的の to不定詞だと思う
    correction: >
      what to do は「何をすべきか」。
      know, decide, tell などの目的語になる名詞句。

learning_notes:
  - >
    what節は「〜すること・もの」を表す名詞節。
    what = the thing which と考えるとわかりやすい。
  - >
    what の後ろは、主語・目的語などが欠けた不完全文になる。
  - >
    that節は「〜ということ」を表し、後ろは完全文になる。
  - >
    what が節の主語になることもある。
    What happened / What matters most の形。
  - >
    what to do は「何をすべきか」。
    what to buy / what to say / what to do next も同じ型。

