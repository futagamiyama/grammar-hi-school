review_questions:
  - id: g116_q001
    question_type: two_choice
    prompt: I believe ___ he is honest.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      he is honest は完全文。
      「彼が正直だということ」を表すので that を使う。
    translation: 私は彼が正直だということを信じている。
    focus:
      - noun_clause_judgement
      - that_clause
      - complete_clause

  - id: g116_q002
    question_type: two_choice
    prompt: I believe ___ he said.
    choices:
      - text: what
        correct: true
      - text: that
        correct: false
    answer: what
    explanation: >
      he said は目的語が欠けている。
      what he said で「彼が言ったこと」という名詞節になる。
    translation: 私は彼が言ったことを信じている。
    focus:
      - noun_clause_judgement
      - what_clause
      - object_gap

  - id: g116_q003
    question_type: two_choice
    prompt: ___ he will come is not clear.
    choices:
      - text: Whether
        correct: true
      - text: If
        correct: false
    answer: Whether
    explanation: >
      Whether he will come 全体が文の主語。
      主語節では if より whether を使うのが自然。
    translation: 彼が来るかどうかは明らかではない。
    focus:
      - noun_clause_judgement
      - whether_subject_clause
      - subject_clause

  - id: g116_q004
    question_type: two_choice
    prompt: I stayed home ___ it was raining.
    choices:
      - text: because
        correct: true
      - text: because of
        correct: false
    answer: because
    explanation: >
      it was raining は文。
      後ろに文を取るので because を使う。
    translation: 雨が降っていたので、私は家にいた。
    focus:
      - adverb_clause_judgement
      - conjunction_preposition_judgement
      - because

  - id: g116_q005
    question_type: two_choice
    prompt: I stayed home ___ the rain.
    choices:
      - text: because of
        correct: true
      - text: because
        correct: false
    answer: because of
    explanation: >
      the rain は名詞句。
      後ろに名詞句を取るので because of を使う。
    translation: 雨のために、私は家にいた。
    focus:
      - conjunction_preposition_judgement
      - because_of
      - noun_phrase

  - id: g116_q006
    question_type: two_choice
    prompt: ___ it was raining, we went out.
    choices:
      - text: Although
        correct: true
      - text: Despite
        correct: false
    answer: Although
    explanation: >
      it was raining は文。
      譲歩を表す接続詞 although を使う。
    translation: 雨が降っていたけれども、私たちは外出した。
    focus:
      - adverb_clause_judgement
      - although
      - concession

  - id: g116_q007
    question_type: two_choice
    prompt: Despite ___ tired, he kept working.
    choices:
      - text: being
        correct: true
      - text: he was
        correct: false
    answer: being
    explanation: >
      despite は前置詞。
      後ろに動詞を置くなら動名詞 being tired にする。
    translation: 疲れていたにもかかわらず、彼は働き続けた。
    focus:
      - conjunction_preposition_judgement
      - despite
      - gerund

  - id: g116_q008
    question_type: two_choice
    prompt: I got up early ___ I could catch the train.
    choices:
      - text: so that
        correct: true
      - text: in order to
        correct: false
    answer: so that
    explanation: >
      I could catch the train は文。
      so that + 文で「〜できるように」という目的を表す。
    translation: 電車に乗れるように、私は早く起きた。
    focus:
      - purpose_result_judgement
      - so_that
      - purpose_clause

  - id: g116_q009
    question_type: two_choice
    prompt: The box was ___ heavy that I could not lift it.
    choices:
      - text: so
        correct: true
      - text: such
        correct: false
    answer: so
    explanation: >
      heavy は形容詞。
      so + 形容詞 + that で「とても重かったので...」という結果を表す。
    translation: その箱はとても重かったので、私は持ち上げられなかった。
    focus:
      - purpose_result_judgement
      - so_that_result
      - adjective

  - id: g116_q010
    question_type: two_choice
    prompt: Call me when you ___.
    choices:
      - text: arrive
        correct: true
      - text: will arrive
        correct: false
    answer: arrive
    explanation: >
      when は時を表す副詞節。
      未来の内容でも節の中は現在形 arrive を使う。
    translation: 到着したら私に電話してください。
    focus:
      - adverb_clause_judgement
      - future_in_time_clause
      - when

  - id: g116_q011
    question_type: two_choice
    prompt: If he ___ tomorrow, I will tell him.
    choices:
      - text: comes
        correct: true
      - text: will come
        correct: false
    answer: comes
    explanation: >
      if は条件を表す副詞節。
      未来の内容でも if節の中は現在形 comes にする。
    translation: もし彼が明日来たら、私は彼に伝えます。
    focus:
      - adverb_clause_judgement
      - condition_clause
      - present_for_future

  - id: g116_q012
    question_type: two_choice
    prompt: I was tired. ___, I went home.
    choices:
      - text: Therefore
        correct: true
      - text: But
        correct: false
    answer: Therefore
    explanation: >
      疲れていたことから、家に帰ったという結果を述べている。
      新しい文の文頭で使う接続副詞 Therefore が自然。
    translation: 私は疲れていた。したがって、家に帰った。
    focus:
      - connector_judgement
      - therefore
      - result

common_mistakes:
  - mistake: that と what を「こと」で同じように訳してしまう
    correction: >
      that の後ろは完全文。
      what の後ろは不完全文。
      形で判定する。
  - mistake: whether と if を常に交換可能だと思う
    correction: >
      目的語の位置では交換できることが多いが、
      主語節や前置詞の後ろでは whether を使う。
  - mistake: 接続詞と前置詞を日本語訳だけで選ぶ
    correction: >
      後ろが文なら接続詞、名詞句なら前置詞。
      because it rained / because of the rain。
  - mistake: so that と so ... that を混同する
    correction: >
      so that + 文は目的。
      so + 形容詞/副詞 + that は結果。
  - mistake: 時・条件の副詞節で will を使う
    correction: >
      when / if / unless などの副詞節では、
      未来の内容でも現在形を使う。
  - mistake: 接続副詞を等位接続詞と同じように使う
    correction: >
      so / but / or は等位接続詞。
      therefore / however / otherwise は接続副詞。
      句読点と文の切れ目を意識する。

learning_notes:
  - >
    名詞節では、that + 完全文、what + 不完全文、whether/if + 完全文を区別する。
  - >
    接続詞は文を取り、前置詞は名詞句を取る。
    まず後ろの形を見る。
  - >
    目的は so that + 文 / in order to + 動詞原形。
    結果は so ... that / such ... that。
  - >
    時・条件の副詞節では、未来の内容でも現在形を使う。
    when I arrive / if he comes を基本形として覚える。
  - >
    接続副詞は意味のつながりを作る副詞。
    等位接続詞と同じ位置で使えるとは限らない。

