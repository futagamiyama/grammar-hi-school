id: g116
file: g116.yaml

title: 名詞節・接続詞の総合判定
type: exam_judgement

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 名詞節・副詞節・接続詞・前置詞句を、後ろの形と文脈から総合的に判定できるか？

core_concept:
  noun_clause_judgement:
    form: that + 完全文 / what + 不完全文 / whether・if + 完全文
    meaning: 〜ということ / 〜すること・もの / 〜かどうか
    image: 節全体が名詞として働く
    examples:
      - sentence: I believe that he is honest.
        ja: 私は彼が正直だということを信じている。
        point: he is honest は完全文なので that。
      - sentence: I believe what he said.
        ja: 私は彼が言ったことを信じている。
        point: he said は目的語が欠けているので what。
      - sentence: I do not know whether he will come.
        ja: 私は彼が来るかどうか知らない。
        point: whether he will come で「彼が来るかどうか」。

  adverb_clause_judgement:
    form: because / although / when / if / unless + 主語 + 動詞
    meaning: 理由・譲歩・時・条件を表す
    image: 文全体に理由・条件・時などの意味を加える
    examples:
      - sentence: I stayed home because it was raining.
        ja: 雨が降っていたので、私は家にいた。
        point: because は理由を表す接続詞。
      - sentence: Although it was raining, we went out.
        ja: 雨が降っていたけれども、私たちは外出した。
        point: although は譲歩を表す接続詞。
      - sentence: If it rains tomorrow, we will stay home.
        ja: もし明日雨が降れば、私たちは家にいるでしょう。
        point: 条件節では未来の内容でも現在形 rains。

  purpose_result_judgement:
    form: so that + 文 / in order to + 動詞原形 / so・such ... that + 文
    meaning: 〜するために / とても〜なので...
    image: 目的か結果かを文脈で見分ける
    examples:
      - sentence: I got up early so that I could catch the train.
        ja: 電車に乗れるように、私は早く起きた。
        point: so that + 文で目的を表す。
      - sentence: I got up early in order to catch the train.
        ja: 電車に乗るために、私は早く起きた。
        point: in order to の後ろは動詞原形。
      - sentence: The box was so heavy that I could not lift it.
        ja: その箱はとても重かったので、私は持ち上げられなかった。
        point: so + 形容詞 + that で結果を表す。

  conjunction_preposition_judgement:
    form: 接続詞 + 文 / 前置詞 + 名詞句
    meaning: 同じ日本語でも後ろの形で語が変わる
    image: 後ろが文なら接続詞、名詞句なら前置詞
    examples:
      - sentence: because it rained / because of the rain
        ja: 雨が降ったので / 雨のために
        point: because は文、because of は名詞句を取る。
      - sentence: although he was tired / despite being tired
        ja: 疲れていたけれども / 疲れていたにもかかわらず
        point: although は文、despite は名詞句・動名詞を取る。
      - sentence: while I was waiting / during the meeting
        ja: 待っている間 / 会議の間
        point: while は文、during は名詞句を取る。

  connector_judgement:
    form: and / but / or / so / for / however / therefore / otherwise
    meaning: 追加・対比・選択・結果・理由・接続副詞
    image: 意味のつながりと文法上の働きを分けて見る
    examples:
      - sentence: I was tired, so I went home.
        ja: 私は疲れていたので、家に帰った。
        point: so は等位接続詞として文をつなぐ。
      - sentence: I was tired. Therefore, I went home.
        ja: 私は疲れていた。したがって、家に帰った。
        point: therefore は接続副詞。
      - sentence: Hurry up. Otherwise, you will miss the train.
        ja: 急ぎなさい。さもないと電車に乗り遅れます。
        point: otherwise は接続副詞で警告を表す。

main_rule: >
  名詞節・接続詞の問題では、まず後ろの形を見る。
  that は後ろに完全文を取り、「〜ということ」を表す。
  what は名詞の働きを含むので、後ろに主語・目的語などが欠けた不完全文が来る。
  whether / if は「〜かどうか」を表すが、主語節や前置詞の後ろでは whether を使う。
  because / although / when / if / while などは接続詞なので、後ろに主語＋動詞を含む文を取る。
  because of / despite / during などは前置詞なので、後ろに名詞句や動名詞を取る。
  so that は目的、so ... that / such ... that は結果。
  and / but / or / so / for は等位接続詞で、文を直接つなげる。
  however / therefore / moreover / otherwise は接続副詞なので、意味は似ていても文法上の扱いが違う。
  時・条件の副詞節では、未来の内容でも現在形を使う。
  when I arrive / if he comes / unless she calls の形を基本にする。

contrast_pairs:
  - that_clause: I believe that he is honest.
    what_clause: I believe what he said.
    point: >
      that の後ろは完全文。
      what の後ろは不完全文で、what が名詞の役割を含む。

  - conjunction: Although it was raining, we went out.
    preposition: Despite the rain, we went out.
    point: >
      although の後ろは文。
      despite の後ろは名詞句。

  - purpose: I got up early so that I could catch the train.
    result: The train was so crowded that I could not get on it.
    point: >
      so that は目的。
      so ... that は結果。

  - conjunction: I was tired, so I went home.
    conjunctive_adverb: I was tired. Therefore, I went home.
    point: >
      so は等位接続詞。
      therefore は接続副詞。

