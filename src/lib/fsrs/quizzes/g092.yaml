  - id: g092_q010
    question_type: two_choice
    prompt: He will come late, if ___ all.
    choices:
      - text: at
        correct: true
      - text: in
        correct: false
    answer: at
    explanation: >
      if at all は「そもそも〜するとしても」。
      彼は来るとしても遅れて来るだろう、という意味。
    translation: 彼は来るとしても遅れて来るだろう。
    focus:
      - if_at_all
      - at_all
      - come_late

  - id: g092_q011
    question_type: two_choice
    prompt: The effect is small, if it exists ___ all.
    choices:
      - text: at
        correct: true
      - text: in
        correct: false
    answer: at
    explanation: >
      if it exists at all で「そもそも存在するとしても」。
      at all は存在そのものへの疑いを示している。
    translation: その効果は、そもそも存在するとしても小さい。
    focus:
      - if_at_all
      - exists_at_all
      - effect

  - id: g092_q012
    question_type: two_choice
    prompt: We should use this method carefully, if ___ all.
    choices:
      - text: at
        correct: true
      - text: for
        correct: false
    answer: at
    explanation: >
      if at all は「使うとしても」。
      この方法を使うかどうか自体に慎重な態度を示している。
    translation: この方法を使うとしても、慎重に使うべきだ。
    focus:
      - if_at_all
      - carefully
      - method

common_mistakes:
  - mistake: if any を「もし何かなら」と直訳する
    correction: >
      if any は「あるとしても」。
      few / little と一緒に使われると「あるとしてもほとんどない」と読む。
  - mistake: if ever を「いつかなら」と読む
    correction: >
      if ever は「あるとしても」。
      rarely / seldom と一緒に「あるとしてもめったにない」という意味になる。
  - mistake: if anything を「もし何かなら」と読む
    correction: >
      if anything は「むしろ」「どちらかと言えば」。
      前の内容を修正して、反対方向に補足する。
  - mistake: if at all を「すべてにおいて」と読む
    correction: >
      if at all は「そもそも〜するとしても」。
      起こる可能性・存在可能性が低いことを示す。
  - mistake: any と ever を区別しない
    correction: >
      any は物・量・人数などの有無を受ける。
      ever は出来事や行動が起こるかどうかを受ける。

learning_notes:
  - >
    if any は「あるとしても」。
    few / little と一緒に出ることが多い。
  - >
    if ever は「あるとしても」だが、行動・出来事の頻度を表す。
    rarely / seldom と相性がよい。
  - >
    if anything は「むしろ」「どちらかと言えば」。
    直訳しないことが重要。
  - >
    if at all は「そもそも〜するとしても」。
    成立する可能性そのものが低い時に使う。
  - >
    これらは短いので読み飛ばしやすいが、文全体の評価を大きく変える。

