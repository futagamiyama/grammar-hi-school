id: g092
file: g092.yaml

title: if any / if ever / if anything
type: construction

section:
  id: s10
  title: 強調・倒置・省略

level: basic
target: 高校英文法基礎

core_question: if any / if ever / if anything などの短い省略表現を読めるか？

core_concept:
  if_any:
    form: few/little + 名詞, if any
    meaning: あるとしてもほとんどない
    image: if there are any / if there is any が省略されている
    examples:
      - sentence: There are few mistakes, if any.
        ja: 間違いは、あるとしてもほとんどない。
        point: if any = if there are any mistakes。
      - sentence: He has little money, if any.
        ja: 彼にはお金が、あるとしてもほとんどない。
        point: if any = if he has any money。
      - sentence: Few people, if any, understood the lecture.
        ja: その講義を理解した人は、いたとしてもほとんどいなかった。
        point: if any が few people を補足している。

  if_ever:
    form: rarely/seldom/few + if ever
    meaning: あるとしてもめったにない
    image: if it ever happens / if he ever does が省略されている
    examples:
      - sentence: He rarely, if ever, makes mistakes.
        ja: 彼は間違いをすることが、あるとしてもめったにない。
        point: if ever = if he ever makes mistakes。
      - sentence: She seldom, if ever, complains.
        ja: 彼女は不平を言うことが、あるとしてもめったにない。
        point: seldom と if ever が一緒に使われている。
      - sentence: Such chances come few, if ever.
        ja: そのような機会は、あるとしてもめったに来ない。
        point: if ever で「あるとしても」の意味を加えている。

  if_anything:
    form: if anything, 文
    meaning: むしろ、どちらかと言えば
    image: 前の予想と反対方向に少し修正する
    examples:
      - sentence: The problem is not easier. If anything, it is harder.
        ja: その問題は簡単ではない。むしろ難しくなっている。
        point: if anything は「むしろ」「どちらかと言えば」。
      - sentence: He is not lazy. If anything, he works too hard.
        ja: 彼は怠け者ではない。むしろ働きすぎだ。
        point: 前の否定を受けて、反対方向に補足する。
      - sentence: Prices have not fallen. If anything, they have risen.
        ja: 物価は下がっていない。むしろ上がっている。
        point: 予想と逆の内容を述べている。

  if_at_all:
    form: if at all
    meaning: そもそも〜するとしても、仮に〜するとしても
    image: 成立する可能性自体が低いことを示す
    examples:
      - sentence: He will come late, if at all.
        ja: 彼は来るとしても遅れて来るだろう。
        point: if at all = if he comes at all。
      - sentence: The effect is small, if it exists at all.
        ja: その効果は、そもそも存在するとしても小さい。
        point: at all が存在そのものへの疑いを示す。
      - sentence: We should use this method carefully, if at all.
        ja: この方法を使うとしても、慎重に使うべきだ。
        point: 使うかどうか自体が疑わしい。

main_rule: >
  if any / if ever / if anything / if at all は、短いが意味の重い省略表現。
  if any は if there are any / if there is any の省略で、
  「あるとしても」という意味を表す。
  There are few mistakes, if any. は
  「間違いは、あるとしてもほとんどない」。
  if ever は if it ever happens / if he ever does などの省略で、
  「あるとしてもめったにない」。
  He rarely, if ever, makes mistakes. は
  「彼は間違いをすることが、あるとしてもめったにない」。
  if anything は「むしろ」「どちらかと言えば」という意味で、
  前の内容を否定したあと、反対方向に補足する。
  if at all は「そもそも〜するとしても」という意味で、
  その出来事や状態が成立する可能性自体が低いことを表す。

contrast_pairs:
  - if_any: There are few mistakes, if any.
    full_form: There are few mistakes, if there are any mistakes.
    point: >
      if any は if there are any mistakes の省略。
      「あるとしてもほとんどない」と読む。

  - if_ever: He rarely, if ever, makes mistakes.
    ordinary: He rarely makes mistakes.
    point: >
      if ever を加えると「あるとしても」という含みが強くなる。
      rarely と一緒に使われやすい。

  - if_anything: The problem is not easier. If anything, it is harder.
    wrong_reading: The problem is easier.
    point: >
      if anything は「もし何かなら」ではなく、
      「むしろ」「どちらかと言えば」と読む。

