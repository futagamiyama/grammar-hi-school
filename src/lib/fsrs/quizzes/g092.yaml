  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または if any / if ever / if anything の意味の違いを説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g092_q001
    question_type: two_choice
    prompt: There are few mistakes, if ___.
    choices:
      - text: any
        correct: true
      - text: ever
        correct: false
    answer: any
    explanation: >
      few mistakes, if any で「間違いは、あるとしてもほとんどない」。
      if any は if there are any mistakes の省略。
    translation: 間違いは、あるとしてもほとんどない。
    focus:
      - if_any
      - few
      - omission

  - id: g092_q002
    question_type: two_choice
    prompt: He has little money, if ___.
    choices:
      - text: any
        correct: true
      - text: ever
        correct: false
    answer: any
    explanation: >
      little money, if any で「お金は、あるとしてもほとんどない」。
      any は money を受けている。
    translation: 彼にはお金が、あるとしてもほとんどない。
    focus:
      - if_any
      - little
      - money

  - id: g092_q003
    question_type: two_choice
    prompt: Few people, if ___, understood the lecture.
    choices:
      - text: any
        correct: true
      - text: anything
        correct: false
    answer: any
    explanation: >
      Few people, if any, で「人は、いたとしてもほとんどいない」。
      if any が few people を補足している。
    translation: その講義を理解した人は、いたとしてもほとんどいなかった。
    focus:
      - if_any
      - few_people
      - lecture

  - id: g092_q004
    question_type: two_choice
    prompt: He rarely, if ___, makes mistakes.
    choices:
      - text: ever
        correct: true
      - text: any
        correct: false
    answer: ever
    explanation: >
      rarely, if ever で「あるとしてもめったにない」。
      if ever は if he ever makes mistakes の省略。
    translation: 彼は間違いをすることが、あるとしてもめったにない。
    focus:
      - if_ever
      - rarely
      - mistakes

  - id: g092_q005
    question_type: two_choice
    prompt: She seldom, if ___, complains.
    choices:
      - text: ever
        correct: true
      - text: any
        correct: false
    answer: ever
    explanation: >
      seldom, if ever は「あるとしてもめったに〜しない」。
      complains という行動の頻度を表しているので ever を使う。
    translation: 彼女は不平を言うことが、あるとしてもめったにない。
    focus:
      - if_ever
      - seldom
      - complains

  - id: g092_q006
    question_type: two_choice
    prompt: Such chances come few, if ___.
    choices:
      - text: ever
        correct: true
      - text: any
        correct: false
    answer: ever
    explanation: >
      few, if ever は「あるとしてもめったにない」。
      come という出来事の頻度を表しているので ever が自然。
    translation: そのような機会は、あるとしてもめったに来ない。
    focus:
      - if_ever
      - chances
      - rare_event

  - id: g092_q007
    question_type: two_choice
    prompt: The problem is not easier. If ___, it is harder.
    choices:
      - text: anything
        correct: true
      - text: any
        correct: false
    answer: anything
    explanation: >
      If anything は「むしろ」「どちらかと言えば」。
      簡単ではなく、むしろ難しいという流れ。
    translation: その問題は簡単ではない。むしろ難しくなっている。
    focus:
