common_mistakes:
  - mistake: whose を疑問文の「誰の」だけだと思う
    correction: >
      whose は関係代名詞としても使える。
      a girl whose father is a doctor は「父親が医者である少女」。
  - mistake: whose の後ろに動詞をすぐ置いてしまう
    correction: >
      whose の後ろには名詞が必要。
      whose father, whose car, whose name のように使う。
  - mistake: who と whose を混同する
    correction: >
      who は「その人が〜する」。
      whose + 名詞 は「その人の〜が」と所有関係を表す。
  - mistake: 物には whose を使えないと思う
    correction: >
      whose は物にも使える。
      a house whose roof is red のように使う。
      ただし、より硬い表現では of which も使われる。
  - mistake: whose car was stolen の意味を「車が盗んだ」と読む
    correction: >
      whose car は「その人の車」。
      The man whose car was stolen は「車を盗まれた男性」。

learning_notes:
  - >
    whose は「所有関係」を作る関係代名詞。
    先行詞と、whose の後ろの名詞の関係を見る。
  - >
    whose の後ろには必ず名詞が来る。
    whose father, whose car, whose name, whose roof のようにセットで読む。
  - >
    who lives は「その人が住んでいる」。
    whose mother lives は「その人の母親が住んでいる」。
  - >
    関係詞の問題では、空所の直後を見ることが有効。
    空所の直後が名詞なら whose を考える。

