id: g063
file: g063.yaml

title: 関係代名詞 whose
type: construction

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 所有関係を whose + 名詞 で表せるか？

core_concept:
  whose_basic:
    form: 先行詞 + whose + 名詞 + 動詞 ...
    meaning: その人の〜、その物の〜
    image: 前の名詞が、後ろの名詞を所有している
    examples:
      - sentence: I know a girl whose father is a doctor.
        ja: 私は父親が医者である少女を知っている。
        point: a girl と father の所有関係を whose father で表す。
      - sentence: The man whose car was stolen called the police.
        ja: 車を盗まれた男性は警察に電話した。
        point: the man と car の所有関係を whose car で表す。
      - sentence: This is the house whose roof is red.
        ja: これは屋根が赤い家です。
        point: the house と roof の所有関係を whose roof で表す。

  whose_plus_noun:
    form: whose + 名詞
    meaning: 名詞を必ず伴い、その所有者を前の名詞に結びつける
    image: whose は単独ではなく、後ろの名詞とセットで働く
    examples:
      - sentence: I met a student whose brother lives in Canada.
        ja: 私は兄がカナダに住んでいる学生に会った。
        point: whose brother がセット。
      - sentence: She helped a boy whose bicycle was broken.
        ja: 彼女は自転車が壊れていた少年を助けた。
        point: whose bicycle がセット。
      - sentence: We visited a town whose history is very old.
        ja: 私たちは歴史がとても古い町を訪れた。
        point: whose history がセット。

  contrast_with_who:
    form: who + 動詞 / whose + 名詞
    meaning: who は人を主語として説明し、whose は所有関係を説明する
    image: who は「その人が〜する」、whose は「その人の〜が」
    examples:
      - sentence: I know a boy who lives in Kyoto.
        ja: 私は京都に住んでいる少年を知っている。
        point: boy 自身が lives するので who。
      - sentence: I know a boy whose mother lives in Kyoto.
        ja: 私は母親が京都に住んでいる少年を知っている。
        point: boy の mother が lives するので whose mother。
      - sentence: The woman who called me was kind.
        ja: 私に電話してきた女性は親切だった。
        point: woman 自身が called するので who。

main_rule: >
  whose は、所有関係を表す関係代名詞。
  whose の後ろには名詞が来る。
  a girl whose father is a doctor は「父親が医者である少女」。
  a man whose car was stolen は「車を盗まれた男性」。
  who は「その人が〜する」と人を説明する。
  whose は「その人の〜が」「その物の〜が」と所有関係を説明する。
  まず、関係代名詞の後ろに名詞があるかを確認する。
  whose father, whose car, whose name, whose roof のように、whose + 名詞 で見る。

contrast_pairs:
  - who: I know a boy who lives in Kyoto.
    whose: I know a boy whose mother lives in Kyoto.
    point: >
      who lives は boy 自身が住んでいる。
      whose mother lives は boy の mother が住んでいる。

  - who: The man who called me was kind.
    whose: The man whose car was stolen called the police.
    point: >
      who called は man 自身が電話した。
      whose car was stolen は man の car が盗まれた。

  - which: This is a house which stands on the hill.
    whose: This is a house whose roof is red.
    point: >
      which stands は house 自体を説明する。
      whose roof は house の roof を説明する所有関係。

