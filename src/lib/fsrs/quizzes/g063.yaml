    max_threshold_ratio: 0.85

review_questions:
  - id: g063_q001
    question_type: two_choice
    prompt: I know a girl ___ father is a doctor.
    choices:
      - text: whose
        correct: true
      - text: who
        correct: false
    answer: whose
    explanation: >
      father という名詞が後ろにあり、a girl の father を表している。
      所有関係なので whose father が自然。
    translation: 私は父親が医者である少女を知っている。
    focus:
      - whose
      - whose_plus_noun
      - possession

  - id: g063_q002
    question_type: two_choice
    prompt: I know a girl ___ lives near here.
    choices:
      - text: whose
        correct: false
      - text: who
        correct: true
    answer: who
    explanation: >
      後ろに名詞ではなく lives という動詞が続いている。
      girl 自身が住んでいるので who が自然。
    translation: 私はこの近くに住んでいる少女を知っている。
    focus:
      - who
      - subject_relative
      - contrast_with_whose

