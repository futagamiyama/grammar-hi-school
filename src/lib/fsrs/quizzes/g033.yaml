id: g033
file: g033.yaml

title: 進行形の受動態
type: construction

section:
  id: s04
  title: 受動態・態

level: basic
target: 高校英文法基礎

core_question: 今まさに行われている受け身か？

core_concept:
  simple_passive:
    form: be + 過去分詞
    meaning: される・されているという事実や状態を表す
    image: 普段そうされる / すでにそういう状態である
    examples:
      - sentence: This room is cleaned every day.
        ja: この部屋は毎日掃除される。
        point: 毎日の習慣的な受動態。
      - sentence: English is spoken in many countries.
        ja: 英語は多くの国で話されている。
        point: 一般的な事実を表す受動態。
      - sentence: The door is locked.
        ja: そのドアには鍵がかかっている。
        point: 現在の状態を表す受動態。

  progressive_passive:
    form: be + being + 過去分詞
    meaning: 今まさに〜されている、現在作業中であることを表す
    image: 受け身の動作が今進行中
    examples:
      - sentence: This room is being cleaned now.
        ja: この部屋は今掃除されている。
        point: 掃除という作業が今進行中。
      - sentence: The road is being repaired.
        ja: その道路は修理中だ。
        point: 修理という作業が今行われている。
      - sentence: A new bridge is being built.
        ja: 新しい橋が建設中だ。
        point: 建設が現在進行中。

main_rule: >
  通常の受動態 be + 過去分詞は、「される」「されている」という事実や状態を表す。
  進行形の受動態 be + being + 過去分詞は、
  「今まさに〜されている」「現在作業中である」という意味を表す。
  being は「受動態の動作が進行中である」ことを示す。

contrast_pairs:
  - simple_passive: This room is cleaned every day.
    progressive_passive: This room is being cleaned now.
    point: >
      is cleaned は毎日の習慣。
      is being cleaned は今掃除中。

  - simple_passive: The road is repaired every year.
    progressive_passive: The road is being repaired now.
    point: >
      is repaired は定期的に修理されること。
      is being repaired は今修理されていること。

  - simple_passive: The bridge was built in 1990.
    progressive_passive: The bridge was being built when I visited the town.
    point: >
      was built は完成した事実。
      was being built はその過去の時点で建設中だったこと。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

