    max_threshold_ratio: 0.85

review_questions:
  - id: g119_q001
    question_type: two_choice
    prompt: I have lived here ___ three years.
    choices:
      - text: for
        correct: true
      - text: since
        correct: false
    answer: for
    explanation: >
      three years は時間の長さ。
      期間の長さには for を使う。
    translation: 私はここに3年間住んでいます。
    focus:
      - for_duration
      - duration
      - three_years

  - id: g119_q002
    question_type: two_choice
    prompt: I have lived here ___ 2020.
    choices:
      - text: since
        correct: true
      - text: for
        correct: false
    answer: since
    explanation: >
      2020 は継続の起点。
      起点を表すので since 2020 が正しい。
    translation: 私は2020年以来ここに住んでいます。
    focus:
      - since_starting_point
      - starting_point
      - twenty_twenty

  - id: g119_q003
    question_type: two_choice
    prompt: She studied ___ two hours.
    choices:
      - text: for
        correct: true
      - text: during
        correct: false
    answer: for
    explanation: >
      two hours は時間の長さ。
      どれくらい勉強したかを表すので for。
    translation: 彼女は2時間勉強した。
    focus:
      - for_duration
      - two_hours
      - studied

  - id: g119_q004
    question_type: two_choice
    prompt: She has been sick ___ Monday.
    choices:
      - text: since
        correct: true
      - text: for
        correct: false
    answer: since
    explanation: >
      Monday は病気が始まった起点。
      起点を表すので since Monday。
    translation: 彼女は月曜日からずっと病気です。
    focus:
      - since_starting_point
      - monday
      - sick

  - id: g119_q005
    question_type: two_choice
    prompt: I have known him ___ I was a child.
    choices:
      - text: since
        correct: true
      - text: during
        correct: false
    answer: since
    explanation: >
      I was a child は「子供だったころ」という起点を表す文。
      since の後ろには起点を表す文も置ける。
    translation: 私は子供のころから彼を知っています。
    focus:
      - since_starting_point
      - since_clause
      - child

  - id: g119_q006
    question_type: two_choice
    prompt: I fell asleep ___ the movie.
    choices:
      - text: during
        correct: true
      - text: for
        correct: false
    answer: during
    explanation: >
      the movie は出来事・期間の枠。
      その映画の間に眠ったので during を使う。
    translation: 私は映画の間に眠ってしまった。
    focus:
      - during_period_event
      - movie
      - period_event

  - id: g119_q007
    question_type: two_choice
    prompt: No one spoke ___ the meeting.
    choices:
      - text: during
        correct: true
      - text: since
        correct: false
    answer: during
    explanation: >
      the meeting は会議という期間の枠。
      その間の出来事を表すので during。
    translation: 会議中、誰も話さなかった。
    focus:
      - during_period_event
      - meeting
      - during

  - id: g119_q008
    question_type: two_choice
    prompt: I studied ___ midnight.
    choices:
      - text: until
        correct: true
      - text: by
        correct: false
    answer: until
    explanation: >
      勉強が真夜中まで続いたことを表している。
      継続の終点には until を使う。
    translation: 私は真夜中まで勉強した。
    focus:
      - until_continuation_endpoint
      - continuation
      - midnight

  - id: g119_q009
    question_type: two_choice
    prompt: Wait here ___ I come back.
    choices:
      - text: until
        correct: true
      - text: by
        correct: false
    answer: until
    explanation: >
      戻る時点まで待つ状態が続く。
      「〜までずっと」は until。
    translation: 私が戻るまでここで待っていてください。
    focus:
      - until_continuation_endpoint
      - until_clause
      - come_back

  - id: g119_q010
    question_type: two_choice
    prompt: Please finish this ___ Friday.
    choices:
      - text: by
        correct: true
      - text: until
        correct: false
    answer: by
    explanation: >
      金曜日は完了の期限。
      「金曜日までに終える」なので by Friday。
    translation: 金曜日までにこれを終えてください。
    focus:
      - by_deadline
      - deadline
      - friday

  - id: g119_q011
    question_type: two_choice
    prompt: I will be back ___ six.
    choices:
      - text: by
        correct: true
      - text: until
        correct: false
    answer: by
    explanation: >
      6時までには戻る、という期限を表している。
      完了の期限には by を使う。
    translation: 私は6時までには戻ります。
    focus:
      - by_deadline
      - by_six
      - deadline

  - id: g119_q012
    question_type: two_choice
    prompt: We talked ___ an hour ___ the meeting.
    choices:
      - text: for / during
        correct: true
      - text: during / for
        correct: false
    answer: for / during
    explanation: >
      an hour は時間の長さなので for an hour。
      the meeting は期間の枠なので during the meeting。
    translation: 私たちは会議中に1時間話した。
    focus:
      - for_vs_during
      - for_duration
      - during_period

common_mistakes:
  - mistake: for と since をどちらも「〜から」と考える
    correction: >
      for は時間の長さ。
      since は始まりの時点。
      for three years / since 2020 を区別する。
  - mistake: during の後ろに時間の長さだけを置く
    correction: >
      during は出来事・期間名を後ろに取る。
      during the meeting は自然だが、during two hours ではなく for two hours。
  - mistake: until と by をどちらも「まで」とだけ覚える
    correction: >
      until は継続の終点。
      by は完了の期限。
      study until midnight / finish by Friday。
  - mistake: since の後ろは年だけだと思う
    correction: >
      since の後ろには、Monday, 2020, last year, I was a child など、
      起点を表す語句や文が来る。
  - mistake: for an hour during the meeting のように二つの前置詞が必要な場面を一つで処理する
    correction: >
      for an hour は長さ。
      during the meeting は期間の枠。
      役割が違うので両方使える。

learning_notes:
  - >
    for は期間の長さ。
    for three years / for two hours / for a week。
  - >
    since は起点。
    since 2020 / since Monday / since I was a child。
  - >
    during は期間の枠。
    during the movie / during lunch / during the meeting。
  - >
    until は継続の終点。
    I studied until midnight.。
  - >
    by は完了の期限。
    Please finish this by Friday.。
  - >
    日本語の「まで」に引きずられず、
    継続なら until、期限なら by と判断する。

