id: g119
file: g119.yaml

title: 時間を表す前置詞 for / since / during / until / by
type: grammar_contrast

section:
  id: s12
  title: 前置詞

level: basic
target: 高校英文法基礎

core_question: for / since / during / until / by を、期間・起点・期間中・継続の終点・期限で使い分けられるか？

core_concept:
  for_duration:
    form: for + 期間
    meaning: 〜の間
    image: 時間の長さを表す
    examples:
      - sentence: I have lived here for three years.
        ja: 私はここに3年間住んでいます。
        point: three years は時間の長さなので for。
      - sentence: She studied for two hours.
        ja: 彼女は2時間勉強した。
        point: two hours は期間を表す。
      - sentence: We stayed there for a week.
        ja: 私たちはそこに1週間滞在した。
        point: a week は長さなので for。

  since_starting_point:
    form: since + 起点
    meaning: 〜以来、〜からずっと
    image: ある時点から現在・過去のある時点まで続く
    examples:
      - sentence: I have lived here since 2020.
        ja: 私は2020年以来ここに住んでいます。
        point: 2020 は期間の起点なので since。
      - sentence: She has been sick since Monday.
        ja: 彼女は月曜日からずっと病気です。
        point: Monday は始まりの時点。
      - sentence: I have known him since I was a child.
        ja: 私は子供のころから彼を知っています。
        point: since の後ろには文も置ける。

  during_period_event:
    form: during + 名詞句
    meaning: 〜の間に、〜の間ずっと
    image: ある出来事・期間の中で
    examples:
      - sentence: I fell asleep during the movie.
        ja: 私は映画の間に眠ってしまった。
        point: the movie という出来事の期間中。
      - sentence: We talked during lunch.
        ja: 私たちは昼食中に話した。
        point: lunch という時間の中。
      - sentence: No one spoke during the meeting.
        ja: 会議中、誰も話さなかった。
        point: the meeting は名詞句なので during。

  until_continuation_endpoint:
    form: until + 時点・文
    meaning: 〜までずっと
    image: その時点まで状態・動作が続く
    examples:
      - sentence: I studied until midnight.
        ja: 私は真夜中まで勉強した。
        point: 勉強が真夜中まで続いた。
      - sentence: Wait here until I come back.
        ja: 私が戻るまでここで待っていてください。
        point: 待つ状態が戻る時まで続く。
      - sentence: He stayed in the office until late.
        ja: 彼は遅くまで事務所にいた。
        point: 滞在が遅い時間まで続いた。

  by_deadline:
    form: by + 時点
    meaning: 〜までに
    image: その時点を期限として、それ以前に完了する
    examples:
      - sentence: Please finish this by Friday.
        ja: 金曜日までにこれを終えてください。
        point: Friday は完了の期限なので by。
      - sentence: I will be back by six.
        ja: 私は6時までには戻ります。
        point: 6時以前に戻るという期限。
      - sentence: Submit the report by tomorrow.
        ja: 明日までに報告書を提出してください。
        point: tomorrow が提出の締め切り。

  for_vs_during:
    form: for + 長さ / during + 出来事・期間名
    meaning: 〜の間 / 〜の間に
    image: for は時間の量、during は期間の枠
    examples:
      - sentence: I slept for eight hours.
        ja: 私は8時間眠った。
        point: eight hours は時間の長さなので for。
      - sentence: I slept during the flight.
        ja: 私は飛行中に眠った。
        point: the flight という出来事の間なので during。
      - sentence: We talked for an hour during the meeting.
        ja: 私たちは会議中に1時間話した。
        point: for an hour は長さ、during the meeting は期間の枠。

main_rule: >
  時間を表す前置詞は、日本語ではどれも「〜に」「〜から」「〜まで」と訳されやすいが、
  英語では時間の見方が違う。
  for は時間の長さを表す。
  for three years / for two hours / for a week の形。
  since は継続の起点を表す。
  since 2020 / since Monday / since I was a child の形。
  during は出来事や期間の中で起こることを表す。
  during the movie / during lunch / during the meeting の形。
  until は「〜までずっと」で、状態・動作がその時点まで続くことを表す。
  I studied until midnight. は勉強が真夜中まで続いたという意味。
  by は「〜までに」で、期限までに完了することを表す。
  Please finish this by Friday. は金曜日までに終えるという締め切り。
  for は長さ、since は起点、during は期間の枠、until は継続の終点、by は完了の期限と考える。

contrast_pairs:
  - duration: I have lived here for three years.
    starting_point: I have lived here since 2020.
    point: >
      for は時間の長さ。
      since は始まりの時点。

  - duration: I slept for eight hours.
    period_event: I slept during the flight.
    point: >
      for eight hours は眠った長さ。
      during the flight は飛行中という期間の枠。

  - continuation: I studied until midnight.
    deadline: Please finish this by Friday.
    point: >
      until はその時まで動作が続く。
      by はその時までに完了する。

  - until: Wait here until I come back.
    by: I will be back by six.
    point: >
      until は待つ状態が続く。
      by は戻る期限を表す。

