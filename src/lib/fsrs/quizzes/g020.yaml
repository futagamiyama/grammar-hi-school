common_mistakes:
  - mistake: 日本語の「所有している」につられて is owning とする
    correction: >
      own は所有関係を表す状態動詞なので、現在の所有でも He owns a house. のように現在形を使う。

  - mistake: 「所属している」を be belonging to とする
    correction: >
      belong は所属・所有関係を表す状態動詞なので、This book belongs to me. が自然。

  - mistake: 「意味している」を is meaning とする
    correction: >
      mean は意味を表す状態動詞なので、This word means "hope." のように現在形を使う。

  - mistake: 値段を聞くときに How much is this costing? とする
    correction: >
      値段を尋ねる基本形は How much does this cost?。
      cost は価格を表す状態動詞として扱う。

learning_notes:
  - >
    cost, own, belong, mean は、現在のことでも現在進行形にしないのが基本。
  - >
    日本語の「〜している」は、英語では現在形になることが多い。
    「所有している」「所属している」「意味している」は、動作ではなく状態・関係である。
  - >
    現在進行形は「今まさにしている動作」に向いている。
    価格・所有・所属・意味のような内容には、ふつう現在形を使う。
  - >
    cost は、実際の英語では The delay is costing us money. のように、
    継続的に損害・費用を発生させている場合に進行形になることがある。
    ただし、このカードでは高校基礎として「値段が〜である」の cost を扱う。

