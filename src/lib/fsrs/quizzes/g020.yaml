id: g020
file: g020.yaml

title: cost / own / belong / mean の状態動詞
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 価格・所有・所属・意味を表す状態動詞を、現在形で自然に使えるか？

core_concept:
  overview: >
    cost, own, belong, mean は、動作というより「価格」「所有」「所属」「意味」という状態・関係を表す。
    そのため、現在のことを表していても現在進行形ではなく、現在形を使うのが基本。
    日本語では「〜している」と訳せることがあるが、英語では「今している動作」ではなく、
    その時点で成り立っている状態・関係として考える。

  cost:
    meaning: 値段が〜である・費用がかかる
    typical_form: 現在形
    example: This bag costs 100 dollars.
    ja: このバッグは100ドルする。
    point: 値段という状態を述べているので costs が自然。

  own:
    meaning: 所有している
    typical_form: 現在形
    example: She owns two cars.
    ja: 彼女は車を2台所有している。
    point: 所有関係を述べているので owns が自然。

  belong:
    meaning: 所属している・〜のものである
    typical_form: 現在形
    example: This book belongs to me.
    ja: この本は私のものだ。
    point: 所属・所有関係を述べているので belongs が自然。

  mean:
    meaning: 意味する
    typical_form: 現在形
    example: This word means "freedom."
    ja: この単語は「自由」を意味する。
    point: 語や文の意味を述べているので means が自然。

main_rule: >
  cost, own, belong, mean は、基本的に状態や関係を表す動詞なので、
  「今そうである」と言いたい場合でも現在形を使う。
  現在進行形は「今まさに行っている動作」を表す形なので、価格・所有・所属・意味のような
  動作でない内容にはふつう使わない。

contrast_pairs:
  - natural: This shirt costs 30 dollars.
    unnatural: This shirt is costing 30 dollars.
    point: >
      シャツの値段を述べているので、状態を表す costs が自然。

  - natural: My uncle owns a small restaurant.
    unnatural: My uncle is owning a small restaurant.
    point: >
      レストランを所有しているという関係を述べているので、owns が自然。

  - natural: This key belongs to my sister.
    unnatural: This key is belonging to my sister.
    point: >
      鍵が誰のものかを述べているので、belongs が自然。

  - natural: This sign means "danger."
    unnatural: This sign is meaning "danger."
    point: >
      標識の意味を述べているので、means が自然。

  - natural: The house costs too much for us.
    unnatural: The house is costing too much for us.
    point: >
      家の価格が高すぎるという状態を述べているので、costs が自然。

  - natural: He owns this land.
    unnatural: He is owning this land.
    point: >
      土地の所有関係を述べているので、現在形 owns が自然。

