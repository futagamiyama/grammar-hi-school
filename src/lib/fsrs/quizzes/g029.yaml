id: g029
file: g029.yaml

title: must have 過去分詞
type: grammar_contrast

section:
  id: s03
  title: 助動詞・法

level: basic
target: 高校英文法基礎

core_question: 過去について強く推量しているか？

core_concept:
  must_have_past_participle:
    form: must have + 過去分詞
    meaning: 過去のことについて「〜したに違いない」「〜だったに違いない」と強く推量する
    image: 今ある証拠から、過去に起きたことをかなり確信している
    examples:
      - sentence: He must have missed the train.
        ja: 彼は電車に乗り遅れたに違いない。
        point: 今ここにいないなどの状況から、過去に電車を逃したと強く推量している。
      - sentence: She must have been tired.
        ja: 彼女は疲れていたに違いない。
        point: 彼女の様子や結果から、過去の状態を強く推量している。
      - sentence: You must have heard the news.
        ja: 君はそのニュースを聞いたに違いない。
        point: すでに知っていそうな状況から、過去に聞いたと推量している。

  must_base_verb:
    form: must + 動詞の原形
    meaning: 現在・未来についての義務、または現在についての強い推量を表す
    image: 今そうしなければならない / 今そうに違いない
    examples:
      - sentence: You must finish this today.
        ja: あなたは今日これを終えなければならない。
        point: 現在・未来に向けた義務を表している。
      - sentence: He must be tired.
        ja: 彼は疲れているに違いない。
        point: 現在の状態について強く推量している。

main_rule: >
  must have + 過去分詞は、過去の出来事や状態について
  「〜したに違いない」「〜だったに違いない」と強く推量する形。
  must + 動詞の原形は、現在・未来の義務や現在の推量を表す。
  「must = 〜しなければならない」とだけ覚えると、
  must have 過去分詞を誤解しやすい。

contrast_pairs:
  - present_or_future: He must leave now.
    past_inference: He must have left already.
    point: >
      must leave は「今出発しなければならない」。
      must have left は「すでに出発したに違いない」。

  - present_inference: She must be tired.
    past_inference: She must have been tired.
    point: >
      must be tired は現在の状態への推量。
      must have been tired は過去の状態への推量。

  - obligation: You must tell him the truth.
    past_inference: You must have told him the truth.
    point: >
      must tell は義務。
      must have told は過去に言ったに違いないという推量。

