review_questions:
  - id: g029_q001
    question_type: two_choice
    prompt: He is not here. He ___ the train.
    choices:
      - text: must miss
        correct: false
      - text: must have missed
        correct: true
    answer: must have missed
    explanation: >
      He is not here という現在の状況から、
      過去に電車に乗り遅れたと強く推量している。
      過去への推量なので must have missed が自然。
    translation: 彼はここにいない。彼は電車に乗り遅れたに違いない。
    focus:
      - past_inference
      - must_have_past_participle

  - id: g029_q002
    question_type: two_choice
    prompt: You look exhausted. You ___ hard today.
    choices:
      - text: must work
        correct: false
      - text: must have worked
        correct: true
    answer: must have worked
    explanation: >
      今疲れて見えることから、今日すでに一生懸命働いたと推量している。
      過去の行為への推量なので must have worked が自然。
    translation: とても疲れて見える。今日は一生懸命働いたに違いない。
    focus:
      - evidence_now
      - past_inference
      - must_have_past_participle

  - id: g029_q003
    question_type: two_choice
    prompt: She knew all the details. She ___ the report.
    choices:
      - text: must have read
        correct: true
      - text: must read
        correct: false
    answer: must have read
    explanation: >
      詳細を知っていたという過去の状況から、
      それ以前に報告書を読んだと推量している。
      must have read が自然。
    translation: 彼女は詳細を全部知っていた。報告書を読んだに違いない。
    focus:
      - past_evidence
      - past_inference
      - must_have_past_participle

  - id: g029_q004
    question_type: two_choice
    prompt: The ground is wet. It ___ last night.
    choices:
      - text: must have rained
        correct: true
      - text: must rain
        correct: false
    answer: must have rained
    explanation: >
      地面が濡れているという現在の証拠から、
      昨夜雨が降ったと推量している。
      last night の過去なので must have rained が自然。
    translation: 地面が濡れている。昨夜雨が降ったに違いない。
    focus:
      - evidence_now
      - last_night
      - past_inference

  - id: g029_q005
    question_type: two_choice
    prompt: He ___ very rich. Look at that huge house.
    choices:
      - text: must be
        correct: true
      - text: must have been
        correct: false
    answer: must be
    explanation: >
      今見ている大きな家から、現在お金持ちだと推量している。
      現在の状態への推量なので must be が自然。
    translation: 彼はとても裕福に違いない。あの大きな家を見て。
    focus:
      - present_inference
      - must_base_verb

  - id: g029_q006
    question_type: two_choice
    prompt: He looked very rich when I met him. He ___ a successful businessman.
    choices:
      - text: must be
        correct: false
      - text: must have been
        correct: true
    answer: must have been
    explanation: >
      when I met him により過去の時点の話をしている。
      その時、成功した実業家だったに違いないという推量なので
      must have been が自然。
    translation: 会った時、彼はとても裕福に見えた。成功した実業家だったに違いない。
    focus:
      - past_state
      - must_have_been
      - past_inference

  - id: g029_q007
    question_type: two_choice
    prompt: I cannot find my keys. I ___ them at home.
    choices:
      - text: must leave
        correct: false
      - text: must have left
        correct: true
    answer: must have left
    explanation: >
      鍵が見つからないという現在の状況から、
      過去に家に置いてきたと推量している。
      must have left が自然。
    translation: 鍵が見つからない。家に置いてきたに違いない。
    focus:
      - evidence_now
      - past_action
      - must_have_past_participle

  - id: g029_q008
    question_type: two_choice
    prompt: She passed the exam easily. She ___ a lot.
    choices:
      - text: must study
        correct: false
      - text: must have studied
        correct: true
    answer: must have studied
    explanation: >
      試験に楽に合格したという結果から、
      それ以前にたくさん勉強したと推量している。
      must have studied が自然。
    translation: 彼女は試験に楽に合格した。たくさん勉強したに違いない。
    focus:
      - result_to_cause
      - past_inference
      - must_have_past_participle

  - id: g029_q009
    question_type: two_choice
    prompt: You ___ tired after such a long trip.
    choices:
      - text: must be
        correct: true
      - text: must have been
        correct: false
    answer: must be
    explanation: >
      長旅の後で、今疲れているに違いないと言っている。
      現在の状態への推量なので must be が自然。
    translation: そんな長旅の後だから、あなたは疲れているに違いない。
    focus:
      - present_inference
      - present_state
      - must_base_verb

  - id: g029_q010
    question_type: two_choice
    prompt: You looked tired yesterday. You ___ exhausted.
    choices:
      - text: must be
        correct: false
      - text: must have been
        correct: true
    answer: must have been
    explanation: >
      yesterday があるので、過去の状態について推量している。
      must have been exhausted が自然。
    translation: 昨日疲れて見えた。とても疲れていたに違いない。
    focus:
      - yesterday
      - past_state
      - must_have_been

  - id: g029_q011
    question_type: two_choice
    prompt: The door is locked. Someone ___ it.
    choices:
      - text: must lock
        correct: false
      - text: must have locked
        correct: true
    answer: must have locked
    explanation: >
      ドアが今ロックされているという結果から、
      誰かが過去にロックしたと推量している。
      must have locked が自然。
    translation: ドアに鍵がかかっている。誰かが鍵をかけたに違いない。
    focus:
      - result_now
      - past_action
      - must_have_past_participle

  - id: g029_q012
    question_type: two_choice
    prompt: This problem is very difficult. It ___ hard for many students.
    choices:
      - text: must be
        correct: true
      - text: must have been
        correct: false
    answer: must be
    explanation: >
      この問題が今難しいという話なので、
      現在の状態についての推量 must be が自然。
    translation: この問題はとても難しい。多くの生徒には難しいに違いない。
    focus:
      - present_inference
      - must_base_verb

common_mistakes:
  - mistake: must have を「持っているに違いない」と読んでしまう
    correction: >
      must have + 過去分詞 の have は完了形を作る助動詞。
      「持つ」という意味ではない。
  - mistake: must をすべて「〜しなければならない」と訳す
    correction: >
      must は義務だけでなく、強い推量も表す。
      must have 過去分詞では、過去についての強い推量になる。
  - mistake: 過去の推量なのに must + 動詞の原形を選んでしまう
    correction: >
      過去について「〜したに違いない」と言うときは
      must have + 過去分詞を使う。

learning_notes:
  - >
    must have + 過去分詞は、今ある証拠や結果から、
    過去に起きたことを強く推量する表現。
  - >
    must be は現在の状態への推量。
    must have been は過去の状態への推量。
  - >
    must do は義務を表すことが多いが、
    must have done は義務ではなく過去への推量として読む。
  - >
    should have 過去分詞は「すべきだった」という後悔・批判。
    must have 過去分詞は「したに違いない」という推量。
    この2つを混同しない。

