id: g039
file: g039.yaml

title: 不定詞 vs 動名詞
type: grammar_contrast

section:
  id: s05
  title: 不定詞・動名詞・分詞

level: basic
target: 高校英文法基礎

core_question: これからすることか、すでにある行為・一般的行為か？

core_concept:
  infinitive:
    form: to + 動詞の原形
    meaning: これからすること、目的、予定、意志、可能性を表しやすい
    image: 未来へ向かう動き
    examples:
      - sentence: I want to study abroad.
        ja: 私は留学したい。
        point: これからしたいことなので to study。
      - sentence: She decided to join the club.
        ja: 彼女はそのクラブに入ることを決めた。
        point: 決めた後にする行為なので to join。
      - sentence: I went to the library to study.
        ja: 私は勉強するために図書館へ行った。
        point: 目的を表す to study。

  gerund:
    form: 動詞のing形
    meaning: すでにある行為、経験、習慣、一般的な活動を名詞のように表す
    image: 行為そのものをひとまとまりの名詞として見る
    examples:
      - sentence: I enjoy reading books.
        ja: 私は本を読むことを楽しむ。
        point: 読書という活動そのものなので reading。
      - sentence: She finished writing the report.
        ja: 彼女は報告書を書き終えた。
        point: すでに進んでいた行為を終えたので writing。
      - sentence: Swimming is good exercise.
        ja: 泳ぐことはよい運動だ。
        point: 一般的な活動を主語にしているので Swimming。

main_rule: >
  不定詞 to do は、これからすること、目的、予定、意志など、
  未来へ向かう感覚を持ちやすい。
  動名詞 doing は、すでにある行為、経験、習慣、一般的な活動を
  名詞のように表す。
  ただし、実際には動詞ごとに to do を取るか doing を取るかが決まる場合が多い。
  want, decide, hope, plan などは to do を取りやすく、
  enjoy, finish, avoid, mind などは doing を取りやすい。

contrast_pairs:
  - infinitive: I want to read this book.
    gerund: I enjoy reading books.
    point: >
      want はこれからしたいことなので to read。
      enjoy は行為そのものを楽しむので reading。

  - infinitive: She decided to leave early.
    gerund: She finished writing the report.
    point: >
      decide はこれからする行為を決める。
      finish はすでに行っていた行為を終える。

  - infinitive: To learn English takes time.
    gerund: Learning English takes time.
    point: >
      どちらも主語として使えるが、一般的な活動としては
      Learning English の方が自然なことが多い。

