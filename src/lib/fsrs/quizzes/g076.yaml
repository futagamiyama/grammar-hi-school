common_mistakes:
  - mistake: It is time we go home. と現在形を使ってしまう
    correction: >
      It is time + 主語 + 動詞 の形では、仮定法的に過去形を使う。
      It is time we went home. が自然。
  - mistake: It is time we went home. を過去の話だと思う
    correction: >
      went は過去の意味ではない。
      「そろそろ帰るべきだ」という現在の促しを表す。
  - mistake: It is time to went home. としてしまう
    correction: >
      It is time to + 動詞原形。
      It is time to go home. が正しい。
  - mistake: It is time for you went to bed. としてしまう
    correction: >
      It is time for 人 to do の形では、to + 動詞原形を使う。
      It is time for you to go to bed. が正しい。
  - mistake: It is high time の強さを読み落とす
    correction: >
      It is high time は「とっくに〜すべき時だ」という強い促し・批判を含む。

learning_notes:
  - >
    It is time + 主語 + 過去形 は、現在の促しを表す。
    過去形だが、過去の意味ではない。
  - >
    It is time we went home. は「そろそろ帰る時間だ」。
    まだ帰っていないことが前提。
  - >
    It is high time は、普通の It is time より強く、
    「もう遅いくらいだ」という響きがある。
  - >
    It is time to do / It is time for 人 to do は普通の不定詞表現。
    仮定法の過去形と混同しない。

