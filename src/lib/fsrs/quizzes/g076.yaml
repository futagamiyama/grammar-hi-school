id: g076
file: g076.yaml

title: It is time + 仮定法
type: construction

section:
  id: s09
  title: 仮定法

level: basic
target: 高校英文法基礎

core_question: It is time の後ろで過去形を使う感覚を理解できるか？

core_concept:
  it_is_time_subjunctive:
    form: It is time + 主語 + 過去形
    meaning: もう〜してよい時間だ、そろそろ〜すべき時だ
    image: 本来ならもう起きているべきことが、まだ起きていない
    examples:
      - sentence: It is time we went home.
        ja: そろそろ私たちは家に帰る時間だ。
        point: 実際にはまだ帰っていないが、もう帰るべき時だという意味。
      - sentence: It is time you went to bed.
        ja: もうあなたは寝る時間だ。
        point: 実際にはまだ寝ていない。
      - sentence: It is time he started working.
        ja: そろそろ彼は働き始めるべき時だ。
        point: まだ働き始めていないことへの促し。

  high_time:
    form: It is high time + 主語 + 過去形
    meaning: とっくに〜すべき時だ
    image: もう遅いくらいだという強い促し
    examples:
      - sentence: It is high time we left.
        ja: 私たちはとっくに出発すべき時間だ。
        point: もう出発していてもよいくらいだという強い意味。
      - sentence: It is high time you apologized.
        ja: あなたはとっくに謝るべき時だ。
        point: 謝るのが遅れているという含み。
      - sentence: It is high time the government took action.
        ja: 政府はとっくに行動を起こすべき時だ。
        point: まだ行動が遅いという批判を含む。

  time_to_do:
    form: It is time to + 動詞原形
    meaning: 〜する時間だ
    image: 誰がするかを強く出さない普通の表現
    examples:
      - sentence: It is time to go home.
        ja: 家に帰る時間だ。
        point: to go は普通の不定詞。
      - sentence: It is time to start the meeting.
        ja: 会議を始める時間だ。
        point: 主語を出さず、一般的に「始める時間だ」と言う。
      - sentence: It is time for us to leave.
        ja: 私たちが出発する時間だ。
        point: for us to leave で動作主を示せる。

main_rule: >
  It is time + 主語 + 過去形 は、「そろそろ〜すべき時だ」「もう〜してよい時間だ」を表す。
  形は過去形だが、過去の意味ではない。
  It is time we went home. は「そろそろ帰る時間だ」という現在の促し。
  実際にはまだ帰っていないが、もう帰るべき時だという気持ちがある。
  It is high time はさらに強く、「とっくに〜すべき時だ」という意味。
  一方、It is time to go home. は普通の不定詞で、「帰る時間だ」という一般的な表現。

contrast_pairs:
  - subjunctive: It is time we went home.
    infinitive: It is time to go home.
    point: >
      we went home は、主語 we を出して「私たちがそろそろ帰るべきだ」と言う形。
      to go home は、一般的に「帰る時間だ」と言う形。

  - normal: It is time you went to bed.
    stronger: It is high time you went to bed.
    point: >
      It is time は「そろそろ〜すべき時だ」。
      It is high time は「とっくに〜すべき時だ」とさらに強い。

  - past_meaning: We went home at nine.
    subjunctive_meaning: It is time we went home.
    point: >
      We went home は本当の過去。
      It is time we went home の went は仮定法的な過去形で、現在の促しを表す。

