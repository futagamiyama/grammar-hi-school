    answer: went
    explanation: >
      It is time + 主語 + 過去形 の形。
      went は過去の意味ではなく、「そろそろ帰るべきだ」という現在の促しを表す。
    translation: そろそろ私たちは家に帰る時間だ。
    focus:
      - it_is_time_subjunctive
      - went
      - present_meaning

