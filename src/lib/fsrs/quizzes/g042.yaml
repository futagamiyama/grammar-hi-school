id: g042
file: g042.yaml

title: stop to do vs stop doing
type: verb_usage

section:
  id: s05
  title: 不定詞・動名詞・分詞

level: basic
target: 高校英文法基礎

core_question: するために止まるのか、していることをやめるのか？

core_concept:
  stop_to_do:
    form: stop + to do
    meaning: 何かをするために立ち止まる・中断する
    image: 今していることを止めて、別の行為をする
    examples:
      - sentence: He stopped to take a rest.
        ja: 彼は休憩するために立ち止まった。
        point: 止まった目的が to take a rest。
      - sentence: She stopped to talk to her friend.
        ja: 彼女は友人と話すために立ち止まった。
        point: 話すために動きを止めた。
      - sentence: We stopped to look at the map.
        ja: 私たちは地図を見るために立ち止まった。
        point: 地図を見ることが止まった目的。

  stop_doing:
    form: stop + doing
    meaning: していることをやめる
    image: その行為自体を中止する
    examples:
      - sentence: He stopped smoking.
        ja: 彼はタバコを吸うのをやめた。
        point: smoking という行為をやめた。
      - sentence: Stop talking.
        ja: 話すのをやめなさい。
        point: talking という行為を中止する。
      - sentence: It stopped raining.
        ja: 雨がやんだ。
        point: raining という動作・状態が終わった。

main_rule: >
  stop to do は「〜するために立ち止まる・中断する」。
  stop doing は「〜するのをやめる」。
  to do は、止まった後にする目的を表す。
  doing は、やめる対象そのものを表す。
  日本語ではどちらも「止まる」「やめる」と訳せるため、
  その行為をするために止まったのか、その行為自体をやめたのかで判断する。

contrast_pairs:
  - purpose: He stopped to smoke.
    stopped_activity: He stopped smoking.
    point: >
      stopped to smoke は、タバコを吸うために立ち止まった。
      stopped smoking は、タバコを吸うのをやめた。

  - purpose: She stopped to talk.
    stopped_activity: She stopped talking.
    point: >
      stopped to talk は、話すために立ち止まった。
      stopped talking は、話すのをやめた。

  - purpose: We stopped to take pictures.
    stopped_activity: We stopped taking pictures.
    point: >
      stopped to take pictures は、写真を撮るために立ち止まった。
      stopped taking pictures は、写真を撮るのをやめた。

