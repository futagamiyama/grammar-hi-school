id: g045
file: g045.yaml

title: too ... to do
type: construction

section:
  id: s05
  title: 不定詞・動名詞・分詞

level: basic
target: 高校英文法基礎

core_question: あまりに〜なのでできない、を判断できるか？

core_concept:
  too_to_do:
    form: too + 形容詞/副詞 + to do
    meaning: あまりに〜なので、〜できない
    image: 程度が強すぎて、後ろの行為が不可能になる
    examples:
      - sentence: This box is too heavy to carry.
        ja: この箱は重すぎて運べない。
        point: 重さが強すぎて、運ぶことができない。
      - sentence: He is too young to drive.
        ja: 彼は若すぎて運転できない。
        point: 若すぎるため、運転できない。
      - sentence: The tea is too hot to drink.
        ja: そのお茶は熱すぎて飲めない。
        point: 熱すぎるため、飲むことができない。

  so_that_cannot:
    form: so + 形容詞/副詞 + that + 主語 + cannot do
    meaning: とても〜なので、〜できない
    image: too ... to do を文で言い換える形
    examples:
      - sentence: This box is so heavy that I cannot carry it.
        ja: この箱はとても重いので、私は運べない。
        point: too heavy to carry と近い意味。
      - sentence: He is so young that he cannot drive.
        ja: 彼はとても若いので、運転できない。
        point: too young to drive と近い意味。
      - sentence: The tea is so hot that I cannot drink it.
        ja: そのお茶はとても熱いので、私は飲めない。
        point: too hot to drink と近い意味。

main_rule: >
  too ... to do は「あまりに〜なので、〜できない」という意味を表す。
  too の後ろには形容詞・副詞が来て、その後に to do が続く。
  too heavy to carry は「重すぎて運べない」。
  too young to drive は「若すぎて運転できない」。
  so ... that 主語 cannot do に言い換えられることが多い。
  too は単なる very ではなく、「程度が強すぎて不可能」という否定的な結果を含む。

contrast_pairs:
  - too_to_do: This box is too heavy to carry.
    so_that: This box is so heavy that I cannot carry it.
    point: >
      too heavy to carry は「重すぎて運べない」。
      so heavy that I cannot carry it と近い意味。

  - too_to_do: He is too young to drive.
    so_that: He is so young that he cannot drive.
    point: >
      too young to drive は「若すぎて運転できない」。
      単に「とても若い」ではなく、不可能の意味を含む。

  - too_to_do: The problem is too difficult for me to solve.
    so_that: The problem is so difficult that I cannot solve it.
    point: >
      for me を入れると「私には〜できない」という意味を明示できる。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または too ... to do の否定的な意味を説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g045_q001
    question_type: two_choice
    prompt: This box is too heavy ___.
    choices:
      - text: to carry
        correct: true
      - text: carrying
        correct: false
    answer: to carry
    explanation: >
      too ... to do の形。
      「重すぎて運べない」という意味なので too heavy to carry が自然。
    translation: この箱は重すぎて運べない。
    focus:
      - too_to_do
      - too_heavy_to_carry
      - impossibility

  - id: g045_q002
    question_type: two_choice
    prompt: He is too young ___ a car.
    choices:
      - text: to drive
        correct: true
      - text: driving
        correct: false
    answer: to drive
    explanation: >
      too young to drive で「若すぎて運転できない」。
      too ... to do の形なので to drive を使う。
    translation: 彼は若すぎて車を運転できない。
    focus:
      - too_to_do
      - too_young_to_drive
      - age_limit

  - id: g045_q003
    question_type: two_choice
    prompt: The tea is too hot ___.
    choices:
      - text: to drink
