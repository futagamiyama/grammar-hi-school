common_mistakes:
  - mistake: too を very と同じ意味だと思う
    correction: >
      too は「度が過ぎている」という意味で、
      too ... to do では「〜すぎてできない」という否定的な結果を含む。
  - mistake: too ... to doing としてしまう
    correction: >
      too ... の後ろは to + 動詞の原形。
      too heavy to carry のように使う。
  - mistake: for 人 to do の人を抜かして意味が曖昧になる
    correction: >
      誰にとってできないのかを明示したいときは
      too difficult for me to solve のように for 人 to do を使う。
  - mistake: 前置詞を落としてしまう
    correction: >
      swim in the river → The river is too dangerous to swim in.
      read in the room → The room is too dark to read in.
      のように、必要な前置詞は残る。
  - mistake: too ... to do を肯定的に読んでしまう
    correction: >
      too young to drive は「若すぎて運転できない」。
      「とても若くて運転できる」ではない。

learning_notes:
  - >
    too ... to do は、程度が強すぎて行為ができないことを表す。
  - >
    too heavy to carry は so heavy that I cannot carry it と考えると理解しやすい。
  - >
    for 人 to do を入れると、「誰にとってできないのか」を明示できる。
  - >
    too ... to do は否定語がなくても否定的な意味を含む。
    「できない」を文の中で感じ取ることが大切。

