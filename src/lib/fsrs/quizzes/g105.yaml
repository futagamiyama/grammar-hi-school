review_questions:
  - id: g105_q001
    question_type: two_choice
    prompt: I stayed home ___ it was raining.
    choices:
      - text: because
        correct: true
      - text: because of
        correct: false
    answer: because
    explanation: >
      it was raining は主語＋動詞を含む文。
      文を後ろに取るので because を使う。
    translation: 雨が降っていたので、私は家にいた。
    focus:
      - because_reason
      - because_clause
      - reason

  - id: g105_q002
    question_type: two_choice
    prompt: I stayed home ___ the rain.
    choices:
      - text: because of
        correct: true
      - text: because
        correct: false
    answer: because of
    explanation: >
      the rain は名詞句。
      名詞句を後ろに取るので because of を使う。
    translation: 雨のために、私は家にいた。
    focus:
