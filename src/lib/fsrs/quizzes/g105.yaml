common_mistakes:
  - mistake: because of の後ろに文を置いてしまう
    correction: >
      because of の後ろは名詞句。
      because of it was raining ではなく、because it was raining。
  - mistake: because の後ろに名詞句だけを置いてしまう
    correction: >
      because の後ろは文。
      because the rain ではなく、because of the rain。
  - mistake: since を時間の「〜以来」とだけ読む
    correction: >
      since は理由の「〜なので」としても使う。
      Since it was late, we went home. のように読む。
  - mistake: as を「〜として」とだけ読む
    correction: >
      as は理由の「〜なので」としても使う。
      As I was tired, I went to bed early. のように読む。
  - mistake: because / since / as を完全に同じだと思う
    correction: >
      because は理由をはっきり説明する。
      since は前提的な理由、as は背景事情としての理由を表しやすい。

learning_notes:
  - >
    because は理由をはっきり示す接続詞。
    why に対する答えになりやすい。
  - >
    since は、相手も知っている事実や自然な前提を理由として出す時に使いやすい。
  - >
    as は、背景事情として理由を軽く添える時に使いやすい。
  - >
    because の後ろは文。
    because of の後ろは名詞句。
  - >
    since / as は、理由以外の意味もある。
    文脈から「理由」なのか「時間・様態」なのかを判断する。

