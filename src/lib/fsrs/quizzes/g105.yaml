id: g105
file: g105.yaml

title: 理由を表す接続詞 because / since / as
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 理由を表す because / since / as を、強さと文脈に応じて使い分けられるか？

core_concept:
  because_reason:
    form: 主語 + 動詞 ..., because + 主語 + 動詞 ...
    meaning: なぜなら〜だから
    image: 理由をはっきり説明する
    examples:
      - sentence: I stayed home because it was raining.
        ja: 雨が降っていたので、私は家にいた。
        point: because は理由を明確に示す。
      - sentence: She was absent because she was sick.
        ja: 彼女は病気だったので欠席した。
        point: 欠席した直接の理由を because が説明している。
      - sentence: I chose this book because it looked interesting.
        ja: 面白そうだったので、私はこの本を選んだ。
        point: なぜ選んだのかを because が答えている。

  since_reason:
    form: Since + 主語 + 動詞 ..., 主語 + 動詞 ...
    meaning: 〜なので、〜だから
    image: 相手も知っている、または自然に前提にできる理由を先に出す
    examples:
      - sentence: Since it was late, we went home.
        ja: 遅かったので、私たちは家に帰った。
        point: since は理由を前提として出す感じがある。
      - sentence: Since you are here, you can help us.
        ja: あなたがここにいるのだから、私たちを手伝えます。
        point: 相手がここにいる事実を理由として使っている。
      - sentence: Since no one objected, we accepted the plan.
        ja: 誰も反対しなかったので、私たちはその計画を受け入れた。
        point: 反対がなかったことを自然な理由として示している。

  as_reason:
    form: As + 主語 + 動詞 ..., 主語 + 動詞 ...
    meaning: 〜なので、〜だから
    image: 背景事情として軽く理由を添える
    examples:
      - sentence: As I was tired, I went to bed early.
        ja: 疲れていたので、私は早く寝た。
        point: as は理由を背景として添える感じがある。
      - sentence: As the road was closed, we took another route.
        ja: 道路が閉鎖されていたので、私たちは別の道を通った。
        point: 状況説明として理由を述べている。
      - sentence: As she had no money, she could not buy the ticket.
        ja: お金がなかったので、彼女はその切符を買えなかった。
        point: 理由を軽く前置きしている。

  because_of_preposition:
    form: because of + 名詞
    meaning: 〜のために
    image: because は文、because of は名詞を後ろに取る
    examples:
      - sentence: I stayed home because of the rain.
        ja: 雨のために、私は家にいた。
        point: because of の後ろは名詞 the rain。
      - sentence: The game was canceled because of bad weather.
        ja: 悪天候のため、その試合は中止された。
        point: bad weather は名詞句なので because of を使う。
      - sentence: She was late because of the traffic.
        ja: 交通渋滞のため、彼女は遅れた。
        point: the traffic は名詞句。

main_rule: >
  理由を表す接続詞には because, since, as がある。
  because は「なぜなら〜だから」と、理由をはっきり説明する時に使う。
  I stayed home because it was raining. は
  「雨が降っていたので家にいた」という直接の理由を示す。
  since は、相手も知っている事実や自然に前提にできる理由を出す時に使いやすい。
  Since it was late, we went home. は
  「遅かったので家に帰った」という前提的な理由を示す。
  as は、背景事情として理由を軽く添える時に使う。
  As I was tired, I went to bed early. は
  「疲れていたので早く寝た」という状況説明に近い。
  また、because の後ろには文が来るが、because of の後ろには名詞が来る。
  because it rained と because of the rain の違いに注意する。

contrast_pairs:
  - because_clause: I stayed home because it was raining.
    because_of_phrase: I stayed home because of the rain.
    point: >
      because の後ろは主語＋動詞を含む文。
      because of の後ろは名詞句。

  - because: I chose this book because it looked interesting.
    since: Since you are here, you can help us.
    point: >
      because は理由をはっきり答える。
      since は理由を前提として出す感じがある。

  - since: Since it was late, we went home.
    as: As I was tired, I went to bed early.
    point: >
      since はやや論理的に理由を示す。
      as は背景事情として理由を添える感じがある。

