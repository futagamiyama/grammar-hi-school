common_mistakes:
  - mistake: no more than と not more than をどちらも「〜以下」とだけ覚える
    correction: >
      no more than は「たった〜だけ」と少なさを強調する。
      not more than は「多くても〜」と上限を示す。
  - mistake: no more than を客観的な上限として読む
    correction: >
      no more than は話し手の評価が入ることが多い。
      「それしかない」「たったそれだけ」という響きがある。
  - mistake: not more than を「たった〜だけ」と強く訳しすぎる
    correction: >
      not more than は基本的に「〜を超えない」「多くても〜」。
      感情的な少なさの強調は no more than の方が強い。
  - mistake: no と not の違いを文法的な否定だけで処理する
    correction: >
      no more than の no は、比較対象を打ち消して「それ以上ではない＝それだけ」と強調する。
      not more than は普通の否定で上限を示す。
  - mistake: more than の反対をすべて no more than だと思う
    correction: >
      上限を客観的に言うなら not more than。
      少なさを強調したいなら no more than。

learning_notes:
  - >
    no more than は「たった〜だけ」。
    話し手が少ないと感じている。
  - >
    not more than は「多くても〜」。
    数量の上限を客観的に示す。
  - >
    no more than ten people came は「たった10人しか来なかった」。
    not more than ten people may enter は「多くても10人まで入れる」。
  - >
    no less than / not less than も同じ発想で区別できる。
    no は評価、not は範囲・上限下限と考えるとよい。

