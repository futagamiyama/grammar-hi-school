id: g059
file: g059.yaml

title: no more than / not more than
type: grammar_contrast

section:
  id: s07
  title: 形容詞・副詞・比較

level: basic
target: 高校英文法基礎

core_question: たった〜だけなのか、多くても〜なのか？

core_concept:
  no_more_than:
    form: no more than + 数量
    meaning: たった〜だけ
    image: 数量が少ないことを強調する
    examples:
      - sentence: He has no more than 1,000 yen.
        ja: 彼はたった1,000円しか持っていない。
        point: 1,000円という少なさを強調している。
      - sentence: No more than ten people came to the meeting.
        ja: その会議に来たのはたった10人だけだった。
        point: 10人しか来なかったという不満・少なさの強調。
      - sentence: The book costs no more than five dollars.
        ja: その本はたった5ドルしかしない。
        point: 5ドルという安さ・少なさを強調している。

  not_more_than:
    form: not more than + 数量
    meaning: 多くても〜、せいぜい〜
    image: 上限を示す
    examples:
      - sentence: He has not more than 1,000 yen.
        ja: 彼は多くても1,000円しか持っていない。
        point: 1,000円を超えないという上限を表す。
      - sentence: Not more than ten people can enter the room.
        ja: その部屋には多くても10人までしか入れない。
        point: 10人以下という上限を表す。
      - sentence: The work will take not more than two hours.
        ja: その仕事は多くても2時間しかかからない。
        point: 2時間を超えないという上限を表す。

main_rule: >
  no more than は「たった〜だけ」という少なさの強調。
  not more than は「多くても〜」「〜以下」という上限。
  no は感情的に「それだけしかない」と強調する。
  not は単に「それを超えない」と客観的に制限する。
  He has no more than 1,000 yen. は「たった1,000円しかない」。
  He has not more than 1,000 yen. は「多くても1,000円だ」。
  形が似ているが、no more than は少なさの評価、not more than は上限の指定と考える。

contrast_pairs:
  - emphasis_on_smallness: He has no more than 1,000 yen.
    upper_limit: He has not more than 1,000 yen.
    point: >
      no more than は「たった1,000円だけ」と少なさを強調する。
      not more than は「1,000円以下」と上限を表す。

  - emphasis_on_smallness: No more than ten people came.
    upper_limit: Not more than ten people may enter.
    point: >
      no more than ten people came は「たった10人しか来なかった」。
      not more than ten people may enter は「多くても10人まで入れる」。

  - emphasis_on_smallness: It took no more than five minutes.
    upper_limit: It will take not more than five minutes.
    point: >
      no more than five minutes は「たった5分だけ」という短さの強調。
      not more than five minutes は「5分以内」という上限。

