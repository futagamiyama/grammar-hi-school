common_mistakes:
  - mistake: whenever と wherever を音の近さで混同する
    correction: >
      whenever は時。
      wherever は場所。
      when / where と対応させて覚える。
  - mistake: however を「しかし」とだけ覚える
    correction: >
      however は副詞として「しかし」もあるが、
      複合関係詞では「どんなに〜でも」を表す。
  - mistake: however の後ろに名詞だけを置く
    correction: >
      however は however hard, however busy, however carefully のように、
      形容詞や副詞を伴うことが多い。
  - mistake: wherever を時の意味で使う
    correction: >
      時なら whenever。
      Call me whenever you need help. が自然。
  - mistake: whenever を場所の意味で使う
    correction: >
      場所なら wherever。
      Sit wherever you like. が自然。

learning_notes:
  - >
    whenever は when と対応し、「いつでも」「いつ〜しても」を表す。
  - >
    wherever は where と対応し、「どこでも」「どこへ〜しても」を表す。
  - >
    however は how と対応し、「どんなに〜でも」を表す。
    however + 形容詞/副詞 の形に注意する。
  - >
    複合関係詞は、名詞節として働く場合と、譲歩節として働く場合がある。
    文脈で「いつでも」か「いつ〜しても」かを判断する。

