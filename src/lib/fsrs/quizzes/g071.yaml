id: g071
file: g071.yaml

title: 複合関係詞 whenever / wherever / however
type: grammar_contrast

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: whenever / wherever / however を意味で使い分けられるか？

core_concept:
  whenever:
    form: whenever + 主語 + 動詞
    meaning: 〜するときはいつでも、いつ〜しても
    image: any time when / no matter when
    examples:
      - sentence: Visit me whenever you are free.
        ja: 暇なときはいつでも私を訪ねてください。
        point: whenever you are free = any time when you are free。
      - sentence: Whenever I see this photo, I remember my childhood.
        ja: この写真を見るたびに、私は子どものころを思い出す。
        point: 「〜するときはいつでも」という反復の意味。
      - sentence: Whenever you come, you are welcome.
        ja: あなたがいつ来ても歓迎します。
        point: 「いつ来ても」という譲歩の意味。

  wherever:
    form: wherever + 主語 + 動詞
    meaning: 〜する所ならどこでも、どこへ〜しても
    image: any place where / no matter where
    examples:
      - sentence: Sit wherever you like.
        ja: 好きな所ならどこでも座ってください。
        point: wherever you like = any place where you like。
      - sentence: Wherever he goes, he makes friends.
        ja: 彼はどこへ行っても友達を作る。
        point: 「どこへ行っても」という譲歩の意味。
      - sentence: I will follow you wherever you go.
        ja: あなたがどこへ行っても私はついて行きます。
        point: 場所を表す複合関係詞。

  however:
    form: however + 形容詞/副詞 + 主語 + 動詞
    meaning: どんなに〜でも
    image: no matter how
    examples:
      - sentence: However hard you try, you cannot finish it today.
        ja: どんなに一生懸命やっても、今日それを終えることはできない。
        point: however hard = no matter how hard。
      - sentence: However busy I am, I read every day.
        ja: どんなに忙しくても、私は毎日読む。
        point: however + 形容詞 の形。
      - sentence: However carefully you drive, accidents can happen.
        ja: どんなに注意深く運転しても、事故は起こりうる。
        point: however + 副詞 の形。

main_rule: >
  複合関係詞 whenever は「〜するときはいつでも」「いつ〜しても」を表す。
  wherever は「〜する所ならどこでも」「どこへ〜しても」を表す。
  however は「どんなに〜でも」を表し、後ろに形容詞や副詞を置くことが多い。
  whenever = any time when / no matter when、
  wherever = any place where / no matter where、
  however = no matter how と考えるとよい。
  いつなら whenever、どこなら wherever、程度・やり方なら however と判断する。

contrast_pairs:
  - time: Visit me whenever you are free.
    place: Sit wherever you like.
    point: >
      whenever は時。
      wherever は場所。

  - time_concession: Whenever you come, you are welcome.
    place_concession: Wherever you go, I will follow you.
    point: >
      whenever は「いつ〜しても」。
      wherever は「どこへ〜しても」。

  - place: Wherever he goes, he makes friends.
    degree: However hard he tries, he cannot win.
    point: >
      wherever は場所。
      however は「どんなに〜でも」と程度を表す。

