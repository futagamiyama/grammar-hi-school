id: g085
file: g085.yaml

title: 強調の do / does / did
type: grammar_contrast

section:
  id: s10
  title: 強調・倒置・省略

level: basic
target: 高校英文法基礎

core_question: 肯定文で使う do / does / did が、強調を表すことを読めるか？

core_concept:
  emphatic_do_present:
    form: 主語 + do/does + 動詞原形
    meaning: 本当に〜する、たしかに〜する
    image: 普通の肯定文を強める
    examples:
      - sentence: I do like this song.
        ja: 私はこの歌が本当に好きです。
        point: like を do で強調している。
      - sentence: She does know the answer.
        ja: 彼女はたしかに答えを知っている。
        point: she なので does、後ろは原形 know。
      - sentence: He does work hard.
        ja: 彼は本当によく働く。
        point: works ではなく does work の形。

  emphatic_do_past:
    form: 主語 + did + 動詞原形
    meaning: 本当に〜した、たしかに〜した
    image: 過去の肯定文を強める
    examples:
      - sentence: I did call you yesterday.
        ja: 私は昨日たしかにあなたに電話しました。
        point: called ではなく did call。
      - sentence: He did finish the work.
        ja: 彼は本当にその仕事を終えた。
        point: did の後ろは原形 finish。
      - sentence: They did arrive on time.
        ja: 彼らはたしかに時間通りに到着した。
        point: arrived ではなく did arrive。

  contrast_with_ordinary_do:
    form: do/does/did + 動詞原形
    meaning: 疑問文・否定文の助動詞としても使うが、肯定文では強調になる
    image: 肯定文に余分に入った do は強調
    examples:
      - sentence: Do you like this song?
        ja: あなたはこの歌が好きですか。
        point: 疑問文を作る do。
      - sentence: I do not like this song.
        ja: 私はこの歌が好きではありません。
        point: 否定文を作る do。
      - sentence: I do like this song.
        ja: 私はこの歌が本当に好きです。
        point: 肯定文の do は強調。

main_rule: >
  do / does / did は、疑問文や否定文だけでなく、肯定文で強調として使われることがある。
  I like this song. は普通の肯定文。
  I do like this song. は「私はこの歌が本当に好きです」と、like を強めている。
  三人称単数現在では does + 動詞原形を使う。
  She does know the answer. で、knows ではなく know になる。
  過去では did + 動詞原形を使う。
  I did call you yesterday. で、called ではなく call になる。
  do / does / did の後ろは必ず動詞原形にする。

contrast_pairs:
  - ordinary: I like this song.
    emphatic: I do like this song.
    point: >
      do を入れると、like を強調して「本当に好きだ」という意味になる。

  - ordinary: She knows the answer.
    emphatic: She does know the answer.
    point: >
      三人称単数現在では does を使う。
      後ろは knows ではなく know。

  - ordinary: I called you yesterday.
    emphatic: I did call you yesterday.
    point: >
      過去の強調では did を使う。
      後ろは called ではなく call。

