id: g120
file: g120.yaml

title: 手段・道具・方法を表す by / with / in / on
type: grammar_contrast

section:
  id: s12
  title: 前置詞

level: basic
target: 高校英文法基礎

core_question: 手段・道具・方法を表す by / with / in / on を、後ろの名詞の種類から使い分けられるか？

core_concept:
  by_means_transport:
    form: by + 交通手段・通信手段・方法
    meaning: 〜で、〜によって
    image: 方法・手段をざっくり示す
    examples:
      - sentence: I go to school by bus.
        ja: 私はバスで学校へ行きます。
        point: bus は交通手段なので by。
      - sentence: He sent the document by email.
        ja: 彼はその書類をメールで送った。
        point: email は通信手段なので by。
      - sentence: You can solve this problem by using this formula.
        ja: この公式を使うことによって、この問題を解けます。
        point: by + 動名詞で「〜することによって」。

  with_tool_instrument:
    form: with + 道具・器具・身体部位
    meaning: 〜を使って、〜で
    image: 手に持つ道具・具体的な器具を使う
    examples:
      - sentence: He cut the bread with a knife.
        ja: 彼はナイフでパンを切った。
        point: knife は具体的な道具なので with。
      - sentence: She opened the door with a key.
        ja: 彼女は鍵でドアを開けた。
        point: key は道具なので with。
      - sentence: He covered his face with his hands.
        ja: 彼は手で顔を覆った。
        point: hands は身体部位で、手段として使われている。

  in_language_material_color:
    form: in + 言語・材料・色・書き方
    meaning: 〜語で、〜で書いて、〜色で
    image: 表現の中身・素材・状態を表す
    examples:
      - sentence: Please write your name in English.
        ja: 名前を英語で書いてください。
        point: English は言語なので in。
      - sentence: Write the answer in ink.
        ja: 答えをインクで書きなさい。
        point: ink は書く時の材料・媒体なので in。
      - sentence: The sign was written in red.
        ja: その標識は赤で書かれていた。
        point: red は色なので in。

  on_device_medium:
    form: on + 電話・テレビ・ラジオ・インターネット・画面
    meaning: 〜で、〜を使って、〜に
    image: 機器・媒体の上で情報がやり取りされる
    examples:
      - sentence: I talked to her on the phone.
        ja: 私は電話で彼女と話した。
        point: the phone は通信機器・媒体なので on。
      - sentence: I saw the news on TV.
        ja: 私はテレビでそのニュースを見た。
        point: TV は情報媒体なので on。
      - sentence: I found the information on the Internet.
        ja: 私はその情報をインターネットで見つけた。
        point: the Internet は情報が載る媒体なので on。

  by_vs_with:
    form: by + 方法 / with + 道具
    meaning: 方法として〜で / 道具を使って〜で
    image: by は方法、with は具体的な道具
    examples:
      - sentence: I went there by car.
        ja: 私は車でそこへ行った。
        point: car は交通手段なので by car。
      - sentence: I opened the can with a knife.
        ja: 私はナイフで缶を開けた。
        point: knife は手に持つ道具なので with a knife。
      - sentence: He learned English by listening to podcasts.
        ja: 彼はポッドキャストを聞くことによって英語を学んだ。
        point: by + 動名詞で方法を表す。

  special_transport_forms:
    form: by car/bus/train/plane / on foot
    meaning: 車・バス・電車・飛行機で / 徒歩で
    image: 交通手段には基本 by、徒歩は on foot
    examples:
      - sentence: We traveled by train.
        ja: 私たちは電車で旅行した。
        point: 交通手段なので by train。
      - sentence: He came here on foot.
        ja: 彼は徒歩でここへ来た。
        point: 徒歩は by foot ではなく on foot。
      - sentence: She went to Osaka by plane.
        ja: 彼女は飛行機で大阪へ行った。
        point: plane は交通手段なので by plane。

main_rule: >
  手段・道具・方法を表す前置詞では、後ろに来る名詞の種類を見る。
  by は交通手段・通信手段・方法を表す。
  by bus / by train / by email / by using this formula の形。
  with は具体的な道具・器具・身体部位を使う時に使う。
  with a knife / with a key / with his hands の形。
  in は言語・材料・色・書き方を表す。
  in English / in ink / in red の形。
  on は電話・テレビ・ラジオ・インターネット・画面などの媒体に使う。
  on the phone / on TV / on the Internet の形。
  交通手段は基本的に by を使うが、徒歩は on foot と言う。
  by と with の違いは、by が方法全体、with が具体的な道具というイメージで考える。

contrast_pairs:
  - means: I went there by car.
    instrument: I opened the can with a knife.
    point: >
      by は交通手段や方法。
      with は具体的な道具。

  - language: Please write your name in English.
    tool: Please write your name with this pen.
    point: >
      言語なら in English。
      具体的なペンなら with this pen。

  - transport: We traveled by train.
    walking: He came here on foot.
    point: >
      交通手段は by train / by bus / by plane。
      徒歩は例外的に on foot。

  - medium: I saw the news on TV.
    communication_method: He sent the document by email.
    point: >
      TV や Internet のような情報媒体は on。
      email を送信手段として見る時は by email。

