common_mistakes:
  - mistake: by と with をどちらも「〜で」とだけ覚える
    correction: >
      by は方法・交通手段。
      with は具体的な道具。
      by bus / with a knife を区別する。
  - mistake: by a knife としてしまう
    correction: >
      ナイフのような具体的な道具には with を使う。
      with a knife が正しい。
  - mistake: with bus としてしまう
    correction: >
      交通手段としてのバスには by を使う。
      by bus が正しい。
  - mistake: by foot としてしまう
    correction: >
      徒歩は例外的に on foot。
      by foot ではなく on foot を基本形として覚える。
  - mistake: English や red に by を使ってしまう
    correction: >
      言語・色・材料には in を使う。
      in English / in red / in ink。
  - mistake: phone や TV に by を使ってしまう
    correction: >
      電話・テレビ・インターネットなどの媒体には on を使うことが多い。
      on the phone / on TV / on the Internet。

learning_notes:
  - >
    by は方法・手段。
    by bus / by train / by email / by using ...。
  - >
    with は具体的な道具。
    with a knife / with a key / with this pen。
  - >
    in は言語・材料・色。
    in English / in ink / in red。
  - >
    on は機器・媒体。
    on the phone / on TV / on the Internet。
  - >
    日本語ではどれも「〜で」になりやすい。
    英語では、交通手段か、道具か、言語・材料か、媒体かを見て選ぶ。

