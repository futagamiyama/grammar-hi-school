id: g014
file: g014.yaml

title: live / work / stay の現在形・現在進行形
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 恒常的な状態か、一時的な滞在・勤務か？

core_concept:
  overview: >
    live, work, stay は、現在形と現在進行形の違いが比較的見えやすい動詞である。
    現在形は「普段そうである」「恒常的にそうである」ことを表し、
    現在進行形は「今だけそうしている」「一時的にそうである」ことを表す。

  live:
    present_simple:
      meaning: 普段・恒常的に住んでいる
      example: I live in Kyoto.
      ja: 私は京都に住んでいる。
      point: 通常の居住地として京都に住んでいる。
    present_continuous:
      meaning: 一時的に住んでいる
      example: I am living in Kyoto this year.
      ja: 私は今年、京都に住んでいる。
      point: 今年だけなど、一時的な居住を表す。

  work:
    present_simple:
      meaning: 職業・勤務先として普段働いている
      example: She works for a bank.
      ja: 彼女は銀行で働いている。
      point: 普段の勤務先・職業を表す。
    present_continuous:
      meaning: 一時的に働いている
      example: She is working at a cafe this summer.
      ja: 彼女はこの夏、カフェで働いている。
      point: 夏の間だけの一時的な仕事を表す。

  stay:
    present_simple:
      meaning: 普段滞在する・泊まる習慣がある
      example: We usually stay at this hotel.
      ja: 私たちは普段このホテルに泊まる。
      point: 繰り返しの習慣を表す。
    present_continuous:
      meaning: 今、一時的に滞在している
      example: We are staying at this hotel now.
      ja: 私たちは今このホテルに泊まっている。
      point: 現在の一時的な滞在を表す。

main_rule: >
  live と work は、現在形なら「恒常的な居住・勤務」、現在進行形なら
  「一時的な居住・勤務」を表すことが多い。
  stay はもともと「一時的に滞在する」という意味を持つが、usually などがあれば現在形で習慣を表し、
  now や this week などがあれば現在進行形で現在の滞在を表す。

contrast_pairs:
  - present_simple: I live in Osaka.
    present_continuous: I am living in Osaka this month.
    point: >
      live は現在形なら普段の居住地、現在進行形なら一時的な居住を表す。

  - present_simple: She works at a hospital.
    present_continuous: She is working at a hospital during the summer.
    point: >
      works は普段の勤務先、is working は夏の間だけの一時的な勤務を表す。

  - present_simple: We usually stay with my grandparents.
    present_continuous: We are staying with my grandparents this week.
    point: >
      usually stay は習慣、are staying は今週だけの一時的な滞在を表す。

