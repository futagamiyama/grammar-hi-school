id: g103
file: g103.yaml

title: 名詞節の that
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: that + 完全文を「〜ということ」として、主語・目的語・補語に使えるか？

core_concept:
  that_object_clause:
    form: 主語 + 動詞 + that + 主語 + 動詞
    meaning: 〜ということを思う・知る・言う・信じる
    image: that節全体が動詞の目的語になる
    examples:
      - sentence: I think that he is honest.
        ja: 私は彼が正直だと思う。
        point: that he is honest が think の目的語。
      - sentence: She said that she was tired.
        ja: 彼女は疲れていると言った。
        point: that she was tired が said の内容。
      - sentence: We know that the earth is round.
        ja: 私たちは地球が丸いことを知っている。
        point: that the earth is round が know の目的語。

  that_subject_clause:
    form: That + 主語 + 動詞 + 動詞 ...
    meaning: 〜ということが...
    image: that節全体が文の主語になる
    examples:
      - sentence: That he lied is clear.
        ja: 彼がうそをついたことは明らかだ。
        point: That he lied 全体が主語。
      - sentence: That she passed the exam surprised us.
        ja: 彼女が試験に合格したことは私たちを驚かせた。
        point: That she passed the exam 全体が主語。
      - sentence: That he refused the offer was unexpected.
        ja: 彼がその申し出を断ったことは予想外だった。
        point: That he refused the offer 全体が主語。

  it_extraposition_that:
    form: It + be動詞 + 形容詞/名詞 + that + 主語 + 動詞
    meaning: 〜ということは...だ
    image: 長い that節を後ろに回し、it を仮の主語にする
    examples:
      - sentence: It is clear that he lied.
        ja: 彼がうそをついたことは明らかだ。
        point: It が仮主語で、that he lied が本当の主語。
      - sentence: It is surprising that she passed the exam.
        ja: 彼女が試験に合格したことは驚きだ。
        point: that節を後ろに置くと自然。
      - sentence: It is a pity that he cannot come.
        ja: 彼が来られないのは残念だ。
        point: It is a pity that ... はよく使う形。

  that_complement_clause:
    form: 主語 + be動詞 + that + 主語 + 動詞
    meaning: 問題・事実・理由などは〜ということだ
    image: that節が補語になり、主語の中身を説明する
    examples:
      - sentence: The problem is that we have no money.
        ja: 問題は、私たちにお金がないことだ。
        point: that we have no money が補語。
      - sentence: The truth is that he did not know it.
        ja: 真実は、彼がそれを知らなかったということだ。
        point: that節が The truth の中身を説明している。
      - sentence: The point is that we need more time.
        ja: 要点は、私たちにはもっと時間が必要だということだ。
        point: that we need more time が補語。

  that_omission:
    form: 主語 + think/say/know/believe + 主語 + 動詞
    meaning: 〜ということを思う・言う・知る
    image: 目的語の that は省略されることが多い
    examples:
      - sentence: I think he is honest.
        ja: 私は彼が正直だと思う。
        point: think の目的語の that が省略されている。
      - sentence: She said she was tired.
        ja: 彼女は疲れていると言った。
        point: said の後ろの that が省略されている。
      - sentence: I believe you are right.
        ja: 私はあなたが正しいと信じている。
        point: believe の目的語の that が省略されている。

main_rule: >
  名詞節の that は、that + 完全文で「〜ということ」を表す。
  I think that he is honest. では、that he is honest が think の目的語。
  That he lied is clear. では、That he lied 全体が主語。
  The problem is that we have no money. では、that we have no money が補語。
  主語になる that節は長くなりやすいので、
  It is clear that he lied. のように it を仮主語にして that節を後ろへ置く形がよく使われる。
  目的語になる that は、I think he is honest. のように省略されることが多い。
  ただし、that節の中は主語と動詞がそろった完全文になる。
  that は「それ」ではなく、節を名詞にする接続詞として読む。

contrast_pairs:
  - with_that: I think that he is honest.
    omitted_that: I think he is honest.
    point: >
      think の目的語になる that は省略できることが多い。
      どちらも「彼が正直だと思う」という意味。

  - subject_clause: That he lied is clear.
    extraposition: It is clear that he lied.
    point: >
      That he lied を主語にすることもできる。
      ただし、It is clear that ... の方が自然なことが多い。

  - complement_clause: The problem is that we have no money.
    appositive_that: The fact that we have no money is serious.
    point: >
      The problem is that ... では that節が補語。
      The fact that ... では that節が fact の内容を説明する同格。

