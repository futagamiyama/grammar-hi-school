    question_type: two_choice
    prompt: I think ___ he is honest.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      that he is honest で「彼が正直だということ」。
      that節が think の目的語になっている。
    translation: 私は彼が正直だと思う。
    focus:
      - that_object_clause
      - think_that
      - complete_clause

  - id: g103_q002
    question_type: two_choice
    prompt: She said ___ she was tired.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      that she was tired が said の内容。
      「彼女は疲れていると言った」という意味。
    translation: 彼女は疲れていると言った。
    focus:
      - that_object_clause
      - said_that
      - tired

  - id: g103_q003
    question_type: two_choice
    prompt: We know ___ the earth is round.
    choices:
      - text: that
        correct: true
      - text: which
        correct: false
    answer: that
    explanation: >
      that the earth is round で「地球が丸いということ」。
      that節が know の目的語。
    translation: 私たちは地球が丸いことを知っている。
    focus:
      - that_object_clause
      - know_that
      - fact

  - id: g103_q004
    question_type: two_choice
    prompt: ___ he lied is clear.
    choices:
      - text: That
        correct: true
      - text: What
        correct: false
    answer: That
    explanation: >
      That he lied 全体が文の主語。
      「彼がうそをついたことは明らかだ」という意味。
    translation: 彼がうそをついたことは明らかだ。
    focus:
      - that_subject_clause
      - subject_clause
      - lied

  - id: g103_q005
    question_type: two_choice
    prompt: ___ she passed the exam surprised us.
    choices:
      - text: That
        correct: true
      - text: Because
        correct: false
    answer: That
    explanation: >
      That she passed the exam 全体が主語。
      surprised us の主語になっている。
    translation: 彼女が試験に合格したことは私たちを驚かせた。
    focus:
      - that_subject_clause
      - passed_exam
      - surprised

  - id: g103_q006
    question_type: two_choice
    prompt: It is clear ___ he lied.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      It is clear that ... は仮主語構文。
      it が仮の主語で、that he lied が本当の主語。
    translation: 彼がうそをついたことは明らかだ。
    focus:
      - it_extraposition_that
      - dummy_it
      - clear

  - id: g103_q007
    question_type: two_choice
    prompt: It is surprising ___ she passed the exam.
    choices:
      - text: that
        correct: true
      - text: because
        correct: false
    answer: that
    explanation: >
      It is surprising that ... で「〜ということは驚きだ」。
      that節が本当の主語。
    translation: 彼女が試験に合格したことは驚きだ。
    focus:
      - it_extraposition_that
      - surprising
      - that_clause

  - id: g103_q008
    question_type: two_choice
    prompt: It is a pity ___ he cannot come.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      It is a pity that ... は「〜なのは残念だ」。
      that he cannot come が残念な内容。
    translation: 彼が来られないのは残念だ。
    focus:
      - it_extraposition_that
      - a_pity
      - cannot_come

  - id: g103_q009
    question_type: two_choice
    prompt: The problem is ___ we have no money.
    choices:
      - text: that
        correct: true
      - text: because of
        correct: false
    answer: that
    explanation: >
      that we have no money が be動詞の補語。
      「問題は、お金がないということだ」という意味。
    translation: 問題は、私たちにお金がないことだ。
    focus:
      - that_complement_clause
      - complement
      - problem

  - id: g103_q010
    question_type: two_choice
    prompt: The truth is ___ he did not know it.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      The truth is that ... で「真実は〜ということだ」。
      that he did not know it が補語。
    translation: 真実は、彼がそれを知らなかったということだ。
    focus:
      - that_complement_clause
      - truth
      - did_not_know

  - id: g103_q011
    question_type: two_choice
    prompt: I think he is honest.
    choices:
      - text: that が省略されている
        correct: true
      - text: 関係代名詞が省略されている
        correct: false
    answer: that が省略されている
    explanation: >
      I think he is honest は I think that he is honest の that が省略された形。
      he is honest は think の目的語になっている名詞節。
    translation: 私は彼が正直だと思う。
    focus:
      - that_omission
      - omitted_that
      - object_clause

  - id: g103_q012
    question_type: two_choice
    prompt: She said she was tired.
    choices:
      - text: that が省略されている
        correct: true
      - text: which が省略されている
        correct: false
    answer: that が省略されている
    explanation: >
      She said she was tired は She said that she was tired の that が省略された形。
      that節が said の内容を表している。
    translation: 彼女は疲れていると言った。
    focus:
      - that_omission
      - said
      - omitted_that

common_mistakes:
  - mistake: that を「それ」と訳してしまう
    correction: >
      名詞節の that は「それ」ではなく、節を名詞にする接続詞。
      that he is honest は「彼が正直だということ」と読む。
  - mistake: that節の中を疑問文語順にしてしまう
    correction: >
      that節の中は普通の文の語順。
      that he is honest が正しく、that is he honest とはしない。
  - mistake: 主語になる that節を読めない
    correction: >
      That he lied is clear. では、
      That he lied 全体が主語になっている。
  - mistake: It is clear that ... の it を「それ」と強く訳す
    correction: >
      It is clear that ... の it は仮主語。
      本当の主語は後ろの that節。
  - mistake: 目的語の that が省略されると、文構造を見失う
    correction: >
      I think he is honest. は I think that he is honest. の省略。
      he is honest 全体が think の目的語。

learning_notes:
  - >
    名詞節の that は、that + 完全文で「〜ということ」を表す。
  - >
    that節は、目的語・主語・補語になれる。
    I think that ... / That ... is clear / The problem is that ...。
  - >
    主語の that節は長くなりやすいので、
    It is clear that ... の仮主語構文がよく使われる。
  - >
    think, say, know, believe などの目的語になる that は省略されることが多い。
  - >
    that節の中は、疑問文語順ではなく普通の文の語順にする。

