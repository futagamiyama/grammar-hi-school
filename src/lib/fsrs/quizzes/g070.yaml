common_mistakes:
  - mistake: whoever と whatever をどちらも「何でも」と訳す
    correction: >
      whoever は人に使い、「誰でも」。
      whatever は物・事に使い、「何でも」。
  - mistake: whoever を物に使ってしまう
    correction: >
      物・事なら whatever。
      Take whatever you need. が自然。
  - mistake: whatever を人に使ってしまう
    correction: >
      人なら whoever。
      Whoever comes first can choose a seat. が自然。
  - mistake: whoever / whatever を疑問詞としてしか読めない
    correction: >
      複合関係詞では「〜する人は誰でも」「〜するものは何でも」という意味になる。
  - mistake: 譲歩の意味を読み落とす
    correction: >
      Whoever wins は「誰が勝っても」。
      Whatever happens は「何が起きても」。

learning_notes:
  - >
    whoever = anyone who と考える。
    「〜する人は誰でも」という意味。
  - >
    whatever = anything that と考える。
    「〜するものは何でも」という意味。
  - >
    文頭に置かれると、譲歩の意味になることが多い。
    Whoever wins, ... / Whatever happens, ... の形。
  - >
    whatever + 名詞 で「どんな〜でも」。
    whatever color you like のように使う。

