id: g070
file: g070.yaml

title: 複合関係詞 whoever / whatever
type: grammar_contrast

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: whoever / whatever を「誰でも」「何でも」と読めるか？

core_concept:
  whoever:
    form: whoever + 動詞 / whoever + 主語 + 動詞
    meaning: 〜する人は誰でも
    image: anyone who と同じ働きをする
    examples:
      - sentence: Whoever comes first can choose a seat.
        ja: 最初に来た人は誰でも席を選べる。
        point: Whoever comes first = Anyone who comes first。
      - sentence: I will help whoever needs help.
        ja: 私は助けを必要とする人なら誰でも助ける。
        point: whoever needs help が help の目的語。
      - sentence: Whoever you are, you must follow the rules.
        ja: あなたが誰であっても、規則には従わなければならない。
        point: whoever you are は譲歩の意味で「誰であっても」。

  whatever:
    form: whatever + 主語 + 動詞 / whatever + 名詞 + 主語 + 動詞
    meaning: 〜するものは何でも、どんな〜でも
    image: anything that と同じ働きをする
    examples:
      - sentence: Take whatever you need.
        ja: 必要なものは何でも持っていきなさい。
        point: whatever you need = anything that you need。
      - sentence: Whatever happens, stay calm.
        ja: 何が起きても、落ち着いていなさい。
        point: whatever happens は譲歩の意味で「何が起きても」。
      - sentence: You can choose whatever color you like.
        ja: 好きな色を何色でも選んでよい。
        point: whatever color で「どんな色でも」。

  noun_clause_and_concession:
    form: whoever / whatever が名詞節または譲歩節を作る
    meaning: 文中で名詞のかたまりになる場合と、「たとえ〜でも」を表す場合がある
    image: 文の中の役割で意味が決まる
    examples:
      - sentence: I will give this ticket to whoever wants it.
        ja: このチケットを欲しい人なら誰にでもあげます。
        point: whoever wants it は前置詞 to の目的語。
      - sentence: Whatever you say, I will not change my mind.
        ja: あなたが何を言っても、私は考えを変えない。
        point: Whatever you say は譲歩節。
      - sentence: Whoever wins, we will accept the result.
        ja: 誰が勝っても、私たちは結果を受け入れる。
        point: Whoever wins は譲歩節。

main_rule: >
  複合関係詞 whoever は「〜する人は誰でも」を表し、anyone who に近い。
  whoever comes first は anyone who comes first と同じ発想。
  whatever は「〜するものは何でも」を表し、anything that に近い。
  whatever you need は anything that you need と考えられる。
  また、whoever / whatever は「たとえ誰が〜しても」「たとえ何が〜しても」という譲歩の意味も作る。
  Whoever wins, we will accept the result. は「誰が勝っても、私たちは結果を受け入れる」。
  Whatever happens, stay calm. は「何が起きても、落ち着いていなさい」。

contrast_pairs:
  - person: Whoever comes first can choose a seat.
    thing: Take whatever you need.
    point: >
      whoever は人に使い、「〜する人は誰でも」。
      whatever は物・事に使い、「〜するものは何でも」。

  - noun_clause: I will help whoever needs help.
    concession: Whoever wins, we will accept the result.
    point: >
      whoever needs help は help の目的語。
      Whoever wins は「誰が勝っても」という譲歩節。

  - noun_clause: Take whatever you need.
    concession: Whatever happens, stay calm.
    point: >
      whatever you need は「必要なものは何でも」。
      Whatever happens は「何が起きても」。

