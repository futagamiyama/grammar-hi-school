id: g044
file: g044.yaml

title: want 人 to do
type: construction

section:
  id: s05
  title: 不定詞・動名詞・分詞

level: basic
target: 高校英文法基礎

core_question: 人に〜してほしい構文を作れるか？

core_concept:
  want_to_do:
    form: want + to do
    meaning: 自分が〜したい
    image: 主語自身がこれからすることを望む
    examples:
      - sentence: I want to study abroad.
        ja: 私は留学したい。
        point: 留学するのは I。
      - sentence: She wants to join the club.
        ja: 彼女はそのクラブに入りたい。
        point: 入るのは She。
      - sentence: They want to buy a new car.
        ja: 彼らは新しい車を買いたい。
        point: 買うのは They。

  want_someone_to_do:
    form: want + 人 + to do
    meaning: 人に〜してほしい
    image: 主語が、別の人に何かをしてほしいと思っている
    examples:
      - sentence: I want you to help me.
        ja: 私はあなたに手伝ってほしい。
        point: 手伝うのは you。
      - sentence: She wants him to call her.
        ja: 彼女は彼に電話してほしいと思っている。
        point: 電話するのは him。
      - sentence: The teacher wants us to read this book.
        ja: 先生は私たちにこの本を読んでほしいと思っている。
        point: 読むのは us。

main_rule: >
  want to do は「主語自身が〜したい」。
  want 人 to do は「主語が、人に〜してほしいと思っている」。
  want の後ろに人を入れると、その人が to do の動作をする。
  I want to help you. は「私があなたを手伝いたい」。
  I want you to help me. は「あなたに私を手伝ってほしい」。
  英語では「人に〜してほしい」を want 人 to do で表す。

contrast_pairs:
  - subject_action: I want to help you.
    other_person_action: I want you to help me.
    point: >
      want to help では、手伝うのは I。
      want you to help では、手伝うのは you。

  - subject_action: She wants to call him.
    other_person_action: She wants him to call her.
    point: >
      wants to call では、電話するのは She。
      wants him to call では、電話するのは him。

  - subject_action: The teacher wants to read this book.
    other_person_action: The teacher wants us to read this book.
    point: >
      wants to read では、読むのは The teacher。
      wants us to read では、読むのは us。

