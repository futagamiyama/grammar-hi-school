common_mistakes:
  - mistake: 「人に〜してほしい」を want to 人 do のようにしてしまう
    correction: >
      正しい形は want 人 to do。
      I want you to help me. のように、人を want の直後に置く。
  - mistake: I want to help me. と I want you to help me. を混同する
    correction: >
      I want to help me. は「私は自分を手伝いたい」という不自然な意味。
      「あなたに手伝ってほしい」は I want you to help me.
  - mistake: want 人 do として to を抜かす
    correction: >
      want 人 to do では to が必要。
      I want you help me. ではなく I want you to help me.
  - mistake: want 人 to do の人を主格にしてしまう
    correction: >
      want の後ろの人は目的格を使う。
      I want him to call me. / She wants us to read this book.

learning_notes:
  - >
    want to do は、主語自身がする。
    want 人 to do は、その人がする。
  - >
    I want to help you. と I want you to help me. は、
    語順が少し違うだけで意味が大きく変わる。
  - >
    want 人 to do の人は、me, you, him, her, us, them などの目的格になる。
  - >
    ask 人 to do, tell 人 to do, expect 人 to do なども同じ形を取る。
    ただし、このカードでは want 人 to do に集中する。

