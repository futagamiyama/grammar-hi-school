common_mistakes:
  - mistake: 日本語の「味がしている」「においがしている」を現在進行形にしてしまう
    correction: >
      物がどんな味・におい・手触りかを述べるときは、基本的に現在形を使う。
      This soup tastes salty. / These flowers smell sweet. / This towel feels soft.

  - mistake: taste, smell, feel はすべて進行形にできないと思ってしまう
    correction: >
      状態用法では進行形にしにくいが、人や動物が意識して味見する・においをかぐ・触って確かめる動作なら進行形にできる。
      The chef is tasting the soup. / The dog is smelling the bag. / She is feeling the wall.

  - mistake: 主語を見ずに動詞だけで判断する
    correction: >
      This soup tastes salty. の主語は soup なので、スープの性質を述べている。
      The chef is tasting the soup. の主語は chef なので、味見する動作を述べている。

  - mistake: feel をすべて「感じる」とだけ覚える
    correction: >
      feel は、物の手触りを述べる状態用法と、手で触って確かめる動作用法がある。
      どちらの意味かを文脈で判断する。

learning_notes:
  - >
    taste, smell, feel は、look / see や hear / listen と同じく、
    「状態」と「意識的な動作」の違いが重要になる。
  - >
    物が主語で「〜な味がする」「〜なにおいがする」「〜な感じがする」と言う場合は、現在形が基本。
  - >
    人や動物が主語で、感覚を使って何かを確かめている場合は、現在進行形が自然になりやすい。
  - >
    feel は「気分・体調」を表すときに I'm feeling better. のような進行形も自然に使われる。
    このカードでは、主に「手触り」と「触って確かめる動作」に絞って練習する。

