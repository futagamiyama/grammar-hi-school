id: g019
file: g019.yaml

title: taste / smell / feel の使い分け
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 感覚を表す状態か、意識して試す・確かめる動作かを判断できるか？

core_concept:
  overview: >
    taste, smell, feel は、状態を表す用法と、動作を表す用法の両方を持つ。
    「味がする」「においがする」「手触りがする」のように、物がどのように感じられるかを言うときは、
    現在形を使うのが基本。
    一方、「味見している」「においをかいでいる」「手で触って確かめている」のように、
    人や動物が意識して感覚を使っている動作なら、現在進行形を使える。

  taste_as_state:
    meaning: 味がする
    typical_form: 現在形
    example: This soup tastes salty.
    ja: このスープは塩辛い味がする。
    point: スープがどのような味かを述べている状態用法。

  taste_as_action:
    meaning: 味見する
    typical_form: 現在進行形
    example: The chef is tasting the soup.
    ja: シェフがスープを味見している。
    point: 人が意識して味を確かめている動作用法。

  smell_as_state:
    meaning: においがする
    typical_form: 現在形
    example: These flowers smell sweet.
    ja: これらの花は甘いにおいがする。
    point: 花がどのようなにおいかを述べている状態用法。

  smell_as_action:
    meaning: においをかぐ
    typical_form: 現在進行形
    example: The dog is smelling the bag.
    ja: 犬がそのかばんのにおいをかいでいる。
    point: 動物が意識してにおいを調べている動作用法。

  feel_as_state:
    meaning: 手触りがする・感じがする
    typical_form: 現在形
    example: This towel feels soft.
    ja: このタオルは柔らかい手触りがする。
    point: 物がどのように感じられるかを述べている状態用法。

  feel_as_action:
    meaning: 手で触って確かめる
    typical_form: 現在進行形
    example: She is feeling the wall for a switch.
    ja: 彼女はスイッチを探して壁を手で触っている。
    point: 人が手で触って何かを確かめている動作用法。

main_rule: >
  taste, smell, feel は、物の性質や感覚を表すときは現在形を使う。
  人や動物が意識して「味見する」「においをかぐ」「触って確かめる」という動作をしているなら、
  現在進行形を使える。日本語の「〜している」だけで判断せず、状態を述べているのか、
  感覚を使う動作をしているのかを区別する。

contrast_pairs:
  - natural: This cake tastes sweet.
    unnatural: This cake is tasting sweet.
    point: >
      ケーキがどんな味かを述べているので、状態用法の tastes が自然。

  - natural: The chef is tasting the sauce now.
    unnatural: The chef tastes the sauce now.
    point: >
      シェフが今味を確かめている動作なので、現在進行形 is tasting が自然。

  - natural: These flowers smell nice.
    unnatural: These flowers are smelling nice.
    point: >
      花がどんなにおいかを述べているので、状態用法の smell が自然。

  - natural: The dog is smelling the box.
    unnatural: The dog smells the box now.
    point: >
      犬が箱のにおいをかいで調べている動作なので、現在進行形 is smelling が自然。

  - natural: This blanket feels warm.
    unnatural: This blanket is feeling warm.
    point: >
      毛布がどのように感じられるかを述べているので、状態用法の feels が自然。

  - natural: She is feeling the door in the dark.
    unnatural: She feels the door in the dark now.
    point: >
      暗闇で手探りしている動作なので、現在進行形 is feeling が自然。

