id: g112
file: g112.yaml
title: 相関接続詞 both A and B / either A or B / neither A nor B / not only A but also
  B
type: grammar_contrast
section:
  id: s11
  title: 名詞節・接続詞
level: basic
target: 高校英文法基礎
core_question: 相関接続詞で、AとBを同じ形で並べ、意味と動詞の一致を判断できるか？
core_concept:
  both_a_and_b:
    form: both A and B
    meaning: AもBも両方
    image: 二つを両方まとめて肯定する
    examples:
    - sentence: Both Tom and Mary are students.
      ja: トムもメアリーも学生です。
      point: Tom と Mary の両方なので複数扱い。
    - sentence: She can both sing and dance.
      ja: 彼女は歌うことも踊ることもできる。
      point: sing と dance を同じ形で並べる。
  either_a_or_b:
    form: either A or B
    meaning: AかBのどちらか
    image: 二つの選択肢のうち一つ
    examples:
    - sentence: You can have either tea or coffee.
      ja: 紅茶かコーヒーのどちらかを飲めます。
      point: 選択を表す。
    - sentence: Either you or I am wrong.
      ja: あなたか私のどちらかが間違っている。
      point: 近い主語 I に合わせて am。
  neither_a_nor_b:
    form: neither A nor B
    meaning: AもBもどちらも〜ない
    image: 二つを両方否定する
    examples:
    - sentence: Neither Tom nor Mary is at home.
      ja: トムもメアリーも家にいません。
      point: 二者の両方を否定する。
    - sentence: He can neither read nor write.
      ja: 彼は読むことも書くこともできない。
      point: read と write を同じ形で並べる。
  not_only_a_but_also_b:
    form: not only A but also B
    meaning: AだけでなくBも
    image: Aに加えてBを強調する
    examples:
    - sentence: She is not only kind but also brave.
      ja: 彼女は親切なだけでなく勇敢でもある。
      point: kind と brave を同じ形で並べる。
    - sentence: Not only Tom but also his friends were invited.
      ja: トムだけでなく彼の友人たちも招待された。
      point: 近い主語 friends に合わせて were。
main_rule: 相関接続詞は、二つの要素 A と B をセットで結びつける表現。both A and B は「AもBも両方」、either A or B は「AかBのどちらか」、neither
  A nor B は「AもBもどちらも〜ない」、not only A but also B は「AだけでなくBも」。最大の注意点は、AとBを同じ文法形でそろえること。either
  A or B / neither A nor B / not only A but also B が主語になる場合、動詞は近い主語に合わせることが多い。
contrast_pairs:
- both: Both Tom and Mary are students.
  either: Either Tom or Mary is at home.
  point: both は両方なので複数扱い。either はどちらか一方。
- either: Either you or I am wrong.
  neither: Neither you nor I am wrong.
  point: either はどちらか一方、neither はどちらも否定。
- not_only: Not only Tom but also his friends were invited.
  both: Both Tom and his friends were invited.
  point: not only はB側の追加を強める。
- bad_parallel: He wants either to study abroad or starting a business.
  good_parallel: He wants either to study abroad or to start a business.
  point: AとBの形をそろえる。
