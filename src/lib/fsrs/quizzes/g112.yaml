common_mistakes:
- mistake: both A and B を単数扱いする
  correction: both A and B は両方をまとめるので、主語なら複数扱いになりやすい。
- mistake: either / neither / not only の動詞一致を常に複数にする
  correction: 近い主語に動詞を合わせることが多い。
- mistake: neither A nor B を肯定の選択と読む
  correction: neither A nor B は「AもBもどちらも〜ない」。
- mistake: AとBの形をそろえない
  correction: 名詞と名詞、to不定詞とto不定詞、動名詞と動名詞のようにそろえる。
learning_notes:
- both A and B は「AもBも両方」。
- either A or B は「AかBのどちらか」。
- neither A nor B は「AもBもどちらも〜ない」。
- not only A but also B は「AだけでなくBも」。
- 相関接続詞では、AとBを同じ文法形でそろえる。
