id: g024
file: g024.yaml
title: should vs had better
type: grammar_contrast
section:
  id: s03
  title: 助動詞・法
level: basic
target: 高校英文法基礎
core_question: 普通の助言か、切迫した警告・強い勧めか？
core_concept:
  should:
    form: should + 動詞の原形
    meaning: 〜した方がよい、という一般的・穏やかな助言を表す
    image: おすすめ / 助言 / 常識的にそうした方がよい
    examples:
    - sentence: You should exercise regularly.
      ja: 定期的に運動した方がよい。
      point: 健康のための一般的な助言を表している。
    - sentence: She should talk to her teacher.
      ja: 彼女は先生に相談した方がよい。
      point: 穏やかに勧めている。
    - sentence: We should leave some time for questions.
      ja: 質問のための時間を残しておいた方がよい。
      point: 計画上そうするのが望ましい、という助言。
  had_better:
    form: had better + 動詞の原形
    meaning: 〜した方がよい、そうしないと悪い結果になる、という強い助言・警告を表す
    image: 今すぐそうした方がよい / しないとまずい / 警告に近い
    examples:
    - sentence: You had better leave now, or you will miss the train.
      ja: 今出た方がいい。そうしないと電車に乗り遅れる。
      point: 遅れるという悪い結果が迫っている。
    - sentence: You had better not touch that wire.
      ja: その電線には触らない方がいい。
      point: 危険なので、警告として強く勧めている。
    - sentence: We had better hurry. The store closes in ten minutes.
      ja: 急いだ方がいい。店は10分で閉まる。
      point: 時間的な切迫感がある。
main_rule: should は、一般的・穏やかな助言を表す。had better は、そうしないと悪い結果になるという含みを持つ強い助言・警告を表す。had better の had は過去形の意味ではなく、後ろには必ず動詞の原形を置く。
contrast_pairs:
- should: You should see a doctor if you often feel tired.
  had_better: You had better see a doctor now. Your chest hurts badly.
  point: should は一般的な助言、had better は今すぐ必要な強い勧め。
- should: You should save some money every month.
  had_better: You had better save the file now, or you may lose your work.
  point: should は生活上の助言、had better は差し迫った悪い結果を避けるための警告。
- should: Students should read more books.
  had_better: You had better not be late again, or the coach will be angry.
  point: should は一般論、had better not は『しない方がよい』という警告。
