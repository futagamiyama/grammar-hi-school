common_mistakes:
- mistake: had better を『過去に〜した方がよかった』と考えてしまう
  correction: had better の had は過去の意味ではない。現在または近い未来への強い助言・警告を表す。
- mistake: had better to do としてしまう
  correction: had better の後ろは to 不定詞ではなく動詞の原形。正しくは You had better go.。
- mistake: should と had better を同じ強さだと思ってしまう
  correction: should は普通の助言。had better は『そうしないとまずい』という含みを持つ強い表現。
- mistake: had better を目上の人や他人に不用意に使ってしまう
  correction: had better は警告っぽく聞こえることがある。丁寧に助言するなら should や maybe you should の方が安全。
learning_notes:
- should は、高校英文法では最も基本的な『助言』の助動詞として扱う。
- had better は形は過去に見えるが、意味は現在または近い未来への強い助言・警告。
- had better には、言わない部分に『そうしないと悪いことが起こる』という圧力がある。
- 否定形は had better not + 動詞の原形。had better do not にはしない。
- 入試では、文脈に or, otherwise, now, hurry, dangerous などがあると had better が自然になりやすい。
