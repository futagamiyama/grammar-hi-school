id: g028
file: g028.yaml

title: should have 過去分詞
type: grammar_contrast

section:
  id: s03
  title: 助動詞・法

level: basic
target: 高校英文法基礎

core_question: 過去にすべきだったが、実際にはしなかったことか？

core_concept:
  should:
    form: should + 動詞の原形
    meaning: 現在・未来についての助言、義務、当然そうするべきことを表す
    image: 今・これから、そうした方がよい
    examples:
      - sentence: You should see a doctor.
        ja: 医者に診てもらうべきだ。
        point: これからするべきことへの助言。
      - sentence: We should leave early tomorrow.
        ja: 私たちは明日早く出発すべきだ。
        point: 未来の行動についての助言。

  should_have_done:
    form: should have + 過去分詞
    meaning: 過去にすべきだったが、実際にはしなかったことを表す
    image: 本当はすべきだったのに、しなかった
    examples:
      - sentence: You should have called me.
        ja: あなたは私に電話すべきだった。
        point: 実際には電話しなかった、という後悔・批判を含む。
      - sentence: I should have studied harder.
        ja: もっと一生懸命勉強すべきだった。
        point: 実際には十分に勉強しなかった、という後悔を表す。

  should_not_have_done:
    form: should not have + 過去分詞
    meaning: 過去にすべきではなかったが、実際にはしてしまったことを表す
    image: 本当はしない方がよかったのに、してしまった
    examples:
      - sentence: You should not have said that.
        ja: あなたはそんなことを言うべきではなかった。
        point: 実際には言ってしまった、という批判を含む。
      - sentence: I should not have eaten so much.
        ja: そんなにたくさん食べるべきではなかった。
        point: 実際には食べすぎた、という後悔を表す。

main_rule: >
  should + 動詞の原形は、現在・未来について「〜すべきだ」と助言する表現である。
  should have + 過去分詞は、過去を振り返って「〜すべきだった」と述べる表現で、
  実際にはしなかったという後悔・批判を含む。
  should not have + 過去分詞は、過去に実際にはしてしまったことについて、
  「〜すべきではなかった」と後悔・批判する表現である。

contrast_pairs:
  - should: You should call him now.
    should_have_done: You should have called him yesterday.
    point: >
      should call は今から電話すべきという助言。
      should have called は昨日電話すべきだったが、実際にはしなかったという意味。

  - should: I should study harder.
    should_have_done: I should have studied harder.
    point: >
      should study は今後の助言・決意。
      should have studied は過去にもっと勉強すべきだったという後悔。

  - should_have_done: You should have told me the truth.
    should_not_have_done: You should not have lied to me.
    point: >
      should have told は本当は言うべきだったのに言わなかった。
      should not have lied は本当は嘘をつくべきではなかったのに嘘をついた。

