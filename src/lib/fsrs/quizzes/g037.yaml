id: g037
file: g037.yaml

title: 群動詞の受動態
type: construction

section:
  id: s04
  title: 受動態・態

level: basic
target: 高校英文法基礎

core_question: look after, take care of などを1まとまりで扱えるか？

core_concept:
  phrasal_verb_active:
    form: 動詞 + 前置詞/副詞 + 目的語
    meaning: 動詞と前置詞・副詞がまとまって1つの意味を作る
    image: look after, take care of, laugh at などを1つの動詞として見る
    examples:
      - sentence: She looks after the children.
        ja: 彼女は子どもたちの世話をしている。
        point: look after で「世話をする」という1つの意味。
      - sentence: They took care of the old man.
        ja: 彼らはその老人の世話をした。
        point: take care of で「世話をする」という1つのまとまり。
      - sentence: Everyone laughed at him.
        ja: みんなが彼を笑った。
        point: laugh at で「〜を笑う」という1つのまとまり。

  phrasal_verb_passive:
    form: 主語 + be + 過去分詞 + 前置詞/副詞
    meaning: 群動詞の目的語を主語にした受動態
    image: 前置詞・副詞を落とさずに残す
    examples:
      - sentence: The children are looked after by her.
        ja: その子どもたちは彼女に世話されている。
        point: look after の after を残す。
      - sentence: The old man was taken care of by them.
        ja: その老人は彼らに世話された。
        point: take care of の of を残す。
      - sentence: He was laughed at by everyone.
        ja: 彼はみんなに笑われた。
        point: laugh at の at を残す。

main_rule: >
  look after, take care of, laugh at, speak to, listen to などの群動詞は、
  前置詞・副詞まで含めて1つの動詞のまとまりとして扱う。
  受動態にすると、目的語が主語になり、
  前置詞・副詞は文末側に残る。
  She looks after the children. は The children are looked after by her. となる。
  after を落として The children are looked by her. とは言わない。

contrast_pairs:
  - active: She looks after the children.
    passive: The children are looked after by her.
    point: >
      look after で1つの動詞のまとまり。
      受動態でも after を残す。

  - active: They took care of the old man.
    passive: The old man was taken care of by them.
    point: >
      take care of は3語で1つのまとまり。
      受動態では taken care of まで残す。

  - active: Everyone laughed at him.
    passive: He was laughed at by everyone.
    point: >
      laugh at は「〜を笑う」。
      受動態でも at を落とさない。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または群動詞の受動態で前置詞・副詞を残す理由を説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

