review_questions:
  - id: g108_q001
    question_type: two_choice
    prompt: The box was ___ heavy that I could not lift it.
    choices:
      - text: so
        correct: true
      - text: such
        correct: false
    answer: so
    explanation: >
      heavy は形容詞。
      形容詞を直接強めるので so heavy that ... が正しい。
    translation: その箱はとても重かったので、私は持ち上げられなかった。
    focus:
      - so_adjective_that
      - adjective
      - heavy

  - id: g108_q002
    question_type: two_choice
    prompt: It was ___ a heavy box that I could not lift it.
    choices:
      - text: such
        correct: true
      - text: so
        correct: false
    answer: such
    explanation: >
      a heavy box は名詞句。
      名詞句を強めるので such a heavy box that ... が正しい。
    translation: それはとても重い箱だったので、私は持ち上げられなかった。
    focus:
      - such_noun_that
      - noun_phrase
      - box

  - id: g108_q003
    question_type: two_choice
    prompt: She was ___ tired that she went to bed early.
    choices:
      - text: so
        correct: true
      - text: such
        correct: false
    answer: so
    explanation: >
      tired は形容詞。
      so tired that ... で「とても疲れていたので...」。
    translation: 彼女はとても疲れていたので、早く寝た。
    focus:
      - so_adjective_that
      - tired
      - result

