common_mistakes:
  - mistake: so と such をどちらも「とても」とだけ覚える
    correction: >
      so は形容詞・副詞を強める。
      such は名詞句を強める。
  - mistake: so a heavy box としてしまう
    correction: >
      a heavy box は名詞句なので such a heavy box が正しい。
  - mistake: such heavy としてしまう
    correction: >
      heavy だけなら形容詞なので so heavy が正しい。
  - mistake: such many people としてしまう
    correction: >
      many / much / few / little の数量表現では so を使う。
      so many people が正しい。
  - mistake: such an interesting book の an を落とす
    correction: >
      単数可算名詞では a/an が必要。
      such an interesting book が正しい。

learning_notes:
  - >
    so ... that は、形容詞・副詞を強めて結果を表す。
    so heavy that ... / so fast that ... の形。
  - >
    such ... that は、名詞句を強めて結果を表す。
    such a heavy box that ... の形。
  - >
    単数可算名詞では such a/an + 形容詞 + 名詞。
    複数名詞・不可算名詞では such + 形容詞 + 名詞。
  - >
    many, much, few, little は数量表現なので、
    名詞が続いても so many / so much / so few / so little を使う。
  - >
    that節は結果を表す。
    「とても〜だった。その結果...した」と考えると読みやすい。

