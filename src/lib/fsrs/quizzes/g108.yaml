id: g108
file: g108.yaml

title: 結果を表す so ... that / such ... that
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 「とても〜なので...」を、so + 形容詞/副詞 + that と such + 名詞句 + that で使い分けられるか？

core_concept:
  so_adjective_that:
    form: so + 形容詞 + that + 主語 + 動詞
    meaning: とても〜なので...
    image: 形容詞を強め、その結果を that節で述べる
    examples:
      - sentence: The box was so heavy that I could not lift it.
        ja: その箱はとても重かったので、私は持ち上げられなかった。
        point: heavy という形容詞を so が強めている。
      - sentence: She was so tired that she went to bed early.
        ja: 彼女はとても疲れていたので、早く寝た。
        point: tired という形容詞を強めて、結果を that節で述べている。
      - sentence: The problem was so difficult that no one could solve it.
        ja: その問題はとても難しかったので、誰も解けなかった。
        point: difficult が中心なので so を使う。

  so_adverb_that:
    form: so + 副詞 + that + 主語 + 動詞
    meaning: とても〜に...したので...
    image: 副詞を強め、その結果を述べる
    examples:
      - sentence: He ran so fast that no one could catch him.
        ja: 彼はとても速く走ったので、誰も追いつけなかった。
        point: fast は ran を修飾する副詞。
      - sentence: She spoke so quietly that I could hardly hear her.
        ja: 彼女はとても静かに話したので、私はほとんど聞こえなかった。
        point: quietly という副詞を so が強めている。
      - sentence: He worked so hard that he became ill.
        ja: 彼はとても一生懸命働いたので、病気になった。
        point: hard は worked を修飾する副詞。

  such_noun_that:
    form: such + a/an + 形容詞 + 単数名詞 + that + 主語 + 動詞
    meaning: とても〜な...なので...
    image: 名詞句全体を強め、その結果を述べる
    examples:
      - sentence: It was such a heavy box that I could not lift it.
        ja: それはとても重い箱だったので、私は持ち上げられなかった。
        point: a heavy box という名詞句を such が強めている。
      - sentence: She is such a good teacher that everyone likes her.
        ja: 彼女はとてもよい先生なので、皆が彼女を好きだ。
        point: a good teacher という名詞句が中心。
      - sentence: It was such an interesting book that I read it twice.
        ja: それはとても面白い本だったので、私は二回読んだ。
        point: an interesting book という名詞句を such が強めている。

  such_plural_uncountable_that:
    form: such + 形容詞 + 複数名詞/不可算名詞 + that + 主語 + 動詞
    meaning: とても〜な...なので...
    image: 複数名詞・不可算名詞では a/an を付けない
    examples:
      - sentence: They were such difficult questions that I could not answer them.
        ja: それらはとても難しい問題だったので、私は答えられなかった。
        point: questions は複数名詞なので a/an は付けない。
      - sentence: It was such good advice that I followed it.
        ja: それはとてもよい助言だったので、私はそれに従った。
        point: advice は不可算名詞なので a/an は付けない。
      - sentence: We had such bad weather that we stayed indoors.
        ja: とても悪い天気だったので、私たちは屋内にいた。
        point: weather は不可算名詞なので a/an は付けない。

  so_many_much_few_little_that:
    form: so many/much/few/little + 名詞 + that + 主語 + 動詞
    meaning: とても多く/少なく〜なので...
    image: 数量表現では名詞があっても so を使う
    examples:
      - sentence: There were so many people that we could not enter.
        ja: とても多くの人がいたので、私たちは入れなかった。
        point: many people は数量表現なので so many。
      - sentence: He had so much work that he could not sleep.
        ja: 彼にはとても多くの仕事があったので、眠れなかった。
        point: much work は数量表現なので so much。
      - sentence: There was so little time that we could not finish it.
        ja: 時間があまりにも少なかったので、私たちはそれを終えられなかった。
        point: little time は数量表現なので so little。

main_rule: >
  so ... that / such ... that は、「とても〜なので...」という結果を表す。
  so は形容詞・副詞を強める。
  The box was so heavy that I could not lift it. では、
  heavy という形容詞を so が強め、その結果を that節で述べている。
  He ran so fast that no one could catch him. では、
  fast という副詞を so が強めている。
  such は名詞句を強める。
  It was such a heavy box that I could not lift it. では、
  a heavy box という名詞句全体を such が強めている。
  単数可算名詞なら such a/an + 形容詞 + 名詞。
  複数名詞・不可算名詞なら such + 形容詞 + 名詞。
  ただし、many, much, few, little の数量表現では、名詞があっても so many people / so much work のように so を使う。

contrast_pairs:
  - so_form: The box was so heavy that I could not lift it.
    such_form: It was such a heavy box that I could not lift it.
    point: >
      so は heavy という形容詞を強める。
      such は a heavy box という名詞句を強める。

  - adjective_focus: She was so kind that everyone trusted her.
    noun_focus: She was such a kind person that everyone trusted her.
    point: >
      kind だけなら so。
      a kind person という名詞句なら such。

  - normal_such: They were such difficult questions that I could not answer them.
    quantity_so: There were so many questions that I could not answer them all.
    point: >
      difficult questions は such。
      many questions は数量表現なので so many。

