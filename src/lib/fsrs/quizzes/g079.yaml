id: g079
file: g079.yaml

title: otherwise / but に含まれる仮定法
type: grammar_contrast

section:
  id: s09
  title: 仮定法

level: basic
target: 高校英文法基礎

core_question: if がなくても、隠れた仮定を読み取れるか？

core_concept:
  otherwise_present:
    form: 現在の状況. Otherwise, 主語 + would/could/might + 動詞原形 ...
    meaning: そうでなければ、今〜だろうに
    image: 今の事実と違う条件が隠れている
    examples:
      - sentence: I am busy. Otherwise, I would help you.
        ja: 私は忙しい。そうでなければ、あなたを手伝うのに。
        point: otherwise = if I were not busy。
      - sentence: She is ill. Otherwise, she would come with us.
        ja: 彼女は病気だ。そうでなければ、私たちと一緒に来るだろうに。
        point: otherwise = if she were not ill。
      - sentence: I do not know his address. Otherwise, I could visit him.
        ja: 私は彼の住所を知らない。そうでなければ、彼を訪ねられるのに。
        point: otherwise = if I knew his address。

  otherwise_past:
    form: 過去の状況. Otherwise, 主語 + would/could/might have + 過去分詞 ...
    meaning: そうでなければ、過去に〜しただろうに
    image: 過去の事実と違う条件が隠れている
    examples:
      - sentence: I was busy. Otherwise, I would have helped you.
        ja: 私は忙しかった。そうでなければ、あなたを手伝っただろうに。
        point: otherwise = if I had not been busy。
      - sentence: She was ill. Otherwise, she would have come with us.
        ja: 彼女は病気だった。そうでなければ、私たちと一緒に来ただろうに。
        point: otherwise = if she had not been ill。
      - sentence: I did not know his address. Otherwise, I could have visited him.
        ja: 私は彼の住所を知らなかった。そうでなければ、彼を訪ねられたのに。
        point: otherwise = if I had known his address。

  but_hidden_condition:
    form: 主語 + would/could/might ... , but + 事実
    meaning: 〜するだろうに、しかし実際には...
    image: but の後ろに、仮定を妨げる事実が来る
    examples:
      - sentence: I would help you, but I am busy.
        ja: あなたを手伝うのに、でも私は忙しい。
        point: If I were not busy, I would help you. に近い。
      - sentence: I would have helped you, but I was busy.
        ja: あなたを手伝っただろうに、でも私は忙しかった。
        point: If I had not been busy, I would have helped you. に近い。
      - sentence: She could have passed the exam, but she did not study hard.
        ja: 彼女は試験に合格できただろうに、しかし一生懸命勉強しなかった。
        point: 過去の非現実の結果を could have passed で表している。

main_rule: >
  仮定法は、必ず if を使うとは限らない。
  otherwise は「そうでなければ」という意味で、隠れた if 条件を表す。
  I am busy. Otherwise, I would help you. は
  If I were not busy, I would help you. に近い。
  現在の非現実なら would/could/might + 動詞原形。
  過去の非現実なら would/could/might have + 過去分詞。
  また、I would help you, but I am busy. のように、
  but の後ろの事実が、仮定を妨げる条件として働くこともある。
  if が見えなくても、would / could have などから仮定法を読み取る。

contrast_pairs:
  - present: I am busy. Otherwise, I would help you.
    past: I was busy. Otherwise, I would have helped you.
    point: >
      would help は現在の非現実。
      would have helped は過去の非現実。

  - if_version: If I were not busy, I would help you.
    otherwise_version: I am busy. Otherwise, I would help you.
    point: >
      otherwise は「そうでなければ」。
      if 条件を別の形で表している。

  - otherwise: She was ill. Otherwise, she would have come.
    but: She would have come, but she was ill.
    point: >
      otherwise は事実の後に仮定結果を言う。
      but は仮定結果の後に、それを妨げた事実を言う。

