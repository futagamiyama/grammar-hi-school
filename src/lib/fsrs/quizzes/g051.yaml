review_questions:
  - id: g051_q001
    question_type: two_choice
    prompt: There are ___ students in the classroom.
    choices:
      - text: many
        correct: true
      - text: much
        correct: false
    answer: many
    explanation: >
      students は数えられる複数名詞。
      複数可算名詞には many を使う。
    translation: 教室には多くの生徒がいる。
    focus:
      - many
      - countable_plural
      - students

  - id: g051_q002
