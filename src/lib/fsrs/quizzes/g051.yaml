id: g051
file: g051.yaml

title: many / much
type: grammar_contrast

section:
  id: s06
  title: 名詞・冠詞・数量表現

level: basic
target: 高校英文法基礎

core_question: 数えられる名詞か、量として見る名詞か？

core_concept:
  many:
    form: many + 複数可算名詞
    meaning: 多くの〜
    image: 1つ、2つと数えられるものがたくさんある
    examples:
      - sentence: There are many students in the classroom.
        ja: 教室には多くの生徒がいる。
        point: students は数えられる複数名詞なので many。
      - sentence: She has read many books.
        ja: 彼女は多くの本を読んだことがある。
        point: books は数えられる複数名詞なので many。
      - sentence: How many questions did you answer?
        ja: あなたはいくつの質問に答えましたか。
        point: questions は数えられるので How many。

  much:
    form: much + 不可算名詞
    meaning: 多くの〜、多量の〜
    image: 数ではなく量として見るものがたくさんある
    examples:
      - sentence: We do not have much time.
        ja: 私たちにはあまり時間がない。
        point: time は不可算名詞なので much。
      - sentence: How much water do you need?
        ja: どれくらいの水が必要ですか。
        point: water は量として見るので How much。
      - sentence: He does not have much money.
        ja: 彼にはあまりお金がない。
        point: money は不可算名詞なので much。

main_rule: >
  many は複数可算名詞に使い、much は不可算名詞に使う。
  many books, many students, many questions のように、1つ2つと数えられるものには many。
  much time, much water, much money のように、量として見るものには much。
  疑問文では How many + 複数可算名詞、How much + 不可算名詞を使う。
  否定文では not many, not much がよく使われる。
  肯定文では many/much も使えるが、日常的には a lot of がよく使われる。

contrast_pairs:
  - countable: many books
    uncountable: much time
    point: >
      books は数えられるので many。
      time は量として見るので much。

  - countable: How many people came?
    uncountable: How much money do you need?
    point: >
      people は人数として数えられるので How many。
      money は金額・量として見るので How much。

  - countable: I do not have many friends.
    uncountable: I do not have much free time.
    point: >
      friends は複数可算名詞なので many。
      free time は不可算名詞なので much。

