common_mistakes:
  - mistake: many と much をどちらも「たくさん」とだけ覚える
    correction: >
      many は数えられる複数名詞に使う。
      much は不可算名詞に使う。
      名詞が数か量かで判断する。
  - mistake: many money と言ってしまう
    correction: >
      money は不可算名詞なので much money。
      日常的には a lot of money もよく使う。
  - mistake: much books と言ってしまう
    correction: >
      books は複数可算名詞なので many books。
      much は使わない。
  - mistake: information を可算名詞として many informations としてしまう
    correction: >
      information は不可算名詞。
      much information または a lot of information とする。
      個別の情報は pieces of information と表す。
  - mistake: How many と How much を日本語の「いくつ」だけで判断する
    correction: >
      数をたずねるなら How many。
      量・金額・時間などをたずねるなら How much。

learning_notes:
  - >
    many は「数」、much は「量」。
    まず後ろの名詞が数えられるかどうかを見る。
  - >
    How many books? は「何冊」。
    How much water? は「どれくらいの水」。
  - >
    time, money, water, information, advice, homework, coffee, sugar などは
    高校英語でよく出る不可算名詞。
  - >
    肯定文では many/much より a lot of が自然なことも多い。
    ただし文法問題では many/much の可算・不可算の判定が重要。

