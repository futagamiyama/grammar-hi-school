id: g049
file: g049.yaml

title: few / a few
type: grammar_contrast

section:
  id: s06
  title: 名詞・冠詞・数量表現

level: basic
target: 高校英文法基礎

core_question: ほとんどないのか、少しはあるのか？

core_concept:
  few:
    form: few + 複数可算名詞
    meaning: ほとんど〜ない
    image: 数が少なすぎて、不十分・否定的
    examples:
      - sentence: Few students understood the question.
        ja: その質問を理解した生徒はほとんどいなかった。
        point: 理解した生徒が少なすぎるという否定的な意味。
      - sentence: Few people came to the meeting.
        ja: その会議に来た人はほとんどいなかった。
        point: 人数が期待より少ない。
      - sentence: He has few friends in this city.
        ja: 彼にはこの町に友人がほとんどいない。
        point: 友人の数が少なく、不十分という感じ。

  a_few:
    form: a few + 複数可算名詞
    meaning: 少しはある、2・3の〜がある
    image: 数は多くないが、あるにはある
    examples:
      - sentence: A few students understood the question.
        ja: その質問を理解した生徒が少しはいた。
        point: 少数だが、理解した生徒がいたという肯定的な意味。
      - sentence: A few people came to the meeting.
        ja: その会議に何人か来た。
        point: 人数は少ないが、来た人はいた。
      - sentence: He has a few friends in this city.
        ja: 彼にはこの町に友人が何人かいる。
        point: 多くはないが、友人がいる。

main_rule: >
  few は「ほとんど〜ない」という否定的な意味を持つ。
  a few は「少しはある」「何人か・いくつかある」という肯定的な意味を持つ。
  どちらも複数可算名詞に使う。
  Few students came. は「来た生徒はほとんどいなかった」。
  A few students came. は「少しは生徒が来た」。
  a があるかないかで、意味の向きが大きく変わる。

contrast_pairs:
  - negative: Few students passed the test.
    positive: A few students passed the test.
    point: >
      Few students は「ほとんど合格しなかった」。
      A few students は「少しは合格した」。

  - negative: He has few friends.
    positive: He has a few friends.
    point: >
      few friends は「友人がほとんどいない」。
      a few friends は「友人が何人かいる」。

  - negative: There were few chairs in the room.
    positive: There were a few chairs in the room.
    point: >
      few chairs は「椅子がほとんどない」。
      a few chairs は「椅子がいくつかある」。

