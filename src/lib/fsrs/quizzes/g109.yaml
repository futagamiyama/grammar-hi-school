review_questions:
  - id: g109_q001
    question_type: two_choice
    prompt: Call me when you ___.
    choices:
      - text: arrive
        correct: true
      - text: will arrive
        correct: false
    answer: arrive
    explanation: >
      when が時を表す副詞節を作っている。
      未来の内容でも、when節の中は現在形 arrive を使う。
    translation: 到着したら私に電話してください。
    focus:
      - when_time_clause
      - future_in_time_clause
      - arrive

  - id: g109_q002
    question_type: two_choice
    prompt: When I ___ home, it was raining.
    choices:
      - text: got
        correct: true
      - text: get
        correct: false
    answer: got
    explanation: >
      主節 it was raining が過去なので、
      家に着いた時点も過去の got home にする。
    translation: 私が家に着いた時、雨が降っていた。
    focus:
      - when_time_clause
      - past
      - got_home

  - id: g109_q003
    question_type: two_choice
    prompt: I read a book ___ I was waiting.
    choices:
      - text: while
        correct: true
      - text: until
        correct: false
    answer: while
    explanation: >
      I was waiting は継続中の行為。
      「待っている間」を表すので while が自然。
    translation: 待っている間、私は本を読んだ。
    focus:
      - while_time_clause
      - duration
      - waiting

  - id: g109_q004
    question_type: two_choice
    prompt: Please be quiet ___ I am speaking.
    choices:
      - text: while
        correct: true
      - text: after
        correct: false
    answer: while
    explanation: >
      I am speaking は今続いている動作。
      「話している間は静かにして」と言うので while を使う。
    translation: 私が話している間は静かにしてください。
    focus:
      - while_time_clause
      - speaking
      - be_quiet

  - id: g109_q005
    question_type: two_choice
    prompt: ___ some people agreed, others disagreed.
    choices:
      - text: While
        correct: true
      - text: Until
        correct: false
    answer: While
    explanation: >
      while は「一方で」という対比も表す。
      賛成する人と反対する人を対比している。
    translation: 賛成する人もいれば、反対する人もいた。
    focus:
      - while_time_clause
      - contrast
      - agreed_disagreed

  - id: g109_q006
    question_type: two_choice
    prompt: ___ I opened the door, the phone rang.
    choices:
      - text: As
        correct: true
      - text: Until
        correct: false
    answer: As
    explanation: >
      ドアを開けたことと電話が鳴ったことがほぼ同時に起きている。
      同時性を表す as が自然。
    translation: 私がドアを開けた時、電話が鳴った。
    focus:
      - as_time_clause
      - simultaneous
      - phone_rang

  - id: g109_q007
    question_type: two_choice
    prompt: ___ he grew older, he became wiser.
    choices:
      - text: As
        correct: true
      - text: Before
        correct: false
    answer: As
    explanation: >
      As he grew older で「彼が年を取るにつれて」。
      変化が同時に進むことを表す。
    translation: 彼は年を取るにつれて、より賢くなった。
    focus:
      - as_time_clause
      - as_change
      - grew_older

  - id: g109_q008
    question_type: two_choice
    prompt: Wash your hands ___ you eat.
    choices:
      - text: before
        correct: true
      - text: after
        correct: false
    answer: before
    explanation: >
      食べる前に手を洗う、という前後関係。
      before you eat が正しい。
    translation: 食べる前に手を洗いなさい。
    focus:
      - before_after_clause
      - before
      - eat

  - id: g109_q009
    question_type: two_choice
    prompt: I will call you after I ___ my homework.
    choices:
      - text: finish
        correct: true
      - text: will finish
        correct: false
    answer: finish
    explanation: >
      after が時を表す副詞節を作っている。
      未来の内容でも after節の中は現在形 finish を使う。
    translation: 宿題を終えた後で、あなたに電話します。
    focus:
      - before_after_clause
      - future_in_time_clause
      - after

  - id: g109_q010
    question_type: two_choice
    prompt: Wait here until I ___ back.
    choices:
      - text: come
        correct: true
      - text: will come
        correct: false
    answer: come
    explanation: >
      until が時を表す副詞節を作っている。
      未来の内容でも until I come back と現在形にする。
    translation: 私が戻るまでここで待っていてください。
    focus:
      - until_clause
      - future_in_time_clause
      - come_back

  - id: g109_q011
    question_type: two_choice
    prompt: He did not know the truth ___ he read the letter.
    choices:
      - text: until
        correct: true
      - text: while
        correct: false
    answer: until
    explanation: >
      not ... until で「〜するまで...しなかった」。
      その手紙を読んで初めて真実を知った、という意味。
    translation: 彼はその手紙を読むまで真実を知らなかった。
    focus:
      - until_clause
      - not_until
      - truth

  - id: g109_q012
    question_type: two_choice
    prompt: Stay here until the rain ___.
    choices:
      - text: stops
        correct: true
      - text: will stop
        correct: false
    answer: stops
    explanation: >
      until the rain stops は時の副詞節。
      未来のことでも、節の中は現在形 stops にする。
    translation: 雨がやむまでここにいなさい。
    focus:
      - future_in_time_clause
      - until
      - rain_stops

common_mistakes:
  - mistake: 時の副詞節で will を使ってしまう
    correction: >
      when / before / after / until などが時を表す副詞節を作る時は、
      未来の内容でも現在形を使う。
      when I arrive / after he comes / until it stops。
  - mistake: when と while を同じように使う
    correction: >
      when は時点・出来事に注目する。
      while は継続している時間に注目する。
  - mistake: as を理由の「〜なので」とだけ読む
    correction: >
      as は時の「〜するとき」「〜しながら」「〜するにつれて」も表す。
      文脈で判断する。
  - mistake: until を「〜までに」と読む
    correction: >
      until は「〜までずっと」。
      完了期限を表す by とは違う。
  - mistake: not ... until を直訳して意味を取りづらくする
    correction: >
      not ... until は「〜して初めて...する」と読むと自然な場合がある。
      He did not know the truth until he read the letter.。

learning_notes:
  - >
    when は「〜するとき」。
    ある時点・出来事を基準にする。
  - >
    while は「〜している間」。
    継続中の時間や、対比の「一方で」を表す。
  - >
    as は「〜するとき」「〜しながら」「〜するにつれて」。
    二つの出来事や変化が同時に進む感じがある。
  - >
    before / after は前後関係、until は継続の終点を表す。
  - >
    時の副詞節では未来の内容でも現在形。
    when I arrive / after he comes / until the rain stops を基本形として覚える。

