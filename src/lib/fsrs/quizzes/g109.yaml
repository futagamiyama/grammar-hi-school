id: g109
file: g109.yaml

title: 時を表す接続詞 when / while / as / before / after / until
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 時を表す接続詞の意味と、時の副詞節では未来内容でも現在形を使うことを理解できるか？

core_concept:
  when_time_clause:
    form: when + 主語 + 動詞
    meaning: 〜するとき、〜したとき
    image: ある時点・出来事を基準にする
    examples:
      - sentence: Call me when you arrive.
        ja: 到着したら私に電話してください。
        point: 未来のことでも、when節の中は arrive と現在形。
      - sentence: When I got home, it was raining.
        ja: 私が家に着いた時、雨が降っていた。
        point: got home という時点を基準にしている。
      - sentence: I was happy when I heard the news.
        ja: その知らせを聞いた時、私はうれしかった。
        point: heard the news という出来事の時を表す。

  while_time_clause:
    form: while + 主語 + 動詞
    meaning: 〜している間に、〜する一方で
    image: ある程度続く時間の中で起こる
    examples:
      - sentence: I read a book while I was waiting.
        ja: 待っている間、私は本を読んだ。
        point: while は継続している時間を表す。
      - sentence: Please be quiet while I am speaking.
        ja: 私が話している間は静かにしてください。
        point: speaking という継続中の行為に注目している。
      - sentence: While some people agreed, others disagreed.
        ja: 賛成する人もいれば、反対する人もいた。
        point: while は「一方で」という対比も表す。

  as_time_clause:
    form: as + 主語 + 動詞
    meaning: 〜するとき、〜しながら、〜するにつれて
    image: 二つの出来事が同時に進む
    examples:
      - sentence: As I opened the door, the phone rang.
        ja: 私がドアを開けた時、電話が鳴った。
        point: ほぼ同時に起こった出来事を表す。
      - sentence: She smiled as she listened to the music.
        ja: 彼女は音楽を聴きながら微笑んだ。
        point: listened と smiled が同時に進んでいる。
      - sentence: As he grew older, he became wiser.
        ja: 彼は年を取るにつれて、より賢くなった。
        point: as は「〜するにつれて」も表す。

  before_after_clause:
    form: before/after + 主語 + 動詞
    meaning: 〜する前に、〜した後で
    image: 出来事の前後関係を示す
    examples:
      - sentence: Wash your hands before you eat.
        ja: 食べる前に手を洗いなさい。
        point: before の後ろは文。未来の内容でも eat は現在形。
      - sentence: I will call you after I finish my homework.
        ja: 宿題を終えた後で、あなたに電話します。
        point: after節の中は will finish ではなく finish。
      - sentence: He left before I arrived.
        ja: 私が到着する前に、彼は出発した。
        point: before で二つの出来事の順序を示す。

  until_clause:
    form: until + 主語 + 動詞
    meaning: 〜するまでずっと
    image: ある時点まで状態・動作が続く
    examples:
      - sentence: Wait here until I come back.
        ja: 私が戻るまでここで待っていてください。
        point: 未来のことでも until節の中は come back。
      - sentence: I studied until midnight.
        ja: 私は真夜中まで勉強した。
        point: until は継続の終点を示す。
      - sentence: He did not know the truth until he read the letter.
        ja: 彼はその手紙を読むまで真実を知らなかった。
        point: not ... until で「〜して初めて...する」の意味になる。

  future_in_time_clause:
    form: when/before/after/until + 主語 + 現在形
    meaning: 未来の内容でも、時の副詞節では現在形
    image: 時を表す節の中では will を使わない
    examples:
      - sentence: I will call you when I arrive.
        ja: 到着したらあなたに電話します。
        point: when I will arrive ではなく when I arrive。
      - sentence: We will start after he comes.
        ja: 彼が来た後で、私たちは始めます。
        point: after he will come ではなく after he comes。
      - sentence: Stay here until the rain stops.
        ja: 雨がやむまでここにいなさい。
        point: until the rain will stop ではなく until the rain stops。

main_rule: >
  時を表す接続詞には when, while, as, before, after, until などがある。
  when は「〜するとき」で、ある時点や出来事を基準にする。
  while は「〜している間に」で、継続している時間に注目する。
  as は「〜するとき」「〜しながら」「〜するにつれて」のように、
  二つの出来事が同時に進む感じを表す。
  before / after は出来事の前後関係を示す。
  until は「〜するまでずっと」で、ある時点まで状態や動作が続くことを表す。
  重要なのは、時の副詞節では未来の内容でも will を使わず、現在形を使うこと。
  I will call you when I arrive. が正しく、when I will arrive とはしない。
  after he comes, before you eat, until the rain stops も同じ型。

contrast_pairs:
  - when: Call me when you arrive.
    while: I read a book while I was waiting.
    point: >
      when は到着する時点を表す。
      while は待っている間という継続時間を表す。

  - while: She smiled while she was listening to music.
    as: She smiled as she listened to the music.
    point: >
      while は「その間」を強く意識する。
      as は二つの動作が同時に進む感じを表す。

  - correct: I will call you when I arrive.
    incorrect: I will call you when I will arrive.
    point: >
      時の副詞節では、未来の内容でも現在形を使う。
      when I arrive が正しい。

  - until: Wait here until I come back.
    by: Finish it by tomorrow.
    point: >
      until は「その時までずっと続く」。
      by は「その時までに完了する」。
      このカードでは until の継続感に注目する。

