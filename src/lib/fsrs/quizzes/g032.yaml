      - important_agent
      - by_phrase

common_mistakes:
  - mistake: 受動態には必ず by をつけると思う
    correction: >
      行為者が不明・一般的・重要でない場合、by は省略する。
      My bike was stolen. のように、by なしで自然な受動態は多い。
  - mistake: by people や by someone を機械的につける
    correction: >
      by people や by someone は情報量が少ないことが多い。
      誰がしたかが文の重要情報でないなら省略する。
  - mistake: 行為者を明示しているのに by を抜かす
    correction: >
      Shakespeare, my sister, the manager のように行為者を明示するなら、
      was written by Shakespeare のように by が必要。
  - mistake: 受動態の主語だけを見て by の有無を決める
    correction: >
      by を使うかどうかは、主語ではなく「行為者を言う必要があるか」で決まる。

learning_notes:
  - >
    受動態の by は「誰によって」を示す。
    しかし、受動態だからといって必ず by が必要なわけではない。
  - >
    行為者がわからないとき、一般的すぎるとき、重要でないときは by を省略する。
  - >
    作者・発明者・責任者・具体的な行為者を示すときは by が重要になる。
  - >
    受動態では「何がされたか」を中心にする。
    by は必要なときだけ足す情報と考える。

