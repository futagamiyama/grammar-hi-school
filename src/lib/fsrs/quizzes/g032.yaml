      - explicit_agent
      - by_phrase

  - id: g032_q011
    question_type: two_choice
    prompt: The problem was solved ___.
    choices:
      - text: ""
        correct: true
      - text: by someone
        correct: false
    answer: ""
    explanation: >
      誰が解決したかを言う必要がない場合、
      The problem was solved. が自然。
      by someone は情報量が少なく、普通は不要。
    translation: その問題は解決された。
    focus:
      - passive_without_by
      - unimportant_agent
      - solved

  - id: g032_q012
    question_type: two_choice
    prompt: The problem was solved ___ a young engineer.
    choices:
      - text: ""
        correct: false
      - text: by
        correct: true
    answer: by
    explanation: >
      a young engineer という行為者を示しているので by が必要。
      誰が解決したかが重要な情報になっている。
    translation: その問題は若い技術者によって解決された。
    focus:
