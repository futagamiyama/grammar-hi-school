  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または try to do と try doing の意味差を説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g043_q001
    question_type: two_choice
    prompt: I tried ___ the heavy door, but I couldn't.
    choices:
      - text: to open
        correct: true
      - text: opening
        correct: false
    answer: to open
    explanation: >
      but I couldn't があるので、ドアを開けようと努力したができなかったという意味。
      努力を表す try to open が自然。
    translation: 私はその重いドアを開けようとしたが、できなかった。
    focus:
      - try_to_do
      - effort
      - failed_attempt

  - id: g043_q002
    question_type: two_choice
    prompt: If the room is hot, try ___ the window.
    choices:
      - text: to open
        correct: false
      - text: opening
        correct: true
    answer: opening
    explanation: >
      暑い部屋への対処法として、試しに窓を開けてみるという意味。
      方法を試すので try opening が自然。
    translation: 部屋が暑いなら、試しに窓を開けてみなさい。
    focus:
      - try_doing
      - experiment
      - solution_attempt

  - id: g043_q003
    question_type: two_choice
    prompt: She tried ___ the problem, but it was too difficult.
    choices:
