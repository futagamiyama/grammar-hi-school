common_mistakes:
  - mistake: try to do と try doing をどちらも同じ「〜してみる」と考える
    correction: >
      try to do は「努力して〜しようとする」。
      try doing は「試しに〜してみる」。
      努力なのか、方法の試行なのかを区別する。
  - mistake: I tried opening the door, but I couldn't. を自然だと思う
    correction: >
      「開けようとしたができなかった」は I tried to open the door, but I couldn't. が自然。
      try opening は「方法として開けてみる」という意味。
  - mistake: 対処法をすすめる文で try to do を使ってしまう
    correction: >
      「試しに〜してみなさい」は try doing が自然。
      Try restarting the computer. / Try drinking warm milk.
  - mistake: try doing を「努力」の意味で使う
    correction: >
      難しい目標に向かって努力するなら try to do。
      Try to solve the problem. は「解こうと努力する」。

learning_notes:
  - >
    try to do は、成功するかわからないことに向かって努力する。
    「何とか〜しようとする」と考える。
  - >
    try doing は、効果があるか確かめるために方法を試す。
    「試しに〜してみる」と考える。
  - >
    try to open the door は「ドアを開けようとする」。
    try opening the door は「試しにドアを開けてみる」。
  - >
    remember, forget, stop, try は、to do と doing の違いが意味差に直結する代表的な動詞。

