id: g043
file: g043.yaml

title: try to do vs try doing
type: verb_usage

section:
  id: s05
  title: 不定詞・動名詞・分詞

level: basic
target: 高校英文法基礎

core_question: 努力してやろうとするのか、試しにやってみるのか？

core_concept:
  try_to_do:
    form: try + to do
    meaning: 難しいこと・必要なことをしようと努力する
    image: 目的に向かって努力する
    examples:
      - sentence: I tried to open the door.
        ja: 私はそのドアを開けようとした。
        point: ドアを開けることを目標に努力した。
      - sentence: She tried to solve the problem.
        ja: 彼女はその問題を解こうとした。
        point: 解くことが難しく、努力している。
      - sentence: He tried to stay awake.
        ja: 彼は起きていようとした。
        point: 眠らないように努力した。

  try_doing:
    form: try + doing
    meaning: 効果があるかどうか試しに〜してみる
    image: 方法を試す・実験する
    examples:
      - sentence: Try opening the window.
        ja: 試しに窓を開けてみなさい。
        point: 窓を開ける方法を試してみる。
      - sentence: I tried restarting the computer.
        ja: 私は試しにコンピューターを再起動してみた。
        point: 問題解決の方法として再起動を試した。
      - sentence: Try taking a deep breath.
        ja: 試しに深呼吸してみなさい。
        point: 落ち着くための方法として試している。

main_rule: >
  try to do は「〜しようと努力する」「何とか〜しようとする」。
  try doing は「試しに〜してみる」「方法として〜を試す」。
  to do は目標へ向かう努力を表し、doing は試す方法・手段を表す。
  日本語ではどちらも「〜してみる」と訳せることがあるため、
  難しい目標に向かって努力しているのか、効果を確かめるために試しているのかで判断する。

contrast_pairs:
  - effort: I tried to open the door.
    experiment: I tried opening the door.
    point: >
      tried to open は、開けようと努力した。
      tried opening は、方法として開けてみた。

  - effort: She tried to solve the problem.
    experiment: She tried using a different method.
    point: >
      tried to solve は、問題を解こうと努力した。
      tried using は、別の方法を試してみた。

  - effort: He tried to sleep.
    experiment: He tried drinking warm milk.
    point: >
      tried to sleep は、眠ろうと努力した。
      tried drinking warm milk は、眠る方法として温かい牛乳を飲んでみた。

