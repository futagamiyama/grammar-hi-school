id: g078
file: g078.yaml

title: if の省略と倒置
type: construction

section:
  id: s09
  title: 仮定法

level: basic
target: 高校英文法基礎

core_question: if が省略された仮定法の倒置を読めるか？

core_concept:
  were_inversion:
    form: Were + 主語 + 補語 ..., 主語 + would/could/might + 動詞原形 ...
    meaning: もし今〜なら、...だろうに
    image: If + 主語 + were の if を省略し、were を前に出す
    examples:
      - sentence: Were I rich, I would travel around the world.
        ja: もし私が金持ちなら、世界中を旅行するのに。
        point: If I were rich と同じ意味の硬い表現。
      - sentence: Were she here, she could help us.
        ja: もし彼女がここにいれば、私たちを助けられるのに。
        point: If she were here の if を省略した形。
      - sentence: Were it not for water, we could not live.
        ja: もし水がなければ、私たちは生きられないだろう。
        point: If it were not for water の倒置。

  had_inversion:
    form: Had + 主語 + 過去分詞 ..., 主語 + would/could/might have + 過去分詞 ...
    meaning: もし過去に〜していたら、...だっただろうに
    image: If + 主語 + had + 過去分詞 の if を省略し、had を前に出す
    examples:
      - sentence: Had I known the truth, I would have told you.
        ja: もし私が真実を知っていたら、あなたに話しただろうに。
        point: If I had known the truth と同じ意味。
      - sentence: Had he studied harder, he would have passed the exam.
        ja: もし彼がもっと一生懸命勉強していたら、試験に合格していただろうに。
        point: If he had studied harder の倒置。
      - sentence: Had it not been for your help, I would have failed.
        ja: もしあなたの助けがなかったなら、私は失敗していただろう。
        point: If it had not been for your help の倒置。

  should_inversion:
    form: Should + 主語 + 動詞原形 ..., 主語 + will/would/can/could + 動詞原形 ...
    meaning: 万一〜なら
    image: 可能性の低い未来の条件を硬く表す
    examples:
      - sentence: Should you need help, please call me.
        ja: 万一助けが必要なら、私に電話してください。
        point: If you should need help と同じ意味の硬い表現。
      - sentence: Should it rain tomorrow, the game will be canceled.
        ja: 万一明日雨が降れば、試合は中止されるだろう。
        point: 起こる可能性が低い条件を表す。
      - sentence: Should you have any questions, feel free to ask.
        ja: ご質問がありましたら、遠慮なくお尋ねください。
        point: 丁寧な案内文でよく使われる形。

main_rule: >
  仮定法では、if を省略して語順を倒置することがある。
  If I were rich は Were I rich となる。
  If I had known the truth は Had I known the truth となる。
  If it had not been for your help は Had it not been for your help となる。
  この倒置は硬い書き言葉で、入試英文・論説文・案内文などに出やすい。
  Were + 主語 は現在の非現実。
  Had + 主語 + 過去分詞 は過去の非現実。
  Should + 主語 + 動詞原形 は「万一〜なら」という低い可能性の未来条件を表す。

contrast_pairs:
  - normal_if: If I were rich, I would travel around the world.
    inversion: Were I rich, I would travel around the world.
    point: >
      Were I rich は If I were rich と同じ意味。
      if を省略し、were を主語の前に出している。

  - normal_if: If I had known the truth, I would have told you.
    inversion: Had I known the truth, I would have told you.
    point: >
      Had I known は If I had known と同じ意味。
      過去の非現実を表す。

  - normal_if: If you should need help, please call me.
    inversion: Should you need help, please call me.
    point: >
      Should you need help は「万一助けが必要なら」。
      丁寧で硬い条件表現。

