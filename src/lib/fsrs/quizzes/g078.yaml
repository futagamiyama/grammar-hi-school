  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または if 省略倒置の Were / Had / Should の違いを説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g078_q001
    question_type: two_choice
    prompt: ___ I rich, I would travel around the world.
    choices:
      - text: Were
        correct: true
      - text: Had
        correct: false
    answer: Were
    explanation: >
      If I were rich の if を省略した倒置。
      現在の非現実なので Were I rich が自然。
    translation: もし私が金持ちなら、世界中を旅行するのに。
    focus:
      - were_inversion
      - present_unreal
      - if_omission

  - id: g078_q002
    question_type: two_choice
    prompt: ___ she here, she could help us.
    choices:
      - text: Were
        correct: true
      - text: Had
        correct: false
    answer: Were
    explanation: >
      If she were here の倒置。
      今ここにいない人についての現在の非現実なので Were を使う。
    translation: もし彼女がここにいれば、私たちを助けられるのに。
    focus:
      - were_inversion
      - could
      - here

  - id: g078_q003
    question_type: two_choice
    prompt: ___ I known the truth, I would have told you.
    choices:
      - text: Had
        correct: true
      - text: Were
        correct: false
    answer: Had
    explanation: >
      If I had known the truth の倒置。
      過去の非現実なので Had I known を使う。
    translation: もし私が真実を知っていたら、あなたに話しただろうに。
    focus:
      - had_inversion
      - past_unreal
      - had_known

  - id: g078_q004
    question_type: two_choice
    prompt: ___ he studied harder, he would have passed the exam.
    choices:
      - text: Had
        correct: true
      - text: Should
        correct: false
    answer: Had
    explanation: >
      If he had studied harder の倒置。
      would have passed があるので過去の非現実。
    translation: もし彼がもっと一生懸命勉強していたら、試験に合格していただろうに。
    focus:
      - had_inversion
      - would_have
      - exam

  - id: g078_q005
    question_type: two_choice
    prompt: ___ it not for water, we could not live.
    choices:
      - text: Were
        correct: true
      - text: Had
        correct: false
    answer: Were
    explanation: >
      If it were not for water の倒置。
      現在ある水がない場合の仮定なので Were it not for を使う。
    translation: もし水がなければ、私たちは生きられないだろう。
    focus:
      - were_inversion
      - if_it_were_not_for
      - water

  - id: g078_q006
    question_type: two_choice
    prompt: ___ it not been for your help, I would have failed.
    choices:
      - text: Had
        correct: true
      - text: Were
        correct: false
    answer: Had
    explanation: >
      If it had not been for your help の倒置。
      would have failed があるので過去の非現実。
    translation: もしあなたの助けがなかったなら、私は失敗していただろう。
    focus:
      - had_inversion
      - if_it_had_not_been_for
      - help

  - id: g078_q007
    question_type: two_choice
