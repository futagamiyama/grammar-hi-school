      未来の条件を硬く表している。
    translation: 万一この計画が失敗したら、別の案を試します。
    focus:
      - should_inversion
      - future_condition
      - plan

common_mistakes:
  - mistake: Were I rich を疑問文だと思う
    correction: >
      Were I rich は If I were rich の if 省略倒置。
      疑問文ではなく仮定条件を表す。
  - mistake: Had I known を「私は知っていたか」と読む
    correction: >
      Had I known は If I had known の倒置。
      「もし私が知っていたら」という意味。
  - mistake: Should you need help を「あなたは助けを必要とすべきだ」と読む
    correction: >
      Should you need help は If you should need help の倒置で、
      「万一助けが必要なら」という条件を表す。
  - mistake: Were / Had / Should の時制を区別しない
    correction: >
      Were は現在の非現実。
      Had + 過去分詞は過去の非現実。
      Should + 動詞原形は未来の低い可能性。
  - mistake: 倒置を普通の if 文に戻せない
    correction: >
      Were I rich → If I were rich。
      Had I known → If I had known。
      Should you need help → If you should need help。

learning_notes:
  - >
    if の省略倒置は硬い書き言葉。
    普通の会話より、入試英文・論説文・案内文で見かける。
  - >
    Were + 主語 は If + 主語 + were。
    現在の非現実を表す。
  - >
    Had + 主語 + 過去分詞 は If + 主語 + had + 過去分詞。
    過去の非現実を表す。
  - >
    Should + 主語 + 動詞原形 は If + 主語 + should + 動詞原形。
    「万一〜なら」という未来の条件を表す。

