      現在の非現実なので Were I in your position が自然。
    translation: もし私があなたの立場なら、その申し出を受け入れるだろう。
    focus:
      - were_inversion
      - advice
      - present_unreal

  - id: g078_q011
    question_type: two_choice
    prompt: ___ they left earlier, they might have met her.
    choices:
      - text: Had
        correct: true
      - text: Should
        correct: false
    answer: Had
    explanation: >
      If they had left earlier の倒置。
      might have met があるので過去の非現実。
    translation: もし彼らがもっと早く出発していたら、彼女に会えたかもしれないのに。
    focus:
