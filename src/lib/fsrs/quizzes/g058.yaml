common_mistakes:
  - mistake: the を普通の冠詞「その」と読んでしまう
    correction: >
      the 比較級, the 比較級 の the は構文の一部。
      「その多く」ではなく、「〜すればするほど」という意味を作る。
  - mistake: 比較級ではなく最上級を入れてしまう
    correction: >
      この構文は比較級を2回使う。
      The more ..., the better ... のように、most や best ではなく more, better を使う。
  - mistake: 後半の the を落としてしまう
    correction: >
      The more you practice, the better you become. のように、
      前半にも後半にも the を置く。
  - mistake: than を入れてしまう
    correction: >
      the 比較級, the 比較級 は than を使わない。
      The faster you run, the sooner you arrive. が自然。
  - mistake: ただの比較級と比例関係を混同する
    correction: >
      older than は単に2つを比べる。
      The older we get, the wiser we become. は2つの変化が連動している。

learning_notes:
  - >
    the 比較級, the 比較級 は「一方が変わると、もう一方も変わる」という構文。
  - >
    前半は条件・原因側、後半は結果側として読むとわかりやすい。
  - >
    The more you read, the more you learn. のように、
    more が2回出る形はよく使われる。
  - >
    less, faster, harder, earlier, longer, better など、
    さまざまな比較級をこの構文で使える。

