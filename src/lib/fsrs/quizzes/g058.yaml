  - id: g058_q009
    question_type: two_choice
    prompt: The more difficult the test is, the ___ carefully you should read.
    choices:
      - text: more
        correct: true
      - text: most
        correct: false
    answer: more
    explanation: >
      carefully は長い副詞なので、比較級は more carefully。
      the more carefully you should read で「より注意深く読むべきだ」。
    translation: 試験が難しければ難しいほど、より注意深く読むべきだ。
