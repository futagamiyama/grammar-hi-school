  - id: g058_q005
    question_type: two_choice
    prompt: The faster you run, the ___ you will arrive.
    choices:
      - text: sooner
        correct: true
      - text: soonest
        correct: false
    answer: sooner
    explanation: >
      the 比較級, the 比較級 の構文なので、比較級 sooner を使う。
      「速く走れば走るほど、早く着く」。
    translation: 速く走れば走るほど、早く到着する。
    focus:
      - comparative
      - sooner
      - adverb_comparison

  - id: g058_q006
    question_type: two_choice
    prompt: The ___ you work, the more successful you will be.
    choices:
      - text: harder
        correct: true
      - text: hardest
        correct: false
    answer: harder
    explanation: >
      「一生懸命働けば働くほど」という意味。
      the 比較級, the 比較級 なので harder を使う。
    translation: 一生懸命働けば働くほど、ますます成功するだろう。
    focus:
      - comparative
      - harder
      - work_hard

  - id: g058_q007
    question_type: two_choice
    prompt: The less you sleep, the ___ tired you feel.
    choices:
      - text: more
        correct: true
      - text: most
        correct: false
    answer: more
    explanation: >
      the less..., the more... で「少なければ少ないほど、ますます〜」。
      後半も比較級 more を使う。
    translation: 睡眠が少なければ少ないほど、ますます疲れを感じる。
    focus:
      - the_less_the_more
      - comparative
      - negative_relation

  - id: g058_q008
    question_type: two_choice
    prompt: The earlier you start, the ___ you will finish.
    choices:
      - text: earlier
        correct: true
      - text: earliest
        correct: false
    answer: earlier
    explanation: >
      the 比較級, the 比較級 の後半なので earlier を使う。
      「早く始めれば始めるほど、早く終わる」。
    translation: 早く始めれば始めるほど、早く終わるだろう。
    focus:
      - comparative
