    max_threshold_ratio: 0.85

review_questions:
  - id: g062_q001
    question_type: two_choice
    prompt: I know a boy ___ lives in Osaka.
    choices:
      - text: that
        correct: true
      - text: what
        correct: false
    answer: that
    explanation: >
      a boy を後ろから説明する関係代名詞。
      that は人にも使えるので that lives in Osaka が自然。
    translation: 私は大阪に住んでいる少年を知っている。
    focus:
      - that_basic
      - person_antecedent
      - subject_relative

  - id: g062_q002
    question_type: two_choice
    prompt: I have a book ___ explains grammar clearly.
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      a book は物。
      物を説明する関係代名詞として that を使える。
      who は人に使う。
    translation: 私は文法をわかりやすく説明している本を持っている。
    focus:
      - that_basic
      - thing_antecedent
      - subject_relative

  - id: g062_q003
    question_type: two_choice
    prompt: This is the best movie ___ I have ever seen.
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      先行詞に最上級 the best がついている。
      このような場合、関係代名詞 that がよく使われる。
    translation: これは私が今まで見た中で最高の映画です。
    focus:
      - that_preferred
      - superlative
      - the_best

  - id: g062_q004
    question_type: two_choice
    prompt: This is the only thing ___ I need.
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      the only thing の後では that が自然。
      thing は人ではないので who は使わない。
    translation: これが私に必要な唯一のものです。
    focus:
      - that_preferred
      - the_only
      - thing

  - id: g062_q005
    question_type: two_choice
    prompt: Everything ___ he said was true.
    choices:
      - text: that
        correct: true
      - text: which
        correct: false
    answer: that
    explanation: >
      everything の後では that がよく使われる。
      Everything that he said で「彼が言ったことすべて」。
    translation: 彼が言ったことはすべて本当だった。
    focus:
      - that_preferred
      - everything
      - object_relative

  - id: g062_q006
    question_type: two_choice
    prompt: Is there anything ___ I can do for you?
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      anything の後では that がよく使われる。
      anything は人ではないので who は使わない。
    translation: 私にあなたのためにできることは何かありますか。
    focus:
      - that_preferred
      - anything
      - object_relative

  - id: g062_q007
    question_type: two_choice
    prompt: He is the first person ___ arrived.
    choices:
      - text: that
        correct: true
      - text: which
        correct: false
    answer: that
    explanation: >
      the first person の後では that がよく使われる。
      person は人なので which は使わない。
    translation: 彼は最初に到着した人です。
    focus:
      - that_preferred
      - the_first
      - person

  - id: g062_q008
    question_type: two_choice
    prompt: This is the last train ___ stops at this station.
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      the last train の後では that がよく使われる。
      train は物なので who は使わない。
    translation: これはこの駅に停車する最後の電車です。
    focus:
      - that_preferred
      - the_last
      - train

  - id: g062_q009
    question_type: two_choice
    prompt: My father, ___ lives in Tokyo, is a doctor.
    choices:
      - text: who
        correct: true
      - text: that
        correct: false
    answer: who
    explanation: >
      コンマつきで補足説明をしている非制限用法。
      この場合、that は普通使わず who を使う。
    translation: 東京に住んでいる私の父は医者です。
    focus:
      - that_not_used
      - non_restrictive
      - who

  - id: g062_q010
    question_type: two_choice
    prompt: This book, ___ I bought yesterday, is interesting.
    choices:
      - text: which
        correct: true
      - text: that
        correct: false
    answer: which
    explanation: >
      コンマつきの補足説明では that は普通使わない。
      物を補足説明するので which が自然。
    translation: 昨日買ったこの本は面白い。
    focus:
      - that_not_used
      - non_restrictive
      - which

  - id: g062_q011
    question_type: two_choice
    prompt: All the books ___ I borrowed were interesting.
    choices:
      - text: that
        correct: true
      - text: who
        correct: false
    answer: that
    explanation: >
      all the books の後では that がよく使われる。
      books は物なので who は使わない。
    translation: 私が借りた本はすべて面白かった。
    focus:
      - that_preferred
      - all
      - books

  - id: g062_q012
    question_type: two_choice
    prompt: The only student ___ answered the question was Ken.
    choices:
      - text: that
        correct: true
      - text: which
        correct: false
    answer: that
    explanation: >
      the only student の後では that がよく使われる。
      student は人なので which は使わない。
    translation: その質問に答えた唯一の生徒はケンだった。
    focus:
      - that_preferred
      - the_only
      - student

common_mistakes:
  - mistake: that は物にしか使えないと思う
    correction: >
      関係代名詞 that は人にも物にも使える。
      a boy that lives in Osaka / a book that explains grammar のように使う。
  - mistake: どんな場合でも that を使えると思う
    correction: >
      コンマつきの補足説明では that は普通使わない。
      My father, who lives in Tokyo, ... / This book, which I bought yesterday, ... とする。
  - mistake: 最上級の後で which を選んでしまう
    correction: >
      the best, the first, the last, the only などの後では that がよく使われる。
  - mistake: everything / anything の後で which を選んでしまう
    correction: >
      everything, anything, nothing などの後では that がよく使われる。
  - mistake: that を疑問詞の what と混同する
    correction: >
      関係代名詞 that は前の名詞を説明する。
      what は「〜すること・もの」という先行詞を含む関係代名詞として別に学ぶ。

learning_notes:
  - >
    that は、人にも物にも使える便利な関係代名詞。
    ただし、who / which の基本を先に理解しておくと混乱しにくい。
  - >
    all, everything, anything, nothing, the only, the first, the last,
    最上級を含む語の後では that がよく使われる。
  - >
    コンマつきの補足説明では that は普通使わない。
    この制限は入試で問われやすい。
  - >
    that は便利だが万能ではない。
    先行詞の種類、文の形、コンマの有無を見る。

