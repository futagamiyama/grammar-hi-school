id: g062
file: g062.yaml

title: 関係代名詞 that
type: construction

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: that を関係代名詞として使えるか？

core_concept:
  that_basic:
    form: 先行詞 + that + 動詞 ...
    meaning: who / which の代わりに使い、前の名詞を後ろから説明する
    image: 人にも物にも使える関係代名詞
    examples:
      - sentence: I know a boy that lives in Osaka.
        ja: 私は大阪に住んでいる少年を知っている。
        point: a boy は人だが、who の代わりに that も使える。
      - sentence: I have a book that explains grammar clearly.
        ja: 私は文法をわかりやすく説明している本を持っている。
        point: a book は物で、which の代わりに that も使える。
      - sentence: This is the house that Jack built.
        ja: これがジャックが建てた家です。
        point: the house を that Jack built が説明している。

  that_preferred:
    form: all / anything / the only / 最上級 + 名詞 + that ...
    meaning: 特定の先行詞の後で that がよく使われる
    image: 範囲を強く限定する語の後では that が自然
    examples:
      - sentence: This is the best movie that I have ever seen.
        ja: これは私が今まで見た中で最高の映画です。
        point: 最上級 the best の後なので that が自然。
      - sentence: This is the only thing that I need.
        ja: これが私に必要な唯一のものです。
        point: the only の後なので that が自然。
      - sentence: Everything that he said was true.
        ja: 彼が言ったことはすべて本当だった。
        point: everything の後では that がよく使われる。

  that_not_used:
    form: comma + who/which
    meaning: コンマの後の非制限用法では that は普通使わない
    image: 補足説明では that ではなく who / which を使う
    examples:
      - sentence: My father, who lives in Tokyo, is a doctor.
        ja: 東京に住んでいる私の父は医者です。
        point: コンマつきの補足説明では who を使う。
      - sentence: This book, which I bought yesterday, is interesting.
        ja: 昨日買ったこの本は面白い。
        point: コンマつきの補足説明では which を使う。
      - sentence: The museum, which opened last year, is popular.
        ja: 昨年開館したその博物館は人気がある。
        point: 非制限用法なので that は使わない。

main_rule: >
  関係代名詞 that は、人にも物にも使える。
  a boy that lives in Osaka は a boy who lives in Osaka と近い意味。
  a book that explains grammar は a book which explains grammar と近い意味。
  また、all, everything, anything, nothing, the only, the first, the last,
  最上級を含む名詞の後では that がよく使われる。
  ただし、コンマの後で補足説明をする非制限用法では that は普通使わず、
  who や which を使う。

contrast_pairs:
  - who_or_that: I know a boy who lives in Osaka. / I know a boy that lives in Osaka.
    which_or_that: I have a book which explains grammar. / I have a book that explains grammar.
    point: >
      that は人にも物にも使える。
      ただし、who / which の基本を理解した上で使う。

  - that_preferred: This is the best movie that I have ever seen.
    less_natural: This is the best movie which I have ever seen.
    point: >
      最上級 the best の後では that が自然。
      入試では that を選ばせることが多い。

  - non_restrictive: This book, which I bought yesterday, is interesting.
    incorrect_that: This book, that I bought yesterday, is interesting.
    point: >
      コンマつきの補足説明では that は普通使わない。
      which を使う。

