id: g118
file: g118.yaml

title: 移動・方向を表す前置詞 to / into / onto / from / out of
type: grammar_contrast

section:
  id: s12
  title: 前置詞

level: basic
target: 高校英文法基礎

core_question: 位置を表す in / on / at と、移動・方向を表す to / into / onto / from / out of を区別できるか？

core_concept:
  to_destination:
    form: go/come/move/travel + to + 場所
    meaning: 〜へ、〜に向かって
    image: 目的地へ向かう矢印
    examples:
      - sentence: I went to the station.
        ja: 私は駅へ行った。
        point: 駅が移動の目的地なので to。
      - sentence: She came to my house.
        ja: 彼女は私の家へ来た。
        point: my house へ向かう移動を表す。
      - sentence: He moved to Tokyo last year.
        ja: 彼は去年東京へ引っ越した。
        point: Tokyo が移動後の目的地。

  into_inside_movement:
    form: go/come/put/jump + into + 内部
    meaning: 〜の中へ
    image: 外から中へ入る動き
    examples:
      - sentence: She went into the room.
        ja: 彼女は部屋の中へ入った。
        point: 外から部屋の中へ入る動きなので into。
      - sentence: He jumped into the pool.
        ja: 彼はプールに飛び込んだ。
        point: プールの中へ入る動き。
      - sentence: Put the keys into the bag.
        ja: 鍵をバッグの中に入れなさい。
        point: バッグの中へ移す動き。

  onto_surface_movement:
    form: climb/jump/put + onto + 表面
    meaning: 〜の上へ
    image: 表面に乗る動き
    examples:
      - sentence: The cat jumped onto the table.
        ja: その猫はテーブルの上へ飛び乗った。
        point: テーブルの表面へ移動して乗るので onto。
      - sentence: He climbed onto the roof.
        ja: 彼は屋根の上へ登った。
        point: 屋根の表面へ到達する動き。
      - sentence: Put the box onto the shelf.
        ja: 箱を棚の上に置きなさい。
        point: 棚の表面へ移す動き。

  from_starting_point:
    form: come/go/move + from + 場所
    meaning: 〜から
    image: 出発点から離れる矢印
    examples:
      - sentence: He came from Canada.
        ja: 彼はカナダから来た。
        point: Canada が出発点なので from。
      - sentence: The train leaves from platform 3.
        ja: その電車は3番線から出発します。
        point: platform 3 が出発点。
      - sentence: I received a letter from my friend.
        ja: 私は友人から手紙を受け取った。
        point: 手紙の出どころを from が表す。

  out_of_inside_to_outside:
    form: go/come/take/get + out of + 内部
    meaning: 〜の中から外へ
    image: 中から外へ出る動き
    examples:
      - sentence: He came out of the room.
        ja: 彼は部屋から出てきた。
        point: 部屋の中から外へ出る動き。
      - sentence: She took the keys out of the bag.
        ja: 彼女はバッグから鍵を取り出した。
        point: バッグの中から外へ出す動き。
      - sentence: The dog ran out of the house.
        ja: その犬は家から走って出た。
        point: 家の中から外へ出る動き。

  position_vs_movement:
    form: in/on/at + 場所 / into/onto/to + 場所
    meaning: 〜にある / 〜へ動く
    image: 位置か、移動かで前置詞が変わる
    examples:
      - sentence: She is in the room.
        ja: 彼女は部屋の中にいる。
        point: 位置を表すので in。
      - sentence: She went into the room.
        ja: 彼女は部屋の中へ入った。
        point: 移動を表すので into。
      - sentence: The book is on the desk.
        ja: その本は机の上にある。
        point: 位置は on。机の上へ移す動きなら onto。

main_rule: >
  at / on / in は主に位置を表すが、to / into / onto / from / out of は移動や方向を表す。
  to は目的地へ向かう移動。
  I went to the station. は「駅へ行った」。
  into は外から中へ入る動き。
  She went into the room. は「部屋の中へ入った」。
  onto は表面の上へ乗る動き。
  The cat jumped onto the table. は「テーブルの上へ飛び乗った」。
  from は出発点・出どころ。
  He came from Canada. は「カナダから来た」。
  out of は中から外へ出る動き。
  He came out of the room. は「部屋から出てきた」。
  位置なら in the room / on the table、移動なら into the room / onto the table と考える。

contrast_pairs:
  - position: She is in the room.
    movement: She went into the room.
    point: >
      in は部屋の中にいる位置。
      into は外から部屋の中へ入る移動。

  - position: The cat is on the table.
    movement: The cat jumped onto the table.
    point: >
      on は表面にある位置。
      onto は表面へ乗る移動。

  - destination: He moved to Tokyo.
    starting_point: He came from Canada.
    point: >
      to は目的地。
      from は出発点・出どころ。

  - inside: The keys are in the bag.
    outside_movement: She took the keys out of the bag.
    point: >
      in は中にある位置。
      out of は中から外へ出す動き。

