common_mistakes:
  - mistake: go at the station としてしまう
    correction: >
      go は目的地へ向かう移動を表すので to を使う。
      go to the station が正しい。
  - mistake: into と in を同じだと思う
    correction: >
      in は中にある位置。
      into は外から中へ入る移動。
  - mistake: onto と on を同じだと思う
    correction: >
      on は表面にある位置。
      onto は表面へ乗る移動。
  - mistake: came to Canada と came from Canada を混同する
    correction: >
      to は目的地。
      from は出発点・出どころ。
  - mistake: out of を単なる from と同じに考える
    correction: >
      out of は「中から外へ」という内部からの移動を強く表す。
  - mistake: 日本語の「に」だけで in / into / to を選ぶ
    correction: >
      英語では位置か移動か、目的地か内部への移動かを見る。
      in the room / into the room / to the room を区別する。

learning_notes:
  - >
    to は目的地へ向かう移動。
    go to school / move to Tokyo の形。
  - >
    into は外から中へ入る動き。
    go into the room / jump into the pool。
  - >
    onto は表面の上へ乗る動き。
    jump onto the table / climb onto the roof。
  - >
    from は出発点・出どころ。
    come from Canada / receive a letter from a friend。
  - >
    out of は中から外へ出る動き。
    come out of the room / take keys out of the bag。
  - >
    位置なら in / on / at、移動なら into / onto / to をまず疑う。

