id: g083
file: g083.yaml

title: would rather + 仮定法
type: grammar_contrast

section:
  id: s09
  title: 仮定法

level: basic
target: 高校英文法基礎

core_question: would rather の後ろで、同一主語なら原形、別主語なら仮定法を使えるか？

core_concept:
  would_rather_do:
    form: 主語 + would rather + 動詞原形
    meaning: むしろ〜したい、〜する方がよい
    image: 主語自身がしたいことを言う
    examples:
      - sentence: I would rather stay home.
        ja: 私はむしろ家にいたい。
        point: I が stay するので、would rather の後ろは動詞原形。
      - sentence: She would rather walk than take a taxi.
        ja: 彼女はタクシーに乗るより歩きたい。
        point: would rather A than B で「BよりAしたい」。
      - sentence: I would rather not go there.
        ja: 私はそこへ行きたくない。
        point: 否定は would rather not + 動詞原形。

  would_rather_subject_past:
    form: 主語 + would rather + 別の主語 + 過去形
    meaning: むしろ〜してほしい、〜してくれた方がよい
    image: 相手にしてほしいことを、遠回しに仮定法で言う
    examples:
      - sentence: I would rather you stayed here.
        ja: 私はあなたにここにいてほしい。
        point: you が stayed するので、仮定法過去を使う。
      - sentence: I would rather he came tomorrow.
        ja: 私は彼に明日来てほしい。
        point: tomorrow の話でも、would rather + 主語 + 過去形。
      - sentence: I would rather you did not tell anyone.
        ja: 私はあなたに誰にも言わないでほしい。
        point: 否定は did not + 動詞原形。

  would_rather_subject_past_perfect:
    form: 主語 + would rather + 別の主語 + had + 過去分詞
    meaning: むしろ〜してほしかった、〜しないでほしかった
    image: 過去に起きたことへの不満・後悔
    examples:
      - sentence: I would rather you had told me the truth.
        ja: 私はあなたに本当のことを言ってほしかった。
        point: 実際には過去に言ってくれなかった。
      - sentence: I would rather he had not said that.
        ja: 私は彼にあんなことを言ってほしくなかった。
        point: 実際には過去に言ってしまった。
      - sentence: She would rather we had left earlier.
        ja: 彼女は私たちにもっと早く出発してほしかった。
        point: 実際には早く出発しなかった。

main_rule: >
  would rather は「むしろ〜したい」「〜する方がよい」という意味を表す。
  主語自身が何かをするなら、would rather + 動詞原形を使う。
  I would rather stay home. は「私はむしろ家にいたい」。
  しかし、別の人に何かをしてほしい場合は、
  would rather + 主語 + 過去形を使う。
  I would rather you stayed here. は「あなたにここにいてほしい」。
  この stayed は過去の意味ではなく、現在・未来への希望を表す仮定法過去。
  過去にしてほしかったことを言うなら、
  would rather + 主語 + had + 過去分詞を使う。
  I would rather you had told me the truth. は
  「あなたに本当のことを言ってほしかった」という過去への不満・後悔を表す。

contrast_pairs:
  - same_subject: I would rather stay home.
    different_subject: I would rather you stayed home.
    point: >
      I would rather stay は、I 自身が stay したい。
      I would rather you stayed は、you に stay してほしい。

  - present_or_future: I would rather he came tomorrow.
    past_regret: I would rather he had come yesterday.
    point: >
      came tomorrow は未来への希望だが、仮定法過去を使う。
      had come yesterday は過去に来てほしかったという後悔。

  - negative_present: I would rather you did not tell anyone.
    negative_past: I would rather you had not told anyone.
    point: >
      did not tell はこれから言わないでほしい。
      had not told は過去に言わないでほしかった。

