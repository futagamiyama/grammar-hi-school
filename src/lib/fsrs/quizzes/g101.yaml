id: g101
file: g101.yaml

title: 同格の that
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: the fact that ... の that が、前の名詞の内容を説明する同格の that だと読めるか？

core_concept:
  appositive_that:
    form: 抽象名詞 + that + 完全文
    meaning: 〜という事実・考え・知らせ・可能性
    image: that以下が、前の抽象名詞の中身を説明する
    examples:
      - sentence: The fact that he lied shocked us.
        ja: 彼がうそをついたという事実は私たちに衝撃を与えた。
        point: that he lied が the fact の中身を説明している。
      - sentence: The news that she had won surprised everyone.
        ja: 彼女が勝ったという知らせは皆を驚かせた。
        point: that she had won が the news の内容。
      - sentence: There is a possibility that he will come.
        ja: 彼が来る可能性がある。
        point: that he will come が possibility の内容。

  abstract_nouns:
    form: fact / idea / news / belief / possibility / claim / rumor / hope + that
    meaning: 〜という事実・考え・知らせ・信念・可能性・主張・うわさ・希望
    image: 抽象名詞は中身を that節で説明できる
    examples:
      - sentence: I like the idea that everyone can learn.
        ja: 誰でも学べるという考えが私は好きだ。
        point: the idea の中身が that everyone can learn。
      - sentence: The belief that money solves everything is dangerous.
        ja: お金がすべてを解決するという信念は危険だ。
        point: belief の内容を that節が説明している。
      - sentence: The claim that the product is safe is questionable.
        ja: その製品は安全だという主張は疑わしい。
        point: claim の内容を that節が説明している。

  relative_that:
    form: 名詞 + that + 不完全な文
    meaning: 〜する名詞、〜を...した名詞
    image: that が後ろの文の主語・目的語の役割をする
    examples:
      - sentence: The book that I bought yesterday was expensive.
        ja: 私が昨日買った本は高かった。
        point: that は bought の目的語。関係代名詞。
      - sentence: The man that lives next door is a doctor.
        ja: 隣に住んでいる男性は医者だ。
        point: that は lives の主語。関係代名詞。
      - sentence: The idea that he proposed was interesting.
        ja: 彼が提案した考えは面白かった。
        point: that は proposed の目的語。関係代名詞で、同格ではない。

  appositive_vs_relative:
    form: 名詞 + that + 完全文 / 名詞 + that + 不完全文
    meaning: 〜という名詞 / 〜する名詞
    image: that以下が完全なら同格、不完全なら関係代名詞を疑う
    examples:
      - sentence: The idea that he is honest is wrong.
        ja: 彼が正直だという考えは間違っている。
        point: he is honest は完全文なので、that は同格。
      - sentence: The idea that he proposed was wrong.
        ja: 彼が提案した考えは間違っていた。
        point: he proposed は目的語が欠けているので、that は関係代名詞。
      - sentence: The rumor that she quit her job was false.
        ja: 彼女が仕事を辞めたといううわさは誤りだった。
        point: she quit her job は完全文なので、that は同格。

main_rule: >
  同格の that は、前にある抽象名詞の内容を説明する that。
  The fact that he lied shocked us. では、
  that he lied が the fact の中身を説明し、
  「彼がうそをついたという事実」という意味になる。
  同格の that の後ろには、主語と動詞がそろった完全文が来る。
  よく使われる名詞は fact, idea, news, belief, possibility, claim, rumor, hope など。
  一方、関係代名詞の that は、後ろの文の主語や目的語の役割をする。
  The book that I bought yesterday では、that は bought の目的語。
  同格か関係代名詞かを見分けるには、that 以下が完全文かどうかを見る。
  完全文なら同格、不完全なら関係代名詞の可能性が高い。

contrast_pairs:
  - appositive: The idea that he is honest is wrong.
    relative: The idea that he proposed was wrong.
    point: >
      he is honest は完全文なので、that は同格。
      he proposed は目的語が欠けているので、that は関係代名詞。

  - appositive: The news that she had won surprised everyone.
    relative: The news that I heard surprised everyone.
    point: >
      she had won は完全文なので、勝ったという知らせ。
      I heard は目的語が欠けているので、私が聞いた知らせ。

  - appositive: The fact that he lied shocked us.
    relative_like: The fact that we discovered shocked us.
    point: >
      he lied は完全文なので、うそをついたという事実。
      we discovered は目的語が欠けており、私たちが発見した事実。

