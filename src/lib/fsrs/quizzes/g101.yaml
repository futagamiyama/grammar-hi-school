common_mistakes:
  - mistake: 名詞 + that をすべて関係代名詞だと思う
    correction: >
      the fact that he lied のように、
      that以下が完全文で名詞の内容を説明していれば同格の that。
  - mistake: 同格の that を what にしてしまう
    correction: >
      the fact what he lied とは言わない。
      the fact that he lied が正しい。
  - mistake: that以下が完全文かどうかを見ない
    correction: >
      同格の that は後ろが完全文。
      関係代名詞の that は後ろに主語・目的語などの欠けがある。
  - mistake: The idea that he is honest と The idea that he proposed を同じ構文だと思う
    correction: >
      he is honest は完全文なので同格。
      he proposed は目的語が欠けているので関係代名詞。
  - mistake: the news that she had won を「彼女が勝った知らせ」ではなく「彼女を勝った知らせ」と読む
    correction: >
      同格の that は前の名詞の中身を説明する。
      「彼女が勝ったという知らせ」と読む。

learning_notes:
  - >
    同格の that は、前の抽象名詞の内容を説明する。
    the fact that ... / the idea that ... / the news that ... の形。
  - >
    同格の that の後ろには完全文が来る。
    主語と動詞がそろっているかを見る。
  - >
    関係代名詞の that は、後ろの文の主語や目的語の役割をする。
    そのため、後ろに欠けがある。
  - >
    fact, idea, news, belief, possibility, claim, rumor, hope などは、
    同格の that を取りやすい。
  - >
    名詞 + that を見たら、that以下が「名詞の内容」なのか、
    「その名詞を修飾する関係節」なのかを判定する。

