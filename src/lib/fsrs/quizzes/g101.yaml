        correct: false
    answer: that
    explanation: >
      The fact that he lied で「彼がうそをついたという事実」。
      that he lied が fact の中身を説明している。
    translation: 彼がうそをついたという事実は私たちに衝撃を与えた。
    focus:
      - appositive_that
      - fact_that
      - complete_clause

