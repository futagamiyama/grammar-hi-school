      - text: hardly
        correct: true
    answer: hardly
    explanation: >
      霧のせいで山がほとんど見えなかったという意味。
      could hardly see が自然。
    translation: 霧のせいで、私たちはその山をほとんど見ることができなかった。
    focus:
      - hardly
      - could_hardly
      - visibility

  - id: g054_q012
    question_type: two_choice
    prompt: They fought ___ to protect their town.
    choices:
      - text: hard
        correct: true
      - text: hardly
        correct: false
    answer: hard
    explanation: >
      「町を守るために必死に戦った」という意味。
      fought hard が自然。
    translation: 彼らは町を守るために必死に戦った。
    focus:
      - hard
      - adverb
      - effort

common_mistakes:
  - mistake: hard の副詞形は always hardly だと思う
    correction: >
      hard はそのまま副詞としても使える。
      work hard, study hard, rain hard のように使う。
      hardly は「ほとんど〜ない」という別の意味。
  - mistake: He works hardly. を「一生懸命働く」と読む
    correction: >
      He works hard. が「一生懸命働く」。
      He hardly works. は「彼はほとんど働かない」。
  - mistake: hardly を強調語として読む
    correction: >
      hardly は very のような強調語ではない。
      「ほとんど〜ない」という否定に近い意味。
  - mistake: can hardly を「一生懸命できる」と読む
    correction: >
      can hardly do は「ほとんど〜できない」。
      I can hardly hear you. は「ほとんど聞こえない」。
  - mistake: hard と difficult の関係だけで考える
    correction: >
      hard は「難しい・硬い」だけでなく、副詞で「一生懸命に・激しく」も表す。
      hardly はまったく別に「ほとんど〜ない」。

learning_notes:
  - >
    hard は形容詞にも副詞にもなる。
    a hard question, work hard のように使う。
  - >
    hardly は「ほとんど〜ない」という準否定語。
    not がなくても否定に近い意味になる。
  - >
    work hard と hardly work は意味が正反対に近い。
    語順と意味をセットで覚える。
  - >
    hardly ever は「めったに〜しない」。
    She hardly ever watches TV. のように使う。

