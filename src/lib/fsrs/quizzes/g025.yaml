id: g025
file: g025.yaml

title: may vs might
type: grammar_contrast

section:
  id: s03
  title: 助動詞・法

level: basic
target: 高校英文法基礎

core_question: 可能性が比較的あるのか、より低い・控えめ・距離を置いた可能性なのか？

core_concept:
  may:
    form: may + 動詞の原形
    meaning: あり得る・〜かもしれない。比較的中立的な可能性を表す。
    image: 可能性があると普通に述べる
    examples:
      - sentence: It may rain this afternoon.
        ja: 今日の午後、雨が降るかもしれない。
        point: 雨の可能性を中立的に述べている。
      - sentence: She may know the answer.
        ja: 彼女は答えを知っているかもしれない。
        point: あり得る可能性として述べている。
      - sentence: You may leave now.
        ja: もう帰ってもよい。
        point: 許可を表す may。g025では中心ではないが、重要な用法。

  might:
    form: might + 動詞の原形
    meaning: ひょっとすると〜かもしれない。may より可能性が低い、または控えめ・遠回しに述べる。
    image: 可能性はあるが、距離を置いている / 自信が弱い / 控えめ
    examples:
      - sentence: It might rain later, but I am not sure.
        ja: 後で雨が降るかもしれないが、確かではない。
        point: 可能性はあるが、話し手の確信が弱い。
      - sentence: She might be at home.
        ja: 彼女は家にいるかもしれない。
        point: ひょっとすると、という控えめな可能性。
      - sentence: I thought he might come.
        ja: 彼が来るかもしれないと思った。
        point: 過去の文脈で、may が might になることがある。

main_rule: >
  may は「〜かもしれない」と可能性を比較的中立的に述べる。
  might は may よりも可能性が低く感じられることが多く、
  また話し手が控えめに言う・距離を置くときにも使われる。
  日本語ではどちらも「〜かもしれない」と訳せるため、
  確信の強さ、控えめさ、文脈上の距離で判断する。

contrast_pairs:
  - may: It may rain this afternoon.
    might: It might rain this afternoon.
    point: >
      may は普通に可能性があると言う感じ。
      might は少し可能性が低い、または控えめに言う感じ。

  - may: She may know the answer.
    might: She might know the answer.
    point: >
      may は「知っている可能性がある」。might は「ひょっとすると知っているかもしれない」。

  - may: You may use my phone.
    might: You might use my phone.
    point: >
      You may use my phone. は許可を表す。
      You might use my phone. は普通、許可としては不自然で、可能性や提案のように聞こえる。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

