    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g089_q001
    question_type: two_choice
    prompt: ___ young, my father lived in Osaka.
    choices:
      - text: When
        correct: true
      - text: During
        correct: false
    answer: When
    explanation: >
      When young は When he was young の省略。
      接続詞 When の後ろで he was が省略されている。
    translation: 若いころ、父は大阪に住んでいた。
    focus:
      - when_while_ellipsis
      - when_young
      - subject_be_omission

  - id: g089_q002
    question_type: two_choice
    prompt: When ___, my father lived in Osaka.
    choices:
      - text: young
        correct: true
      - text: was young
        correct: false
    answer: young
    explanation: >
      When young は省略形として自然。
      When was young では主語がなく、不完全な文になる。
    translation: 若いころ、父は大阪に住んでいた。
    focus:
      - when_while_ellipsis
      - reduced_clause
      - young

  - id: g089_q003
    question_type: two_choice
    prompt: ___ in London, she visited many museums.
    choices:
      - text: While
        correct: true
      - text: During
        correct: false
    answer: While
    explanation: >
      While in London は While she was in London の省略。
      during は前置詞なので、during in London とはしない。
    translation: ロンドンにいる間、彼女は多くの博物館を訪れた。
    focus:
      - when_while_ellipsis
      - while_in_london
      - prepositional_phrase

  - id: g089_q004
    question_type: two_choice
    prompt: While ___ London, she visited many museums.
    choices:
      - text: in
        correct: true
      - text: was in
        correct: false
    answer: in
    explanation: >
      While in London は While she was in London の省略。
      While was in London では主語がなく不自然。
    translation: ロンドンにいる間、彼女は多くの博物館を訪れた。
    focus:
      - when_while_ellipsis
      - while_in
      - be_omission

  - id: g089_q005
    question_type: two_choice
    prompt: ___ asked about the plan, he said nothing.
    choices:
      - text: When
        correct: true
      - text: During
        correct: false
    answer: When
    explanation: >
      When asked about the plan は When he was asked about the plan の省略。
      asked は過去分詞で「尋ねられた」という意味。
    translation: その計画について尋ねられた時、彼は何も言わなかった。
    focus:
      - when_while_ellipsis
      - past_participle
      - when_asked

  - id: g089_q006
    question_type: two_choice
    prompt: When ___ about the plan, he said nothing.
    choices:
      - text: asked
        correct: true
      - text: asking
        correct: false
    answer: asked
    explanation: >
      彼は尋ねられた側なので、過去分詞 asked を使う。
      When asked = When he was asked。
    translation: その計画について尋ねられた時、彼は何も言わなかった。
    focus:
      - when_while_ellipsis
      - passive_meaning
      - asked

  - id: g089_q007
    question_type: two_choice
    prompt: ___ necessary, call me.
    choices:
      - text: If
        correct: true
      - text: When
        correct: false
    answer: If
    explanation: >
      If necessary は If it is necessary の省略。
      「必要なら」という条件を表す。
    translation: 必要なら、私に電話してください。
    focus:
      - if_unless_ellipsis
      - if_necessary
      - condition

  - id: g089_q008
    question_type: two_choice
    prompt: If ___, call me.
    choices:
      - text: necessary
        correct: true
      - text: necessity
        correct: false
    answer: necessary
    explanation: >
      If necessary は If it is necessary の省略。
      necessary は形容詞で、it is の後ろに置ける。
    translation: 必要なら、私に電話してください。
    focus:
      - if_unless_ellipsis
      - adjective
      - necessary

  - id: g089_q009
    question_type: two_choice
    prompt: ___ possible, please send the file today.
    choices:
      - text: If
        correct: true
      - text: Because
        correct: false
    answer: If
    explanation: >
      If possible は If it is possible の省略。
      「可能なら」という意味。
    translation: 可能なら、今日そのファイルを送ってください。
    focus:
      - if_unless_ellipsis
      - if_possible
      - condition

  - id: g089_q010
    question_type: two_choice
    prompt: Unless ___, do not use this button.
    choices:
      - text: necessary
        correct: true
      - text: necessity
        correct: false
    answer: necessary
    explanation: >
      Unless necessary は Unless it is necessary の省略。
      「必要でない限り」という意味。
    translation: 必要でない限り、このボタンを使わないでください。
    focus:
      - if_unless_ellipsis
      - unless_necessary
      - negative_condition

  - id: g089_q011
    question_type: two_choice
    prompt: ___ tired, she kept working.
    choices:
      - text: Though
        correct: true
      - text: Because
        correct: false
    answer: Though
    explanation: >
      Though tired は Though she was tired の省略。
      「疲れていたが」という譲歩を表す。
    translation: 疲れていたが、彼女は働き続けた。
    focus:
      - though_although_ellipsis
      - though_tired
      - concession

  - id: g089_q012
    question_type: two_choice
    prompt: Although ___, the room was comfortable.
    choices:
      - text: small
        correct: true
      - text: was small
        correct: false
    answer: small
    explanation: >
      Although small は Although it was small の省略。
      Although was small では主語がなく不完全。
    translation: 小さいが、その部屋は快適だった。
    focus:
      - though_although_ellipsis
      - although_small
      - subject_be_omission

common_mistakes:
  - mistake: When young を不完全な文だと思う
    correction: >
      When young は When he was young などの省略。
      接続詞の後ろで 主語 + be が省略されている。
  - mistake: While in London を前置詞句だけの誤文だと思う
    correction: >
      While in London は While she was in London の省略。
      while は接続詞で、省略された主語 + be を補って読む。
  - mistake: If necessary を「もし必要性なら」と読む
    correction: >
      If necessary は If it is necessary の省略で、
      「必要なら」という意味。
  - mistake: Though tired を「疲れたので」と読む
    correction: >
      Though は譲歩を表す。
      Though tired は「疲れていたが」という意味。
  - mistake: 省略形で主語と意味上の主語をずらしてしまう
    correction: >
      When asked, he said nothing. なら、尋ねられたのは he。
      省略された主語が主節の主語と一致するか確認する。

learning_notes:
  - >
    接続詞の後ろでは 主語 + be が省略されることがある。
    When young = When he was young。
  - >
    if necessary / if possible は、入試英文や説明文で非常によく出る。
    If it is necessary / If it is possible と補って読む。
  - >
    過去分詞が続くと受動の意味になる。
    When asked = When he was asked。
  - >
    though / although + 形容詞 は「〜ではあるが」。
    Though tired = Though she was tired。
  - >
    省略を読めないと、短い句に見えて意味を取り違える。
    接続詞の後ろに 主語 + be を補う癖をつける。

