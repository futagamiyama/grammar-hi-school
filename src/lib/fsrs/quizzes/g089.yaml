id: g089
file: g089.yaml

title: 接続詞後の主語＋beの省略
type: construction

section:
  id: s10
  title: 強調・倒置・省略

level: basic
target: 高校英文法基礎

core_question: when / while / if / though などの後で、省略された主語＋beを補って読めるか？

core_concept:
  when_while_ellipsis:
    form: when/while + 形容詞・分詞・前置詞句
    meaning: 〜である時、〜している間
    image: 接続詞の後ろの 主語 + be が省略される
    examples:
      - sentence: When young, my father lived in Osaka.
        ja: 若いころ、父は大阪に住んでいた。
        point: When he was young の he was が省略されている。
      - sentence: While in London, she visited many museums.
        ja: ロンドンにいる間、彼女は多くの博物館を訪れた。
        point: While she was in London の she was が省略されている。
      - sentence: When asked about the plan, he said nothing.
        ja: その計画について尋ねられた時、彼は何も言わなかった。
        point: When he was asked の he was が省略されている。

  if_unless_ellipsis:
    form: if/unless + 形容詞・分詞・前置詞句
    meaning: もし〜なら、〜でない限り
    image: 条件の中の 主語 + be が省略される
    examples:
      - sentence: If necessary, call me.
        ja: 必要なら、私に電話してください。
        point: If it is necessary の it is が省略されている。
      - sentence: If possible, please send the file today.
        ja: 可能なら、今日そのファイルを送ってください。
        point: If it is possible の it is が省略されている。
      - sentence: Unless necessary, do not use this button.
        ja: 必要でない限り、このボタンを使わないでください。
        point: Unless it is necessary の it is が省略されている。

  though_although_ellipsis:
    form: though/although + 形容詞・分詞・前置詞句
    meaning: 〜ではあるが
    image: 譲歩の中の 主語 + be が省略される
    examples:
      - sentence: Though tired, she kept working.
        ja: 疲れていたが、彼女は働き続けた。
        point: Though she was tired の she was が省略されている。
      - sentence: Although small, the room was comfortable.
        ja: 小さいが、その部屋は快適だった。
        point: Although it was small の it was が省略されている。
      - sentence: Though injured, he finished the race.
        ja: けがをしていたが、彼はレースを完走した。
        point: Though he was injured の he was が省略されている。

main_rule: >
  when, while, if, unless, though, although などの接続詞の後ろでは、
  主語 + be が省略されることがある。
  When young, my father lived in Osaka. は
  When he was young, my father lived in Osaka. の省略。
  If necessary, call me. は
  If it is necessary, call me. の省略。
  Though tired, she kept working. は
  Though she was tired, she kept working. の省略。
  省略できるのは、主節の主語と同じもの、または it is necessary / it is possible のような形式的な主語が自然に補える場合。
  読む時は、接続詞の後ろに 主語 + be を補って意味を考える。

contrast_pairs:
  - full: When he was young, my father lived in Osaka.
    reduced: When young, my father lived in Osaka.
    point: >
      When young は When he was young の省略。
      「若い時」という意味。

  - full: If it is necessary, call me.
    reduced: If necessary, call me.
    point: >
      If necessary は If it is necessary の省略。
      案内文や指示文でよく使う。

  - full: Though she was tired, she kept working.
    reduced: Though tired, she kept working.
    point: >
      Though tired は Though she was tired の省略。
      「疲れていたが」という譲歩を表す。

