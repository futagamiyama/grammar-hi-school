common_mistakes:
  - mistake: no less than と not less than をどちらも「〜以上」とだけ覚える
    correction: >
      no less than は「なんと〜も」と多さを強調する。
      not less than は「少なくとも〜」「〜以上」と下限を示す。
  - mistake: no less than を客観的な下限として読む
    correction: >
      no less than は話し手の評価が入ることが多い。
      「そんなに多く」「なんとそれだけも」という響きがある。
  - mistake: not less than を「なんと〜も」と強く訳しすぎる
    correction: >
      not less than は基本的に「〜を下回らない」「少なくとも〜」。
      多さの強調は no less than の方が強い。
  - mistake: no more than と no less than を混同する
    correction: >
      no more than は「たった〜だけ」と少なさを強調する。
      no less than は「なんと〜も」と多さを強調する。
  - mistake: not more than と not less than を混同する
    correction: >
      not more than は「多くても〜」で上限。
      not less than は「少なくとも〜」で下限。

learning_notes:
  - >
    no less than は「なんと〜も」。
    話し手が多いと感じている。
  - >
    not less than は「少なくとも〜」。
    数量の下限を客観的に示す。
  - >
    no more than / not more than とセットで覚えるとよい。
    no は評価、not は範囲と考える。
  - >
    no less than fifty people came は「なんと50人も来た」。
    not less than fifty people must attend は「少なくとも50人が出席しなければならない」。

