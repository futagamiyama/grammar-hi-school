id: g060
file: g060.yaml

title: no less than / not less than
type: grammar_contrast

section:
  id: s07
  title: 形容詞・副詞・比較

level: basic
target: 高校英文法基礎

core_question: なんと〜もなのか、少なくとも〜なのか？

core_concept:
  no_less_than:
    form: no less than + 数量
    meaning: なんと〜も
    image: 数量が多いことを強調する
    examples:
      - sentence: He has no less than 1,000,000 yen.
        ja: 彼はなんと100万円も持っている。
        point: 100万円という多さを強調している。
      - sentence: No less than fifty people came to the meeting.
        ja: その会議にはなんと50人も来た。
        point: 50人も来たという多さ・驚きを表す。
      - sentence: The project cost no less than ten million yen.
        ja: その計画にはなんと1,000万円もかかった。
        point: 1,000万円という金額の大きさを強調している。

  not_less_than:
    form: not less than + 数量
    meaning: 少なくとも〜、〜以上
    image: 下限を示す
    examples:
      - sentence: He has not less than 1,000,000 yen.
        ja: 彼は少なくとも100万円持っている。
        point: 100万円を下回らないという下限を表す。
      - sentence: Not less than fifty people must attend.
        ja: 少なくとも50人が出席しなければならない。
        point: 50人以上という条件・下限を表す。
      - sentence: The work will take not less than two hours.
        ja: その仕事は少なくとも2時間はかかる。
        point: 2時間を下回らないという下限を表す。

main_rule: >
  no less than は「なんと〜も」という多さの強調。
  not less than は「少なくとも〜」「〜以上」という下限。
  no は感情的に「それほど多い」と強調する。
  not は単に「それを下回らない」と客観的に制限する。
  He has no less than 1,000,000 yen. は「なんと100万円も持っている」。
  He has not less than 1,000,000 yen. は「少なくとも100万円持っている」。
  形が似ているが、no less than は多さの評価、not less than は下限の指定と考える。

contrast_pairs:
  - emphasis_on_largeness: He has no less than 1,000,000 yen.
    lower_limit: He has not less than 1,000,000 yen.
    point: >
      no less than は「なんと100万円も」と多さを強調する。
      not less than は「100万円以上」と下限を表す。

  - emphasis_on_largeness: No less than fifty people came.
    lower_limit: Not less than fifty people must attend.
    point: >
      no less than fifty people came は「なんと50人も来た」。
      not less than fifty people must attend は「少なくとも50人が出席しなければならない」。

  - emphasis_on_largeness: It took no less than five hours.
    lower_limit: It will take not less than five hours.
    point: >
      no less than five hours は「なんと5時間も」という長さの強調。
      not less than five hours は「少なくとも5時間」という下限。

