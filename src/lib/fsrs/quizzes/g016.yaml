review_questions:
  - id: g016_q001
    question_type: two_choice
    prompt: I ___ this song.
    choices:
      - text: like
        correct: true
      - text: am liking
        correct: false
    answer: like
    explanation: >
      like は「好きである」という感情・好みの状態を表す動詞なので、
      現在進行形 am liking ではなく現在形 like が自然。
    translation: 私はこの歌が好きだ。
    focus:
      - like
      - stative_verb
      - present_simple

  - id: g016_q002
    question_type: two_choice
    prompt: She ___ Japanese food.
    choices:
      - text: likes
        correct: true
      - text: is liking
        correct: false
    answer: likes
    explanation: >
      like は好みを表す状態動詞。主語が She なので、現在形 likes が自然。
    translation: 彼女は日本食が好きだ。
    focus:
      - like
      - third_person_singular
      - stative_verb
      - present_simple

  - id: g016_q003
    question_type: two_choice
    prompt: Do you ___ this movie?
    choices:
      - text: like
        correct: true
      - text: liking
        correct: false
    answer: like
    explanation: >
      疑問文でも、like は状態動詞として現在形を使う。
      Do you like ...? が自然。
    translation: あなたはこの映画が好きですか。
    focus:
      - like
      - question_form
      - stative_verb
      - present_simple

  - id: g016_q004
    question_type: two_choice
    prompt: I don't ___ cold weather.
    choices:
      - text: like
        correct: true
      - text: liking
        correct: false
    answer: like
    explanation: >
      don't の後ろには動詞の原形 like を置く。
      また、like は好みの状態を表すので進行形にはしにくい。
    translation: 私は寒い天気が好きではない。
    focus:
      - like
      - negative_form
      - stative_verb
      - present_simple

  - id: g016_q005
    question_type: two_choice
    prompt: My sister ___ animals.
    choices:
      - text: loves
        correct: true
      - text: is loving
        correct: false
    answer: loves
    explanation: >
      love は強い好み・感情の状態を表す。主語が My sister なので、現在形 loves が自然。
    translation: 私の姉は動物が大好きだ。
    focus:
      - love
      - third_person_singular
      - stative_verb
      - present_simple

  - id: g016_q006
    question_type: two_choice
    prompt: Many children ___ chocolate.
    choices:
      - text: love
        correct: true
      - text: are loving
        correct: false
    answer: love
    explanation: >
      love は「大好きである」という感情の状態を表すので、
      are loving ではなく現在形 love が自然。
    translation: 多くの子どもたちはチョコレートが大好きだ。
    focus:
      - love
      - plural_subject
      - stative_verb
      - present_simple

  - id: g016_q007
    question_type: two_choice
    prompt: I ___ a glass of water.
    choices:
      - text: want
        correct: true
      - text: am wanting
        correct: false
    answer: want
    explanation: >
      want は「欲しい」という欲求の状態を表す動詞なので、
      現在進行形 am wanting ではなく現在形 want が自然。
    translation: 私は水を一杯欲しい。
    focus:
      - want
      - stative_verb
      - present_simple

  - id: g016_q008
    question_type: two_choice
    prompt: He ___ to be a doctor.
    choices:
      - text: wants
        correct: true
      - text: is wanting
        correct: false
    answer: wants
    explanation: >
      want to do は「〜したい」という欲求を表す。
      主語が He なので、現在形 wants が自然。
    translation: 彼は医者になりたがっている。
    focus:
      - want_to_do
      - third_person_singular
      - stative_verb
      - present_simple

  - id: g016_q009
    question_type: two_choice
    prompt: Do you ___ any help?
    choices:
      - text: need
        correct: true
      - text: needing
        correct: false
    answer: need
    explanation: >
      need は「必要としている」という状態を表す。
      疑問文では Do you need ...? が自然。
    translation: 何か助けが必要ですか。
    focus:
      - need
      - question_form
      - stative_verb
      - present_simple

  - id: g016_q010
    question_type: two_choice
    prompt: We ___ more information.
    choices:
      - text: need
        correct: true
      - text: are needing
        correct: false
    answer: need
    explanation: >
      need は必要性の状態を表すので、are needing ではなく現在形 need が自然。
    translation: 私たちはもっと情報が必要だ。
    focus:
      - need
      - stative_verb
      - present_simple

  - id: g016_q011
    question_type: two_choice
    prompt: She ___ a new pair of shoes.
    choices:
      - text: wants
        correct: true
      - text: is wanting
        correct: false
    answer: wants
    explanation: >
      want は欲求の状態を表す動詞である。
      主語が She なので、現在形 wants が自然。
    translation: 彼女は新しい靴が欲しい。
    focus:
      - want
      - third_person_singular
      - stative_verb
      - present_simple

  - id: g016_q012
    question_type: two_choice
    prompt: This plant ___ a lot of sunlight.
    choices:
      - text: needs
        correct: true
      - text: is needing
        correct: false
    answer: needs
    explanation: >
      need は「必要である」という状態を表す。
      主語が This plant なので、現在形 needs が自然。
    translation: この植物はたくさんの日光を必要とする。
    focus:
