id: g016
file: g016.yaml

title: like / love / want / need の現在形・現在進行形
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 感情・欲求・必要を表す状態動詞を現在形で判断できるか？

core_concept:
  overview: >
    like, love, want, need は、感情・好み・欲求・必要という状態を表す動詞である。
    そのため、「今好きだ」「今ほしい」「今必要だ」と言う場合でも、普通は現在進行形ではなく現在形を使う。
    日本語では「好きでいる」「欲しがっている」「必要としている」のように訳せるため、
    進行形にしたくなりやすいが、英語では状態を表す現在形が基本である。

  like:
    meaning: 好きである・気に入っている
    natural_form: 現在形
    unnatural_form: 現在進行形
    example: I like this song.
    ja: 私はこの歌が好きだ。
    point: 好み・感情の状態なので、I am liking this song. は基本的な英文法では避ける。

  love:
    meaning: 大好きである・愛している
    natural_form: 現在形
    unnatural_form: 現在進行形
    example: She loves animals.
    ja: 彼女は動物が大好きだ。
    point: 強い好み・感情を表す状態なので、現在形 loves が基本。

  want:
    meaning: 欲しい・〜したい
    natural_form: 現在形
    unnatural_form: 現在進行形
    example: I want a new bike.
    ja: 私は新しい自転車が欲しい。
    point: 欲求の状態を表すので、I am wanting ではなく I want が自然。

  need:
    meaning: 必要としている・必要である
    natural_form: 現在形
    unnatural_form: 現在進行形
    example: We need more time.
    ja: 私たちはもっと時間が必要だ。
    point: 必要性の状態を表すので、We are needing ではなく We need が自然。

main_rule: >
  like, love, want, need は、動作ではなく感情・欲求・必要の状態を表す。
  したがって、「今そう思っている」「今必要としている」と言いたい場合でも、
  英語では現在形を使うのが基本である。
  日本語の「〜している」に引きずられて現在進行形にしないことが大切である。

contrast_pairs:
  - natural: I like this book.
    unnatural: I am liking this book.
    point: >
      like は好み・感情の状態を表すので、現在形 like が自然。

  - natural: She loves music.
    unnatural: She is loving music.
    point: >
      love は強い好み・感情を表す状態動詞なので、現在形 loves が基本。

  - natural: He wants a new computer.
    unnatural: He is wanting a new computer.
    point: >
      want は欲求の状態を表すので、現在形 wants が自然。

  - natural: We need your help.
    unnatural: We are needing your help.
    point: >
      need は必要性の状態を表すので、現在形 need が自然。

