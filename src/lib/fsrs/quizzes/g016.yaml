common_mistakes:
  - mistake: 日本語の「好きでいる」を見て I am liking としてしまう
    correction: >
      like は好み・感情の状態を表すため、I like ... が基本。
      「今好きだ」という意味でも、普通は I like ... と言う。

  - mistake: 日本語の「欲しがっている」を見て is wanting としてしまう
    correction: >
      want は欲求の状態を表すため、現在形 want / wants が基本。
      He wants a new computer. が自然。

  - mistake: need を「必要としている」と訳して進行形にする
    correction: >
      need は必要性の状態を表すので、We need more time. が自然。
      We are needing more time. は基本的な高校英文法では避ける。

  - mistake: now があると必ず現在進行形にする
    correction: >
      now があっても、like, want, need のような状態動詞では現在形を使う。
      I want it now. が自然。

learning_notes:
  - >
    like, love, want, need は、動作ではなく「心の状態」や「必要性の状態」を表す。
    したがって、日本語で「〜している」と訳せても現在進行形にはしにくい。
  - >
    現在進行形は「今している動作」や「一時的な行動」に使う。
    like や want は、動作が進んでいるわけではなく、その時点でそう感じている状態である。
  - >
    love は広告表現や会話で I'm loving it. のように使われることもあるが、
    高校英文法の基本カードでは、まず状態動詞として現在形を使う原則を身につける。
  - >
    このカードは g001 の現在形・現在進行形の基本対立を、感情・欲求・必要を表す動詞に応用するためのカードである。

