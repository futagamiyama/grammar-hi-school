common_mistakes:
  - mistake: I am interesting. と言ってしまう
    correction: >
      I am interesting. は「私は人に興味を起こさせる人だ」という意味になる。
      「私は興味がある」なら I am interested. とする。
  - mistake: The movie was excited. と言ってしまう
    correction: >
      映画が興奮しているのではなく、映画が人を興奮させる。
      The movie was exciting. が自然。
  - mistake: 日本語の「面白い」だけで interesting/interested を選ぶ
    correction: >
      主語が人なら interested、主語が物・出来事なら interesting が基本。
      日本語訳ではなく主語の役割で判断する。
  - mistake: by や at, in, about, with の前置詞を無視する
    correction: >
      surprised at, interested in, excited about, disappointed with,
      satisfied with など、感情表現にはよく使う前置詞がある。

learning_notes:
  - >
    感情を表す過去分詞は、形は受動態だが、
    実際には「感情の状態」を表す形容詞のように使われる。
  - >
    人が主語なら interested, excited, surprised, disappointed, satisfied などを使う。
  - >
    物・出来事が主語なら interesting, exciting, surprising, disappointing, satisfying などを使う。
  - >
    「人が感情を受ける側」「物が感情を起こす側」と考えると、
    -ed と -ing の違いが見えやすい。

