id: g038
file: g038.yaml

title: 感情を表す受動態
type: construction

section:
  id: s04
  title: 受動態・態

level: basic
target: 高校英文法基礎

core_question: excited, interested, surprised などを正しく使えるか？

core_concept:
  emotion_passive:
    form: be + 感情を表す過去分詞
    meaning: 人が何かによって感情を引き起こされている状態を表す
    image: 人が感情を受ける側になる
    examples:
      - sentence: I am interested in science.
        ja: 私は科学に興味がある。
        point: 私が興味を引き起こされている状態。
      - sentence: She was surprised at the news.
        ja: 彼女はその知らせに驚いた。
        point: 彼女が驚かされた状態。
      - sentence: We were excited about the game.
        ja: 私たちはその試合に興奮した。
        point: 私たちが興奮させられた状態。

  emotion_ing_adjective:
    form: 感情を引き起こすもの + be + -ing 形容詞
    meaning: 物・出来事・人が、感情を引き起こす性質を持つことを表す
    image: それが人を〜させる
    examples:
      - sentence: The movie was exciting.
        ja: その映画はわくわくするものだった。
        point: 映画が人を興奮させる性質を持つ。
      - sentence: The story is interesting.
        ja: その話は面白い。
        point: 話が人に興味を持たせる。
      - sentence: The result was surprising.
        ja: その結果は驚くべきものだった。
        point: 結果が人を驚かせる性質を持つ。

main_rule: >
  感情を表す語では、人が主語なら過去分詞形を使うことが多い。
  I am interested. は「私は興味を持たされている状態」。
  I am excited. は「私は興奮している状態」。
  物・出来事が主語で、人に感情を起こさせる性質を言うなら -ing 形を使う。
  The movie is exciting. は「その映画は人を興奮させる」。
  日本語ではどちらも「面白い」「驚いた」などと訳せるため、
  主語が感情を受ける人か、感情を引き起こすものかで判断する。

contrast_pairs:
  - person_feeling: I am interested in the book.
    thing_causing_feeling: The book is interesting.
    point: >
      I が主語なら interested。
      The book が主語なら interesting。

  - person_feeling: She was surprised at the news.
    thing_causing_feeling: The news was surprising.
    point: >
      She は驚かされた人なので surprised。
      The news は人を驚かせるものなので surprising。

  - person_feeling: We were excited about the game.
    thing_causing_feeling: The game was exciting.
    point: >
      We は興奮した人なので excited。
      The game は興奮を引き起こすものなので exciting。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または感情を受ける人と感情を引き起こすものの違いを説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

