      - before
      - past_experience

  - id: g040_q011
    question_type: two_choice
    prompt: She remembered ___ off the lights.
    choices:
      - text: to turn
        correct: true
      - text: turning
        correct: false
    answer: to turn
    explanation: >
      電気を消すべきことを覚えていて実行したという意味。
      remembered to turn off が自然。
    translation: 彼女は忘れずに電気を消した。
    focus:
