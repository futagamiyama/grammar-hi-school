      - turn_off
      - task_completion

  - id: g040_q012
    question_type: two_choice
    prompt: She remembers ___ off the lights.
    choices:
      - text: to turn
        correct: false
      - text: turning
        correct: true
    answer: turning
    explanation: >
      電気を消したという過去の行為を覚えている。
      remembers turning off が自然。
    translation: 彼女は電気を消したことを覚えている。
    focus:
      - remember_doing
      - turn_off
      - past_memory

common_mistakes:
  - mistake: remember to do と remember doing をどちらも同じ「覚えている」と考える
    correction: >
      remember to do は「これからすべきことを忘れずにする」。
      remember doing は「過去にしたことを覚えている」。
  - mistake: I remember to lock the door. を「鍵をかけたことを覚えている」と読む
    correction: >
      過去に鍵をかけた記憶なら I remember locking the door.。
      I remembered to lock the door. なら「忘れずに鍵をかけた」。
  - mistake: yesterday や last week があるのに to do を選ぶ
    correction: >
      過去にしたことを覚えている場合は doing を使う。
      I remember calling her last week. が自然。
  - mistake: 命令文 Remember ... で doing を選ぶ
    correction: >
      「忘れずに〜しなさい」は、これからする行為なので
      Remember to lock the door. のように to do を使う。

learning_notes:
  - >
    remember to do は、行為がまだ先にある。
    「忘れずに〜する」と考える。
  - >
    remember doing は、行為がすでに過去にある。
    「〜したことを覚えている」と考える。
  - >
    remembered to do は「覚えていて実行した」という意味になりやすい。
    I remembered to call her. は「忘れずに電話した」。
  - >
    remember doing は経験の記憶を表す。
    I remember meeting him. は「彼に会ったことを覚えている」。

