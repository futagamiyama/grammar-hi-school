      - adverb_superlative
      - the_fastest

common_mistakes:
  - mistake: than があるのに最上級を使ってしまう
    correction: >
      than は2つを比べる合図。
      taller than, older than, more difficult than のように比較級を使う。
  - mistake: in/of の範囲があるのに比較級を使ってしまう
    correction: >
      in the class, in the world, of the three などで一番を表すなら最上級を使う。
      the tallest in the class, the heaviest of the three のようにする。
  - mistake: the を比較級につけてしまう
    correction: >
      普通の比較級では the をつけない。
      She is taller than her brother. が基本。
      ただし the 比較級, the 比較級 は別構文として扱う。
  - mistake: more と -er を同時に使う
    correction: >
      more taller とは言わない。
      taller または more difficult のように、語に応じて形を選ぶ。
  - mistake: 最上級に the をつけ忘れる
    correction: >
      名詞を説明して「一番〜な」と言うときは、the tallest student,
      the most difficult question のように the をつけるのが基本。

learning_notes:
  - >
    比較級は「A と B を比べる」形。
    than が見えたらまず比較級を考える。
  - >
    最上級は「範囲の中で一番」。
    in the class, in the world, of the three などが合図になる。
  - >
    短い形容詞・副詞は -er / -est を使うことが多い。
    tall, taller, the tallest / fast, faster, the fastest。
  - >
    長い形容詞・副詞は more / most を使うことが多い。
    difficult, more difficult, the most difficult。

