id: g056
file: g056.yaml

title: 比較級 vs 最上級
type: grammar_contrast

section:
  id: s07
  title: 形容詞・副詞・比較

level: basic
target: 高校英文法基礎

core_question: 2つを比べているのか、全体の中で一番なのか？

core_concept:
  comparative:
    form: 比較級 + than
    meaning: 〜より...だ
    image: 2つのものを横に並べて比べる
    examples:
      - sentence: This book is older than that one.
        ja: この本はあの本より古い。
        point: this book と that one の2つを比べている。
      - sentence: She is taller than her brother.
        ja: 彼女は兄より背が高い。
        point: she と her brother を比べている。
      - sentence: This question is more difficult than the last one.
        ja: この問題は前の問題より難しい。
        point: difficult は more difficult の形で比較級を作る。

  superlative:
    form: the + 最上級
    meaning: 最も〜だ
    image: 3つ以上・ある範囲の中で一番
    examples:
      - sentence: This is the oldest book in the library.
        ja: これは図書館で最も古い本だ。
        point: 図書館の中で一番古い。
      - sentence: She is the tallest student in her class.
        ja: 彼女はクラスで一番背が高い生徒だ。
        point: クラス全体の中で一番。
      - sentence: This is the most difficult question on the test.
        ja: これはそのテストで最も難しい問題だ。
        point: テスト全体の中で一番難しい。

main_rule: >
  比較級は、2つのものを比べて「〜より...だ」と言う形。
  taller than, older than, more difficult than のように than と一緒に使うことが多い。
  最上級は、ある範囲の中で「最も〜だ」と言う形。
  the tallest, the oldest, the most difficult のように the を付けるのが基本。
  than があれば比較級、in/of などで範囲を示して一番を表すなら最上級を考える。

contrast_pairs:
  - comparative: She is taller than her brother.
    superlative: She is the tallest student in her class.
    point: >
      taller than は2つを比べる。
      the tallest は範囲の中で一番を表す。

  - comparative: This question is more difficult than the last one.
    superlative: This is the most difficult question on the test.
    point: >
      more difficult than は「前の問題より難しい」。
      the most difficult は「テストの中で最も難しい」。

  - comparative: This river is longer than that river.
    superlative: This is the longest river in Japan.
    point: >
      longer than は2つの川の比較。
      the longest in Japan は日本の中で一番長い。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8

  rating_rules:
    AGAIN: "2問以上ミス"
    HARD: "1問ミス、または比較級と最上級の違いを説明できない"
    GOOD: "全問正解。ただしEASY条件は満たさない"
    EASY: "全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内"

  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

review_questions:
  - id: g056_q001
    question_type: two_choice
    prompt: She is ___ than her brother.
    choices:
      - text: taller
        correct: true
      - text: the tallest
        correct: false
    answer: taller
    explanation: >
      than があり、彼女と兄を比べている。
      2つの比較なので比較級 taller を使う。
    translation: 彼女は兄より背が高い。
    focus:
      - comparative
      - than
      - taller

  - id: g056_q002
    question_type: two_choice
    prompt: She is ___ student in her class.
    choices:
      - text: taller
        correct: false
      - text: the tallest
        correct: true
    answer: the tallest
    explanation: >
      in her class という範囲の中で一番背が高いという意味。
      最上級 the tallest を使う。
    translation: 彼女はクラスで一番背が高い生徒だ。
    focus:
      - superlative
      - in_phrase
      - the_tallest

  - id: g056_q003
    question_type: two_choice
    prompt: This book is ___ than that one.
    choices:
