review_questions:
  - id: g027_q001
    question_type: two_choice
    prompt: When I was little, I ___ climb tall trees.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: 私が小さかったころ、高い木に登ることができた。
    explanation: >
      When I was little は過去の時期を表し、climb tall trees はそのころの一般的な能力。
      したがって could が自然。
    focus:
      - could
      - past_general_ability
      - ability

  - id: g027_q002
    question_type: two_choice
    prompt: After three hours of work, I ___ fix the computer.
    choices:
      - text: could
        correct: false
      - text: was able to
        correct: true
    answer: was able to
    ja: 3時間作業した後、私はそのコンピューターを修理することができた。
    explanation: >
      特定の場面で実際に修理に成功したことを表している。
      肯定文では could より was able to が自然。
    focus:
      - was_able_to
      - specific_success
      - actual_result

  - id: g027_q003
    question_type: two_choice
    prompt: My father ___ speak English when he was young.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: 父は若いころ英語を話すことができた。
    explanation: >
      若いころに持っていた一般的な能力を表すので could が自然。
    focus:
      - could
      - past_general_ability
      - speak

  - id: g027_q004
    question_type: two_choice
    prompt: We ___ get tickets for the concert yesterday.
    choices:
      - text: could
        correct: false
      - text: were able to
        correct: true
    answer: were able to
    ja: 私たちは昨日、そのコンサートのチケットを手に入れることができた。
    explanation: >
      yesterday の特定場面で実際にチケットを取れた、という成功を表している。
      そのため were able to が自然。
    focus:
      - was_able_to
      - specific_success
      - yesterday

  - id: g027_q005
    question_type: two_choice
    prompt: I ___ not hear what she said because the room was noisy.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: 部屋がうるさかったので、彼女が言ったことが聞こえなかった。
    explanation: >
      否定文では、特定場面でできなかったことにも couldn't を普通に使う。
      ここでは could not hear が自然。
    focus:
      - could_not
      - specific_failure
      - negative

  - id: g027_q006
    question_type: two_choice
    prompt: It ___ rain later, so take an umbrella.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: 後で雨が降るかもしれないので、傘を持っていきなさい。
    explanation: >
      ここは過去の能力ではなく、未来についての控えめな可能性を表している。
      could rain で「雨が降る可能性がある」。
    focus:
      - could
      - possibility
      - future

  - id: g027_q007
    question_type: two_choice
    prompt: ___ you tell me the way to the station?
    choices:
      - text: Could
        correct: true
      - text: Were able to
        correct: false
    answer: Could
    ja: 駅への道を教えていただけますか。
    explanation: >
      Could you ...? は丁寧な依頼を表す。
      過去の能力を聞いているのではない。
    focus:
      - could_you
      - polite_request
      - request

  - id: g027_q008
    question_type: two_choice
    prompt: She studied hard and ___ pass the entrance exam.
    choices:
      - text: could
        correct: false
      - text: was able to
        correct: true
    answer: was able to
    ja: 彼女は一生懸命勉強して、入学試験に合格することができた。
    explanation: >
      努力した結果、特定の試験に実際に合格したという成功を表している。
      そのため was able to が自然。
    focus:
      - was_able_to
      - specific_success
      - exam

  - id: g027_q009
    question_type: two_choice
    prompt: This story ___ be true, but I am not sure.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: この話は本当かもしれないが、私は確信がない。
    explanation: >
      ここでは能力ではなく、現在についての控えめな可能性を表している。
      could be true が自然。
    focus:
      - could
      - possibility
      - uncertainty

  - id: g027_q010
    question_type: two_choice
    prompt: When he was in high school, he ___ solve difficult math problems quickly.
    choices:
      - text: could
        correct: true
      - text: was able to
        correct: false
    answer: could
    ja: 彼は高校生のころ、難しい数学の問題をすばやく解くことができた。
    explanation: >
      高校生のころの一般的な能力を述べているので could が自然。
    focus:
      - could
      - past_general_ability
      - math

  - id: g027_q011
    question_type: two_choice
    prompt: You ___ ask your teacher for help.
    choices:
      - text: could
        correct: true
      - text: were able to
        correct: false
    answer: could
    ja: 先生に助けを求めてみてもいいかもしれない。
    explanation: >
      could は控えめな提案にも使える。
      ここでは過去の能力ではない。
    focus:
      - could
      - suggestion
      - advice

  - id: g027_q012
    question_type: two_choice
    prompt: The door was locked, but we ___ open it with a spare key.
    choices:
      - text: could
        correct: false
      - text: were able to
        correct: true
    answer: were able to
    ja: ドアは鍵がかかっていたが、私たちは予備の鍵で開けることができた。
    explanation: >
      特定の場面で実際に開けることに成功したことを表している。
      肯定文では were able to が自然。
    focus:
      - was_able_to
      - specific_success
      - actual_result

common_mistakes:
  - mistake: could をすべて「〜できた」と訳してしまう
    correction: >
      could は過去の能力だけでなく、現在・未来についての控えめな可能性や丁寧な依頼にも使う。

  - mistake: 特定の場面で実際に成功した肯定文にも could を使ってしまう
    correction: >
      「昨日チケットを取れた」「試験に合格できた」のような実際の成功には、was/were able to が自然なことが多い。

  - mistake: Could you ...? を「あなたは〜できましたか」と過去の意味で読んでしまう
    correction: >
      Could you ...? は多くの場合、丁寧な依頼を表す。
      過去の能力を聞いているとは限らない。

learning_notes:
  - >
    could の中心には「距離」がある。
    過去の能力、控えめな可能性、丁寧な依頼は、どれも直接的に言い切らない感じを持つ。
  - >
    過去の一般的能力なら could が自然。
    例: I could swim when I was five.
  - >
    特定の場面で実際に成功した肯定文では、was/were able to を優先する。
    例: I was able to finish the work yesterday.
  - >
    否定文では、特定の場面でできなかったことにも couldn't を普通に使う。
    例: I couldn't open the door.
  - >
    could は「かもしれない」「していただけますか」「してみてもよい」という意味でも頻繁に使われる。

