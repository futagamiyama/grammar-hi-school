id: g027
file: g027.yaml

title: could の意味
type: grammar_contrast

section:
  id: s03
  title: 助動詞・法

level: basic
target: 高校英文法基礎

core_question: 過去の一般的能力か、特定場面で実際にできたことか、控えめな可能性・依頼か？

core_concept:
  could_past_ability:
    form: could + 動詞の原形
    meaning: 過去に一般的にできた能力を表す
    image: 昔はそういう能力があった
    examples:
      - sentence: When I was a child, I could swim fast.
        ja: 子どものころ、私は速く泳げた。
        point: 過去の一般的な能力を表すので could が自然。
      - sentence: My grandmother could speak French.
        ja: 祖母はフランス語を話すことができた。
        point: 過去に持っていた能力を述べている。

  was_able_to_specific_success:
    form: was/were able to + 動詞の原形
    meaning: 特定の場面で実際にできたこと・成功したことを表す
    image: その時、実際にやり遂げた
    examples:
      - sentence: I was able to finish the report yesterday.
        ja: 私は昨日、そのレポートを仕上げることができた。
        point: 昨日という特定の場面で実際にできたことなので was able to が自然。
      - sentence: They were able to catch the last train.
        ja: 彼らは終電に間に合うことができた。
        point: 特定の場面で成功したことを表している。

  could_possibility_request:
    form: could + 動詞の原形
    meaning: 控えめな可能性・提案・丁寧な依頼を表す
    image: あり得る / してもよい / していただけますか
    examples:
      - sentence: It could rain this evening.
        ja: 今晩、雨が降るかもしれない。
        point: 可能性を控えめに述べている。
      - sentence: Could you open the window?
        ja: 窓を開けていただけますか。
        point: 丁寧な依頼を表している。

main_rule: >
  could は「〜できた」とだけ覚えると危険である。
  過去の一般的能力なら could を使う。
  しかし、特定の場面で実際に成功したことを表す肯定文では、was/were able to が自然になることが多い。
  また could は、過去ではなく、現在・未来についての控えめな可能性、提案、丁寧な依頼にも使われる。

contrast_pairs:
  - could: When I was young, I could run fast.
    was_able_to: I was able to win the race yesterday.
    point: >
      could は昔の一般的能力、was able to は昨日そのレースに実際に勝てたという特定場面の成功。

  - could: It could be true.
    can: It can be true in some cases.
    point: >
      could は「あり得るかもしれない」という控えめな可能性。
      can は「場合によってはあり得る」という一般的可能性。

  - could: Could you help me?
    can: Can you help me?
    point: >
      could は can より距離を置いた丁寧な依頼として使われる。

