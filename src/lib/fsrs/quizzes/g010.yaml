  - id: g010_q006
    question_type: two_choice
    prompt: Please wait until the meeting ___.
    choices:
      - text: ends
        correct: true
      - text: will end
        correct: false
    answer: ends
    explanation: >
      until the meeting ends は「会議が終わるまで」という期限を表す副詞節。
      未来のことでも現在形 ends を使う。
    focus:
