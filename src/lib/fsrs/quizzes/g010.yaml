      - condition
      - present_simple

common_mistakes:
  - mistake: tomorrow や next week があると、必ず will を使うと思う
    correction: >
      副詞節の中では、未来のことでも現在形を使う。
      例: If it rains tomorrow, we will stay home.

  - mistake: if の後ろには絶対に will を置けないと思う
    correction: >
      条件を表す副詞節では普通 will を使わない。
      ただし、if が「〜かどうか」という名詞節を作る場合は別で、I don't know if he will come. のように will を使える。

  - mistake: 文全体に will を1つ入れればよいと思う
    correction: >
      主節では will を使えても、時・条件の副詞節では現在形を使う。
      主節と副詞節を分けて見る必要がある。

learning_notes:
  - >
    このカードで見るのは、未来表現そのものではなく、時・条件を表す副詞節の中の時制である。
  - >
    when, if, before, after, until, as soon as, once, in case などは、
    「いつ」「どんな条件で」主節が起きるかを示すことが多い。
  - >
    副詞節では未来のことでも現在形を使うが、主節では will を使える。
  - >
    if や when が名詞節を作る場合は別問題になる。
    例: I don't know when he will arrive. は「いつ到着するかを知らない」という名詞節なので、will が使える。

