id: g013
file: g013.yaml

title: be と be being
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 性質を述べるのか、一時的な振る舞いを述べるのか？

core_concept:
  be_simple:
    form: be動詞の現在形
    meaning: 性質・状態・身分・恒常的な特徴を表す
    image: その人や物が、もともとそうである / 今そういう状態である
    examples:
      - sentence: He is kind.
        ja: 彼は親切だ。
        point: 彼の性格・特徴を述べている。
      - sentence: She is quiet.
        ja: 彼女は静かな人だ。
        point: 普段の性格や状態を述べている。
      - sentence: The box is heavy.
        ja: その箱は重い。
        point: 物の状態・性質を述べている。

  be_being:
    form: be動詞の現在進行形
    meaning: 今だけの振る舞い・一時的な態度を表す
    image: 今はそう振る舞っている / いつもそうとは限らない
    examples:
      - sentence: He is being kind today.
        ja: 彼は今日は親切に振る舞っている。
        point: 普段の性格ではなく、今日の一時的な振る舞いを述べている。
      - sentence: You are being rude.
        ja: 君は失礼な態度を取っている。
        point: 今の態度・振る舞いを批判している。
      - sentence: The children are being quiet.
        ja: 子どもたちは静かにしている。
        point: 一時的に静かに振る舞っている。

main_rule: >
  be動詞は普通、状態や性質を表すため現在進行形にしにくい。
  しかし、人の態度・行動・振る舞いを表すときは be being を使える。
  He is kind. は「彼は親切な人だ」。
  He is being kind. は「彼は今、親切に振る舞っている」。
  be being は「今だけそうしている」という一時性を表す。

contrast_pairs:
  - be_simple: He is polite.
    be_being: He is being polite today.
    point: >
      is polite は普段の性格・特徴。
      is being polite は今日だけの一時的な振る舞い。

  - be_simple: She is quiet.
    be_being: She is being quiet during the meeting.
    point: >
      is quiet は性格や状態。
      is being quiet は会議中だけ静かにしているという行動。

  - be_simple: You are rude.
    be_being: You are being rude.
    point: >
      are rude は相手の性格を直接批判する強い表現。
      are being rude は今の態度を批判する表現。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8
  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

fsrs_rating:
  review_question_count: 3
  time_limit_seconds_per_question: 8
  rules:
