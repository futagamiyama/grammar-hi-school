      - text: is being
        correct: true
    answer: is being
    ja: 彼は今日はとても礼儀正しく振る舞っている。
    explanation: >
      today があり、普段の性格ではなく今日の一時的な振る舞いを表している。
      したがって is being が自然。
    focus:
      - temporary_behavior
      - today
      - be_being

