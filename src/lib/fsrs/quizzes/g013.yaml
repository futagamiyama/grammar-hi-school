common_mistakes:
  - mistake: be動詞は絶対に進行形にならないと思う
    correction: >
      be動詞は通常は状態を表すため進行形にしにくい。
      しかし、人の態度・振る舞いを表すときは be being を使える。

  - mistake: He is kind. と He is being kind. を同じ意味だと思う
    correction: >
      He is kind. は性格として親切。
      He is being kind. は今だけ親切に振る舞っている、という意味。

  - mistake: 物や状態にも be being を使ってしまう
    correction: >
      This bag is heavy. のような物の性質には普通 is being は使わない。
      be being は主に人の一時的な態度・振る舞いに使う。

learning_notes:
  - >
    be being は、現在進行形の中でも特殊な用法。
    「存在している」ではなく「そう振る舞っている」と考えるとわかりやすい。
  - >
    rude, polite, careful, silly, difficult, quiet などは、
    人の一時的な態度を表すとき be being と一緒に使える。
  - >
    tall, old, heavy, correct, dead, empty など、物理的性質や状態を表す語は、
    普通 be being とは相性が悪い。
  - >
    be being は「いつもそうとは限らない」という含みを持ちやすい。

