id: g106
file: g106.yaml

title: 譲歩を表す although / though / even though
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 「〜だけれども」を表す although / though / even though と、despite / in spite of を使い分けられるか？

core_concept:
  although_though_clause:
    form: Although/Though + 主語 + 動詞 ..., 主語 + 動詞 ...
    meaning: 〜だけれども、〜にもかかわらず
    image: 予想と反対の結果をつなぐ
    examples:
      - sentence: Although it was raining, we went out.
        ja: 雨が降っていたけれども、私たちは外出した。
        point: 雨なら外出しないはず、という予想に反する結果を表す。
      - sentence: Though he was tired, he kept working.
        ja: 彼は疲れていたけれども、働き続けた。
        point: though は although よりやや口語的にも使いやすい。
      - sentence: Although she is young, she is very responsible.
        ja: 彼女は若いけれども、とても責任感がある。
        point: 若いことと責任感があることの対比を示す。

  even_though_clause:
    form: Even though + 主語 + 動詞 ..., 主語 + 動詞 ...
    meaning: たとえ〜であっても、〜にもかかわらず
    image: although / though より強い譲歩
    examples:
      - sentence: Even though it was very cold, they continued the game.
        ja: とても寒かったにもかかわらず、彼らは試合を続けた。
        point: even though は譲歩を強く表す。
      - sentence: Even though he apologized, she did not forgive him.
        ja: 彼が謝ったにもかかわらず、彼女は彼を許さなかった。
        point: 謝れば許すはず、という予想に反する。
      - sentence: Even though I was busy, I helped him.
        ja: 忙しかったにもかかわらず、私は彼を手伝った。
        point: 忙しさを強調して、それでも手伝ったことを示す。

  though_sentence_end:
    form: 主語 + 動詞 ..., though.
    meaning: でもね、だけど
    image: 文末に置いて、軽い逆接を添える
    examples:
      - sentence: The test was difficult. I passed it, though.
        ja: そのテストは難しかった。でも合格した。
        point: 文末の though は「でもね」に近い。
      - sentence: It was expensive. I bought it, though.
        ja: それは高かった。でも私は買った。
        point: 前の内容に反する補足を後から加える。
      - sentence: I do not like coffee. I drink it sometimes, though.
        ja: コーヒーは好きではない。でも時々飲む。
        point: 口語的な逆接表現。

  despite_in_spite_of:
    form: despite/in spite of + 名詞・動名詞
    meaning: 〜にもかかわらず
    image: despite / in spite of の後ろは文ではなく名詞句
    examples:
      - sentence: Despite the rain, we went out.
        ja: 雨にもかかわらず、私たちは外出した。
        point: despite の後ろは名詞句 the rain。
      - sentence: In spite of his age, he is very active.
        ja: 年齢にもかかわらず、彼はとても活動的だ。
        point: in spite of の後ろは名詞句 his age。
      - sentence: Despite being tired, he kept working.
        ja: 疲れていたにもかかわらず、彼は働き続けた。
        point: despite の後ろに動詞を置くなら動名詞 being。

main_rule: >
  although / though / even though は、「〜だけれども」「〜にもかかわらず」を表す接続詞。
  後ろには主語＋動詞を含む文が来る。
  Although it was raining, we went out. は
  「雨が降っていたけれども、私たちは外出した」という意味。
  though は although より少し口語的にも使いやすく、文末に置いて
  I passed it, though. のように「でもね」と補足することもある。
  even though は although / though より強く、「たとえ〜であっても」「〜にもかかわらず」と強い譲歩を表す。
  一方、despite / in spite of は前置詞句なので、後ろには文ではなく名詞・名詞句・動名詞が来る。
  although it was raining と despite the rain の違いに注意する。

contrast_pairs:
  - clause: Although it was raining, we went out.
    phrase: Despite the rain, we went out.
    point: >
      although の後ろは文。
      despite の後ろは名詞句。

  - weak: Though he was tired, he kept working.
    strong: Even though he was tired, he kept working.
    point: >
      even though は、though より譲歩を強く表す。

  - front: Though the test was difficult, I passed it.
    end: The test was difficult. I passed it, though.
    point: >
      though は文頭にも文末にも置ける。
      文末では「でもね」に近い軽い逆接になる。

