review_questions:
  - id: g106_q001
    question_type: two_choice
    prompt: ___ it was raining, we went out.
    choices:
      - text: Although
        correct: true
      - text: Despite
        correct: false
    answer: Although
    explanation: >
      it was raining は主語＋動詞を含む文。
      接続詞 Although を使う。
    translation: 雨が降っていたけれども、私たちは外出した。
    focus:
      - although_though_clause
      - clause
      - raining

  - id: g106_q002
    question_type: two_choice
    prompt: ___ the rain, we went out.
    choices:
      - text: Despite
        correct: true
      - text: Although
        correct: false
    answer: Despite
    explanation: >
      the rain は名詞句。
      名詞句を後ろに取る despite が自然。
    translation: 雨にもかかわらず、私たちは外出した。
    focus:
      - despite_in_spite_of
      - noun_phrase
      - rain

  - id: g106_q003
    question_type: two_choice
    prompt: ___ he was tired, he kept working.
    choices:
      - text: Though
        correct: true
      - text: Despite
        correct: false
    answer: Though
    explanation: >
      he was tired は文。
      接続詞 Though を使い、「疲れていたけれども」と読む。
    translation: 彼は疲れていたけれども、働き続けた。
    focus:
      - although_though_clause
      - though
      - tired

  - id: g106_q004
    question_type: two_choice
    prompt: Despite ___ tired, he kept working.
    choices:
      - text: being
        correct: true
      - text: he was
        correct: false
    answer: being
    explanation: >
      despite は前置詞なので、後ろに文 he was tired は直接置けない。
      動詞を使うなら動名詞 being tired にする。
    translation: 疲れていたにもかかわらず、彼は働き続けた。
    focus:
      - despite_in_spite_of
      - gerund
      - being_tired

  - id: g106_q005
    question_type: two_choice
    prompt: ___ she is young, she is very responsible.
    choices:
      - text: Although
        correct: true
      - text: Because of
        correct: false
    answer: Although
    explanation: >
      she is young は文。
      「若いけれども」という譲歩を表すので Although が自然。
    translation: 彼女は若いけれども、とても責任感がある。
    focus:
      - although_though_clause
      - concession
      - young

  - id: g106_q006
    question_type: two_choice
    prompt: ___ it was very cold, they continued the game.
    choices:
      - text: Even though
        correct: true
      - text: Even
        correct: false
    answer: Even though
    explanation: >
      it was very cold は文。
      「とても寒かったにもかかわらず」と強い譲歩を表すので Even though を使う。
    translation: とても寒かったにもかかわらず、彼らは試合を続けた。
    focus:
      - even_though_clause
      - strong_concession
      - cold

  - id: g106_q007
    question_type: two_choice
    prompt: ___ he apologized, she did not forgive him.
    choices:
      - text: Even though
        correct: true
      - text: Despite of
        correct: false
    answer: Even though
    explanation: >
      he apologized は文。
      Even though he apologized で「彼が謝ったにもかかわらず」という意味。
      despite of は標準的な形ではない。
    translation: 彼が謝ったにもかかわらず、彼女は彼を許さなかった。
    focus:
      - even_though_clause
      - apologized
      - forgive

  - id: g106_q008
    question_type: two_choice
    prompt: ___ I was busy, I helped him.
    choices:
      - text: Even though
        correct: true
      - text: In spite
        correct: false
    answer: Even though
    explanation: >
      I was busy は文なので Even though を使う。
      in spite を使うなら in spite of + 名詞句にする。
    translation: 忙しかったにもかかわらず、私は彼を手伝った。
    focus:
      - even_though_clause
      - busy
      - helped

  - id: g106_q009
    question_type: two_choice
    prompt: The test was difficult. I passed it, ___.
    choices:
      - text: though
        correct: true
      - text: although
        correct: false
    answer: though
    explanation: >
      文末に置いて「でもね」と補足する場合は though が自然。
      although は普通、文末にこの形では置かない。
    translation: そのテストは難しかった。でも合格した。
    focus:
      - though_sentence_end
      - sentence_end
      - contrast

  - id: g106_q010
    question_type: two_choice
    prompt: It was expensive. I bought it, ___.
    choices:
      - text: though
        correct: true
      - text: despite
        correct: false
    answer: though
    explanation: >
      文末の though は「でもね」という軽い逆接。
      despite は前置詞なので、この位置に単独では置かない。
    translation: それは高かった。でも私は買った。
    focus:
      - though_sentence_end
      - expensive
      - bought

  - id: g106_q011
    question_type: two_choice
    prompt: ___ his age, he is very active.
    choices:
      - text: In spite of
        correct: true
      - text: Although
        correct: false
    answer: In spite of
    explanation: >
      his age は名詞句。
      名詞句を後ろに取る In spite of が自然。
    translation: 年齢にもかかわらず、彼はとても活動的だ。
    focus:
      - despite_in_spite_of
      - in_spite_of
      - age

  - id: g106_q012
    question_type: two_choice
    prompt: In spite of ___, she finished the race.
    choices:
      - text: the pain
        correct: true
      - text: she was in pain
        correct: false
    answer: the pain
    explanation: >
      in spite of の後ろは名詞句。
      she was in pain という文を直接置くことはできない。
    translation: 痛みにもかかわらず、彼女はレースを完走した。
    focus:
      - despite_in_spite_of
      - noun_phrase
      - pain

common_mistakes:
  - mistake: although の後ろに名詞句だけを置いてしまう
    correction: >
      although は接続詞なので後ろに文が来る。
      although the rain ではなく although it was raining。
  - mistake: despite の後ろに文を置いてしまう
    correction: >
      despite は前置詞なので、後ろは名詞句・動名詞。
      despite he was tired ではなく despite being tired。
  - mistake: despite of としてしまう
    correction: >
      despite は of を付けない。
      in spite of は of を付ける。
  - mistake: even though と even を同じように使う
    correction: >
      even though は接続詞句で、後ろに文を取る。
      even it was cold ではなく even though it was cold。
  - mistake: 文末 though を読めない
    correction: >
      文末の though は「でもね」「だけど」と、前の内容に反する補足を表す。

learning_notes:
  - >
    although / though / even though は接続詞。
    後ろには主語＋動詞を含む文が来る。
  - >
    even though は、although / though より強い譲歩を表す。
  - >
    though は文末にも置ける。
    I passed it, though. は「でも合格した」。
  - >
    despite / in spite of は前置詞句。
    後ろには名詞句または動名詞が来る。
  - >
    although it was raining と despite the rain をセットで覚えるとよい。

