id: g110
file: g110.yaml

title: 条件を表す接続詞 if / unless / as long as / provided that
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 条件を表す if / unless / as long as / provided that を、意味と形に応じて使い分けられるか？

core_concept:
  if_condition:
    form: if + 主語 + 現在形, 主語 + will/can/may + 動詞原形
    meaning: もし〜なら
    image: ある条件が満たされた時の結果を述べる
    examples:
      - sentence: If it rains tomorrow, we will stay home.
        ja: もし明日雨が降れば、私たちは家にいるでしょう。
        point: 未来の条件でも if節の中は rains と現在形。
      - sentence: If you need help, call me.
        ja: 助けが必要なら、私に電話してください。
        point: if you need help が条件を表す。
      - sentence: If he comes early, we can start the meeting.
        ja: もし彼が早く来れば、私たちは会議を始められます。
        point: 条件節では will come ではなく comes。

  unless_condition:
    form: unless + 主語 + 肯定形
    meaning: 〜しない限り、もし〜でなければ
    image: unless = if ... not
    examples:
      - sentence: Unless it rains, we will go hiking.
        ja: 雨が降らない限り、私たちはハイキングに行きます。
        point: unless it rains = if it does not rain。
      - sentence: You will fail unless you study harder.
        ja: もっと一生懸命勉強しなければ、あなたは失敗するでしょう。
        point: unless you study harder = if you do not study harder。
      - sentence: Do not open the door unless you know who it is.
        ja: 誰か分かっている場合を除いて、ドアを開けてはいけません。
        point: unless の後ろは基本的に肯定形で条件を表す。

  as_long_as_condition:
    form: as long as + 主語 + 動詞
    meaning: 〜する限り、〜である限り
    image: 条件が続く範囲では結果も成り立つ
    examples:
      - sentence: You can use my car as long as you drive carefully.
        ja: 注意して運転する限り、私の車を使ってよいです。
        point: 注意して運転することが条件。
      - sentence: As long as you are honest, I will trust you.
        ja: あなたが正直である限り、私はあなたを信頼します。
        point: 正直である状態が続くことを条件にしている。
      - sentence: You may stay here as long as you keep quiet.
        ja: 静かにしている限り、ここにいてもよいです。
        point: keep quiet が条件。

  provided_that_condition:
    form: provided that + 主語 + 動詞
    meaning: 〜という条件で、〜であれば
    image: 条件をはっきり指定する、やや硬い表現
    examples:
      - sentence: You can join the club provided that you follow the rules.
        ja: 規則に従うという条件で、そのクラブに参加できます。
        point: provided that は条件を明確に示す。
      - sentence: We will accept the offer provided that the price is fair.
        ja: 価格が妥当であれば、私たちはその申し出を受け入れます。
        point: 価格が妥当であることが条件。
      - sentence: The plan will succeed provided that everyone cooperates.
        ja: 全員が協力すれば、その計画は成功するでしょう。
        point: everyone cooperates が成功の条件。

  future_in_condition_clause:
    form: if/unless/as long as/provided that + 主語 + 現在形
    meaning: 未来の条件でも現在形
    image: 条件節の中では will を使わない
    examples:
      - sentence: If he comes tomorrow, I will tell him.
        ja: もし彼が明日来たら、私は彼に伝えます。
        point: if he will come ではなく if he comes。
      - sentence: Unless she calls, I will leave.
        ja: 彼女が電話してこない限り、私は出発します。
        point: unless she will call ではなく unless she calls。
      - sentence: As long as you try, you will improve.
        ja: 努力する限り、あなたは上達するでしょう。
        point: as long as you will try ではなく as long as you try。

main_rule: >
  条件を表す接続詞には if, unless, as long as, provided that などがある。
  if は「もし〜なら」と条件を表す基本形。
  If it rains tomorrow, we will stay home. では、
  「明日雨が降ること」が家にいる条件になっている。
  unless は「〜しない限り」「もし〜でなければ」で、if ... not に近い。
  Unless it rains, we will go hiking. は
  If it does not rain, we will go hiking. とほぼ同じ意味。
  as long as は「〜する限り」で、条件が続く範囲を表す。
  provided that は「〜という条件で」というやや硬い表現で、
  条件を明確に指定する時に使う。
  重要なのは、条件の副詞節では未来の内容でも will を使わず、現在形を使うこと。
  If he comes tomorrow が正しく、if he will come tomorrow とはしない。

contrast_pairs:
  - if_form: If it does not rain, we will go hiking.
    unless_form: Unless it rains, we will go hiking.
    point: >
      unless it rains は if it does not rain とほぼ同じ意味。
      unless の後ろは普通、肯定形にする。

  - correct: If he comes tomorrow, I will tell him.
    incorrect: If he will come tomorrow, I will tell him.
    point: >
      条件節では、未来の内容でも現在形を使う。
      if he comes が正しい。

  - as_long_as: You can use my car as long as you drive carefully.
    provided_that: You can join the club provided that you follow the rules.
    point: >
      as long as は「〜する限り」。
      provided that は「〜という条件で」と条件を明確に指定する。

