review_questions:
  - id: g110_q001
    question_type: two_choice
    prompt: ___ it rains tomorrow, we will stay home.
    choices:
      - text: If
        correct: true
      - text: Because of
        correct: false
    answer: If
    explanation: >
      it rains tomorrow は文。
      「もし明日雨が降れば」という条件を表すので If を使う。
    translation: もし明日雨が降れば、私たちは家にいるでしょう。
    focus:
      - if_condition
      - condition
      - rains

  - id: g110_q002
    question_type: two_choice
    prompt: If it ___ tomorrow, we will stay home.
    choices:
      - text: rains
        correct: true
      - text: will rain
        correct: false
    answer: rains
    explanation: >
      条件を表す if節では、未来の内容でも現在形を使う。
      if it rains tomorrow が正しい。
    translation: もし明日雨が降れば、私たちは家にいるでしょう。
    focus:
      - future_in_condition_clause
      - present_for_future
      - rains

  - id: g110_q003
    question_type: two_choice
    prompt: If you ___ help, call me.
    choices:
      - text: need
        correct: true
      - text: will need
        correct: false
    answer: need
    explanation: >
      if you need help は条件節。
      未来の可能性でも、条件節の中では現在形 need を使う。
    translation: 助けが必要なら、私に電話してください。
    focus:
      - if_condition
      - future_in_condition_clause
      - help

  - id: g110_q004
    question_type: two_choice
    prompt: ___ it rains, we will go hiking.
    choices:
      - text: Unless
        correct: true
      - text: If not
        correct: false
    answer: Unless
    explanation: >
      Unless it rains で「雨が降らない限り」。
      if it does not rain に近い意味。
    translation: 雨が降らない限り、私たちはハイキングに行きます。
    focus:
      - unless_condition
      - if_not
      - hiking

  - id: g110_q005
    question_type: two_choice
    prompt: You will fail unless you ___ harder.
    choices:
      - text: study
        correct: true
      - text: will study
        correct: false
    answer: study
    explanation: >
      unless節も条件節なので、未来の内容でも現在形。
      unless you study harder が正しい。
    translation: もっと一生懸命勉強しなければ、あなたは失敗するでしょう。
    focus:
      - unless_condition
      - future_in_condition_clause
      - study

  - id: g110_q006
    question_type: two_choice
    prompt: Unless it rains means ___.
    choices:
      - text: if it does not rain
        correct: true
      - text: if it rains
        correct: false
    answer: if it does not rain
    explanation: >
      unless は if ... not に近い。
      unless it rains は「雨が降らないなら」「雨が降らない限り」。
    translation: Unless it rains は「雨が降らないなら」という意味である。
    focus:
      - unless_condition
      - meaning
      - if_not

  - id: g110_q007
    question_type: two_choice
    prompt: You can use my car ___ you drive carefully.
    choices:
      - text: as long as
        correct: true
      - text: because of
        correct: false
    answer: as long as
    explanation: >
      as long as you drive carefully で「注意して運転する限り」。
      車を使える条件を表している。
    translation: 注意して運転する限り、私の車を使ってよいです。
    focus:
      - as_long_as_condition
      - condition
      - drive_carefully

  - id: g110_q008
    question_type: two_choice
    prompt: As long as you ___ honest, I will trust you.
    choices:
      - text: are
        correct: true
      - text: will be
        correct: false
    answer: are
    explanation: >
      as long as節は条件節。
      未来の内容でも現在形 are を使う。
    translation: あなたが正直である限り、私はあなたを信頼します。
    focus:
      - as_long_as_condition
      - future_in_condition_clause
      - honest

  - id: g110_q009
    question_type: two_choice
    prompt: You may stay here as long as you ___ quiet.
    choices:
      - text: keep
        correct: true
      - text: will keep
        correct: false
    answer: keep
    explanation: >
      as long as you keep quiet で「静かにしている限り」。
      条件節では will keep ではなく keep。
    translation: 静かにしている限り、ここにいてもよいです。
    focus:
      - as_long_as_condition
      - keep_quiet
      - present_for_future

  - id: g110_q010
    question_type: two_choice
    prompt: You can join the club ___ you follow the rules.
    choices:
      - text: provided that
        correct: true
      - text: because of
        correct: false
    answer: provided that
    explanation: >
      provided that you follow the rules で
      「規則に従うという条件で」という意味。
    translation: 規則に従うという条件で、そのクラブに参加できます。
    focus:
      - provided_that_condition
      - formal_condition
      - rules

  - id: g110_q011
    question_type: two_choice
    prompt: We will accept the offer provided that the price ___ fair.
    choices:
      - text: is
        correct: true
      - text: will be
        correct: false
    answer: is
    explanation: >
      provided that の節も条件節。
      未来の内容でも the price is fair と現在形にする。
    translation: 価格が妥当であれば、私たちはその申し出を受け入れます。
    focus:
      - provided_that_condition
      - future_in_condition_clause
      - price

  - id: g110_q012
    question_type: two_choice
    prompt: The plan will succeed provided that everyone ___.
    choices:
      - text: cooperates
        correct: true
      - text: will cooperate
        correct: false
    answer: cooperates
    explanation: >
      provided that everyone cooperates で「全員が協力すれば」。
      条件節では will cooperate ではなく cooperates。
    translation: 全員が協力すれば、その計画は成功するでしょう。
    focus:
      - provided_that_condition
      - cooperates
      - present_for_future

common_mistakes:
  - mistake: 条件節で will を使ってしまう
    correction: >
      if / unless / as long as / provided that が条件を表す時は、
      未来の内容でも現在形を使う。
      if he comes / unless she calls / as long as you try。
  - mistake: unless を if と同じ意味だと思う
    correction: >
      unless は if ... not に近い。
      unless it rains = if it does not rain。
  - mistake: unless の後ろを二重否定にしてしまう
    correction: >
      unless 自体に not の意味があるので、
      unless you do not study とすると意味がずれやすい。
      基本は unless you study と肯定形で覚える。
  - mistake: as long as を時間の長さだけで読む
    correction: >
      as long as は条件の「〜する限り」を表すことが多い。
      As long as you are honest, I will trust you.。
  - mistake: provided that を because と同じ理由表現だと思う
    correction: >
      provided that は理由ではなく条件。
      「〜という条件で」と読む。

learning_notes:
  - >
    if は条件の基本形。
    If it rains, we will stay home. の形。
  - >
    条件節では、未来の内容でも現在形を使う。
    if he comes / unless she calls / provided that everyone cooperates。
  - >
    unless は if ... not に近く、「〜しない限り」と読む。
  - >
    as long as は「〜する限り」。
    条件が続く範囲を表す。
  - >
    provided that は「〜という条件で」という硬めの条件表現。
    契約・規則・説明文でよく出る。

