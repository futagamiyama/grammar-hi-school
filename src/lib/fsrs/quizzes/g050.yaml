common_mistakes:
  - mistake: little と a little をどちらも「少し」とだけ覚える
    correction: >
      little は「ほとんどない」で否定的。
      a little は「少しはある」で肯定的。
      a の有無で意味の向きが変わる。
  - mistake: little / a little を複数可算名詞に使う
    correction: >
      little / a little は不可算名詞に使う。
      students, books, mistakes などの複数可算名詞には few / a few を使う。
  - mistake: a little time を「時間がほとんどない」と読む
    correction: >
      a little time は「少し時間がある」。
      「時間がほとんどない」は little time。
  - mistake: 文脈を見ずに little / a little を選ぶ
    correction: >
      must hurry, cannot buy, needs more training などは little。
      let's talk, can buy, can help などは a little が自然。

learning_notes:
  - >
    little は「少ない」ではなく「少なすぎる」と考えるとよい。
    否定的な響きがある。
  - >
    a little は「多くはないが、あるにはある」と考える。
    肯定的な響きがある。
  - >
    little / a little は不可算名詞に使う。
    time, water, money, experience, hope, interest などと相性がよい。
  - >
    可算名詞の few / a few と対にして覚えるとよい。
    few は数、little は量を表す。

