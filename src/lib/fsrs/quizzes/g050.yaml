id: g050
file: g050.yaml

title: little / a little
type: grammar_contrast

section:
  id: s06
  title: 名詞・冠詞・数量表現

level: basic
target: 高校英文法基礎

core_question: 不可算名詞について、ほとんどないのか、少しはあるのか？

core_concept:
  little:
    form: little + 不可算名詞
    meaning: ほとんど〜ない
    image: 量が少なすぎて、不十分・否定的
    examples:
      - sentence: We have little time.
        ja: 私たちには時間がほとんどない。
        point: 時間が少なすぎて不十分という意味。
      - sentence: There is little water in the bottle.
        ja: そのボトルには水がほとんどない。
        point: 水の量が少なすぎる。
      - sentence: He has little money.
        ja: 彼にはお金がほとんどない。
        point: お金が少なく、不十分という感じ。

  a_little:
    form: a little + 不可算名詞
    meaning: 少しはある
    image: 量は多くないが、あるにはある
    examples:
      - sentence: We have a little time.
        ja: 私たちには少し時間がある。
        point: 多くはないが、時間はある。
      - sentence: There is a little water in the bottle.
        ja: そのボトルには水が少しある。
        point: 少量だが、水はある。
      - sentence: He has a little money.
        ja: 彼には少しお金がある。
        point: 多くはないが、お金はある。

main_rule: >
  little は「ほとんど〜ない」という否定的な意味を持つ。
  a little は「少しはある」という肯定的な意味を持つ。
  どちらも不可算名詞に使う。
  little time は「時間がほとんどない」。
  a little time は「少し時間がある」。
  a があるかないかで、意味の向きが大きく変わる。

contrast_pairs:
  - negative: We have little time.
    positive: We have a little time.
    point: >
      little time は「時間がほとんどない」。
      a little time は「少し時間がある」。

  - negative: There is little water left.
    positive: There is a little water left.
    point: >
      little water は「水がほとんどない」。
      a little water は「水が少しはある」。

  - negative: He has little experience.
    positive: He has a little experience.
    point: >
      little experience は「経験がほとんどない」。
      a little experience は「少し経験がある」。

