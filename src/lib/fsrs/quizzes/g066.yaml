id: g066
file: g066.yaml

title: 制限用法 vs 非制限用法
type: grammar_contrast

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 名詞を絞り込むのか、補足説明を加えるのか？

core_concept:
  restrictive_relative:
    form: 先行詞 + 関係詞 ...
    meaning: どの人・どの物かを限定する
    image: 名詞を絞り込む
    examples:
      - sentence: Students who study every day improve quickly.
        ja: 毎日勉強する生徒は早く上達する。
        point: どの生徒かを who study every day が限定している。
      - sentence: The book which I bought yesterday is interesting.
        ja: 私が昨日買った本は面白い。
        point: どの本かを which I bought yesterday が限定している。
      - sentence: People who live here are friendly.
        ja: ここに住んでいる人々は親切だ。
        point: どの人々かを who live here が限定している。

  non_restrictive_relative:
    form: 先行詞, 関係詞 ...
    meaning: すでに特定されている名詞に補足説明を加える
    image: 名詞を絞り込まず、横から説明を足す
    examples:
      - sentence: My father, who lives in Tokyo, is a doctor.
        ja: 東京に住んでいる私の父は医者です。
        point: My father はすでに特定されており、who lives in Tokyo は補足説明。
      - sentence: This book, which I bought yesterday, is interesting.
        ja: 昨日買ったこの本は面白い。
        point: This book はすでに特定されており、which I bought yesterday は補足説明。
      - sentence: Ken, who speaks English well, helped us.
        ja: 英語を上手に話すケンが私たちを助けてくれた。
        point: Ken は固有名詞なので、関係詞節は補足説明になりやすい。

  that_not_in_non_restrictive:
    form: コンマ + who/which
    meaning: 非制限用法では that を普通使わない
    image: コンマの後の補足説明では who / which を使う
    examples:
      - sentence: My brother, who lives in Osaka, is a teacher.
        ja: 大阪に住んでいる私の兄は教師です。
        point: コンマつきの補足説明なので who を使う。
      - sentence: This camera, which I bought last year, is broken.
        ja: 昨年買ったこのカメラは壊れている。
        point: コンマつきの補足説明なので which を使う。
      - sentence: Tokyo, which is the capital of Japan, is a huge city.
        ja: 日本の首都である東京は大都市だ。
        point: コンマつきで補足しているので which を使う。

main_rule: >
  制限用法は、コンマなしで名詞を後ろから限定し、
  「どの人・どの物か」を絞り込む。
  Students who study every day は「毎日勉強する生徒」。
  非制限用法は、コンマを使って、すでに特定されている名詞に補足説明を加える。
  My father, who lives in Tokyo, ... は「私の父は、ちなみに東京に住んでいるが、...」という補足。
  非制限用法では、関係代名詞 that は普通使わず、who や which を使う。

contrast_pairs:
  - restrictive: My brother who lives in Osaka is a teacher.
    non_restrictive: My brother, who lives in Osaka, is a teacher.
    point: >
      コンマなしは「大阪に住んでいる兄」と兄弟の中から限定する。
      コンマありは「私の兄は、ちなみに大阪に住んでいるが」と補足する。

  - restrictive: The book which I bought yesterday is interesting.
    non_restrictive: This book, which I bought yesterday, is interesting.
    point: >
      The book which ... はどの本かを限定する。
      This book, which ... は、この本について補足説明を加える。

  - restrictive: People who live here are friendly.
    non_restrictive: Ken, who lives here, is friendly.
    point: >
      People who live here は人々を限定する。
      Ken はすでに特定されているので、who lives here は補足説明。

