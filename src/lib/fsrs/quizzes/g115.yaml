id: g115
file: g115.yaml

title: 接続詞と前置詞の使い分け
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 後ろに文が来るか名詞句が来るかを見て、接続詞と前置詞を使い分けられるか？

core_concept:
  conjunction_plus_clause:
    form: 接続詞 + 主語 + 動詞
    meaning: 〜なので、〜だけれども、〜している間に
    image: 接続詞は文と文をつなぐ
    examples:
      - sentence: I stayed home because it was raining.
        ja: 雨が降っていたので、私は家にいた。
        point: because の後ろは it was raining という文。
      - sentence: Although he was tired, he kept working.
        ja: 彼は疲れていたけれども、働き続けた。
        point: although の後ろは he was tired という文。
      - sentence: I read a book while I was waiting.
        ja: 待っている間、私は本を読んだ。
        point: while の後ろは I was waiting という文。

  preposition_plus_noun:
    form: 前置詞 + 名詞句
    meaning: 〜のために、〜にもかかわらず、〜の間に
    image: 前置詞は名詞句を後ろに取る
    examples:
      - sentence: I stayed home because of the rain.
        ja: 雨のために、私は家にいた。
        point: because of の後ろは the rain という名詞句。
      - sentence: Despite his tiredness, he kept working.
        ja: 疲労にもかかわらず、彼は働き続けた。
        point: despite の後ろは his tiredness という名詞句。
      - sentence: I read a book during the wait.
        ja: 待ち時間の間、私は本を読んだ。
        point: during の後ろは the wait という名詞句。

  because_vs_because_of:
    form: because + 文 / because of + 名詞句
    meaning: 〜なので / 〜のために
    image: 理由を文で言うか、名詞句で言うか
    examples:
      - sentence: The game was canceled because it rained.
        ja: 雨が降ったので、その試合は中止された。
        point: because の後ろは it rained という文。
      - sentence: The game was canceled because of the rain.
        ja: 雨のために、その試合は中止された。
        point: because of の後ろは the rain という名詞句。
      - sentence: She was late because of the traffic.
        ja: 交通渋滞のため、彼女は遅れた。
        point: the traffic は名詞句なので because of。

  although_vs_despite:
    form: although + 文 / despite + 名詞句・動名詞
    meaning: 〜だけれども / 〜にもかかわらず
    image: 譲歩を文で言うか、名詞句で言うか
    examples:
      - sentence: Although it was raining, we went out.
        ja: 雨が降っていたけれども、私たちは外出した。
        point: although の後ろは it was raining という文。
      - sentence: Despite the rain, we went out.
        ja: 雨にもかかわらず、私たちは外出した。
        point: despite の後ろは the rain という名詞句。
      - sentence: Despite being tired, he kept working.
        ja: 疲れていたにもかかわらず、彼は働き続けた。
        point: despite の後ろに動詞を置くなら動名詞 being。

  while_vs_during:
    form: while + 文 / during + 名詞句
    meaning: 〜している間に / 〜の間に
    image: 時間を文で言うか、名詞句で言うか
    examples:
      - sentence: I read a book while I was waiting.
        ja: 待っている間、私は本を読んだ。
        point: while の後ろは I was waiting という文。
      - sentence: I read a book during the meeting.
        ja: 会議の間、私は本を読んだ。
        point: during の後ろは the meeting という名詞句。
      - sentence: Please be quiet while I am speaking.
        ja: 私が話している間は静かにしてください。
        point: while の後ろは文。

  until_vs_by:
    form: until + 時点 / by + 時点
    meaning: 〜までずっと / 〜までに
    image: until は継続、by は期限
    examples:
      - sentence: I studied until midnight.
        ja: 私は真夜中まで勉強した。
        point: until は真夜中まで勉強が続いたことを表す。
      - sentence: Please finish this by Friday.
        ja: 金曜日までにこれを終えてください。
        point: by は完了の期限を表す。
      - sentence: Wait here until I come back.
        ja: 私が戻るまでここで待っていてください。
        point: until の後ろには文も置ける。

main_rule: >
  英語では、後ろに文が来るか名詞句が来るかで、使う語が変わる。
  because / although / while などは接続詞なので、後ろに主語＋動詞を含む文を取る。
  I stayed home because it was raining. では、because の後ろに it was raining という文が来ている。
  because of / despite / during などは前置詞なので、後ろに名詞句を取る。
  I stayed home because of the rain. では、because of の後ろに the rain という名詞句が来ている。
  動詞を前置詞の後ろに置く場合は、despite being tired / for cutting paper のように動名詞にする。
  また、until と by はどちらも「まで」と訳されることがあるが、
  until は「その時までずっと続く」、by は「その時までに完了する」という違いがある。
  まず後ろの形を見る。文なら接続詞、名詞句なら前置詞を選ぶ。

contrast_pairs:
  - conjunction: I stayed home because it was raining.
    preposition: I stayed home because of the rain.
    point: >
      because の後ろは文。
      because of の後ろは名詞句。

  - conjunction: Although he was tired, he kept working.
    preposition: Despite being tired, he kept working.
    point: >
      although の後ろは文。
      despite の後ろに動詞を置くなら動名詞にする。

  - conjunction: I read a book while I was waiting.
    preposition: I read a book during the meeting.
    point: >
      while の後ろは文。
      during の後ろは名詞句。

  - until: I studied until midnight.
    by: Please finish this by Friday.
    point: >
      until は継続の終点。
      by は完了の期限。

