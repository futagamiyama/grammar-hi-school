common_mistakes:
  - mistake: 日本語の「に」「で」だけで at / on / in を決める
    correction: >
      日本語訳では区別しにくい。
      at は点、on は面・接触、in は空間・範囲で考える。
  - mistake: 時刻に in を使ってしまう
    correction: >
      時刻は時間上の一点なので at。
      at 9:00 / at noon の形。
  - mistake: 曜日や日付に in を使ってしまう
    correction: >
      曜日・日付・特定の日には on。
      on Monday / on July 10 / on a rainy day。
  - mistake: 月・年・季節に on を使ってしまう
    correction: >
      月・年・季節・長い期間には in。
      in April / in 2010 / in summer。
  - mistake: at the station と in the station を完全に同じだと思う
    correction: >
      at the station は駅を地点として見る。
      in the station は駅の建物内部を強調する。
  - mistake: on と in を「上」と「中」だけで機械的に訳す
    correction: >
      on は接触・線上、in は範囲の中。
      on the river / in Tokyo のような用法もある。

learning_notes:
  - >
    at / on / in の基本イメージは、点・面・空間。
  - >
    時間では、at は時刻、on は曜日・日付、in は月・年・季節・長い期間。
  - >
    場所では、at は地点、on は表面・接触、in は内部・範囲。
  - >
    at the station は地点としての駅。
    in the station は駅の建物の中。
  - >
    日本語の「に」「で」ではなく、英語側の空間イメージで選ぶ。

