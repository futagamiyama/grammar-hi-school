id: g117
file: g117.yaml

title: 前置詞 at / on / in の時・場所
type: grammar_contrast

section:
  id: s12
  title: 前置詞

level: basic
target: 高校英文法基礎

core_question: at / on / in を、時と場所の「点・面・空間」のイメージで使い分けられるか？

core_concept:
  at_time_point:
    form: at + 時刻・特定の時点
    meaning: 〜時に、〜という時点で
    image: 時間上の一点
    examples:
      - sentence: The meeting starts at 9:00.
        ja: 会議は9時に始まります。
        point: 9:00 は時間上の一点なので at。
      - sentence: I usually wake up at six.
        ja: 私はたいてい6時に起きます。
        point: 時刻を表すので at。
      - sentence: She arrived at noon.
        ja: 彼女は正午に到着した。
        point: noon は特定の時点なので at。

  on_time_day:
    form: on + 曜日・日付・特定の日
    meaning: 〜曜日に、〜日に
    image: カレンダー上の一日
    examples:
      - sentence: I have a test on Monday.
        ja: 私は月曜日にテストがあります。
        point: Monday は曜日なので on。
      - sentence: The concert is on July 10.
        ja: そのコンサートは7月10日にあります。
        point: 日付を表すので on。
      - sentence: We met on a rainy day.
        ja: 私たちは雨の日に会った。
        point: a rainy day は特定の日なので on。

  in_time_period:
    form: in + 月・年・季節・長い期間
    meaning: 〜月に、〜年に、〜の間に
    image: 時間の広がりの中
    examples:
      - sentence: I was born in 2010.
        ja: 私は2010年に生まれました。
        point: 年という期間の中なので in。
      - sentence: School starts in April.
        ja: 学校は4月に始まります。
        point: 月を表すので in。
      - sentence: It is hot in summer.
        ja: 夏は暑い。
        point: 季節という期間なので in。

  at_place_point:
    form: at + 場所・地点
    meaning: 〜で、〜に
    image: 地図上の一点・活動の場所
    examples:
      - sentence: I met him at the station.
        ja: 私は駅で彼に会った。
        point: the station を地点として見ているので at。
      - sentence: She is waiting at the bus stop.
        ja: 彼女はバス停で待っている。
        point: bus stop は地点なので at。
      - sentence: He is at school.
        ja: 彼は学校にいます。
        point: school を活動の場所として見ている。

  on_place_surface:
    form: on + 面・線・接触している場所
    meaning: 〜の上に、〜に接して
    image: 表面に接している
    examples:
      - sentence: The book is on the desk.
        ja: その本は机の上にあります。
        point: 机の表面に接しているので on。
      - sentence: There is a picture on the wall.
        ja: 壁に絵があります。
        point: 壁の表面に接しているので on。
      - sentence: The town is on the river.
        ja: その町は川沿いにあります。
        point: 川という線に接しているイメージ。

  in_place_space:
    form: in + 空間・範囲・内部
    meaning: 〜の中に、〜で
    image: 立体的な空間や範囲の中
    examples:
      - sentence: The keys are in the bag.
        ja: 鍵はバッグの中にあります。
        point: バッグの内部なので in。
      - sentence: He lives in Tokyo.
        ja: 彼は東京に住んでいます。
        point: 東京という範囲の中なので in。
      - sentence: There are many fish in the lake.
        ja: 湖にはたくさんの魚がいます。
        point: 湖の中なので in。

main_rule: >
  at / on / in は、時と場所の両方で使う基本前置詞。
  中心イメージは、at が点、on が面・接触、in が空間・範囲。
  時間では、at は時刻や特定の時点に使う。
  at 9:00 / at noon の形。
  on は曜日・日付・特定の日に使う。
  on Monday / on July 10 / on a rainy day の形。
  in は月・年・季節・長い期間に使う。
  in April / in 2010 / in summer の形。
  場所では、at は地点や活動の場所、
  on は表面・線・接触、
  in は内部・空間・範囲を表す。
  at the station, on the desk, in the room の違いを、
  「点・面・空間」として考えると整理しやすい。

contrast_pairs:
  - at_time: at 9:00
    on_time: on Monday
    in_time: in April
    point: >
      at は時刻という一点。
      on は曜日・日付という一日。
      in は月・年・季節という期間。

  - at_place: at the station
    in_place: in the station
    point: >
      at the station は駅を地点・待ち合わせ場所として見る。
      in the station は駅の建物の中にいることを強調する。

  - on_place: on the desk
    in_place: in the desk
    point: >
      on the desk は机の上。
      in the desk は机の引き出しなど内部。

