id: g077
file: g077.yaml

title: If it were not for / If it had not been for
type: grammar_contrast

section:
  id: s09
  title: 仮定法

level: basic
target: 高校英文法基礎

core_question: 「〜がなければ」「〜がなかったなら」を現在と過去で使い分けられるか？

core_concept:
  if_it_were_not_for:
    form: If it were not for + 名詞, 主語 + would/could/might + 動詞原形 ...
    meaning: もし今〜がなければ、...だろうに
    image: 現在あるもの・人・条件がない世界を仮定する
    examples:
      - sentence: If it were not for water, we could not live.
        ja: もし水がなければ、私たちは生きられないだろう。
        point: 現在ある水がない世界を仮定している。
      - sentence: If it were not for your help, I could not finish this work.
        ja: もしあなたの助けがなければ、私はこの仕事を終えられないだろう。
        point: 今の助けがない場合を仮定している。
      - sentence: If it were not for music, my life would be boring.
        ja: もし音楽がなければ、私の人生は退屈だろう。
        point: 現在ある音楽がない世界を仮定している。

  if_it_had_not_been_for:
    form: If it had not been for + 名詞, 主語 + would/could/might have + 過去分詞 ...
    meaning: もし過去に〜がなかったなら、...だっただろうに
    image: 過去に実際にあったもの・人・条件がなかった世界を仮定する
    examples:
      - sentence: If it had not been for your help, I would have failed.
        ja: もしあなたの助けがなかったなら、私は失敗していただろう。
        point: 実際には過去に助けがあった。
      - sentence: If it had not been for the rain, we would have gone out.
        ja: もし雨がなかったなら、私たちは外出していただろう。
        point: 実際には過去に雨が降った。
      - sentence: If it had not been for his advice, I could not have solved the problem.
        ja: もし彼の助言がなかったなら、私はその問題を解けなかっただろう。
        point: 実際には過去に助言があった。

  without_but_for:
    form: Without / But for + 名詞
    meaning: 〜がなければ、〜がなかったなら
    image: If it were not for / If it had not been for の短い形
    examples:
      - sentence: Without water, we could not live.
        ja: 水がなければ、私たちは生きられないだろう。
        point: Without water = If it were not for water。
      - sentence: Without your help, I would have failed.
        ja: あなたの助けがなかったなら、私は失敗していただろう。
        point: would have failed から過去の非現実。
      - sentence: But for his advice, I could not have solved the problem.
        ja: 彼の助言がなかったなら、私はその問題を解けなかっただろう。
        point: But for は Without と同じく「〜がなければ」。

main_rule: >
  If it were not for + 名詞 は、「もし今〜がなければ」を表す。
  現在の事実に反する仮定なので、結果は would/could/might + 動詞原形になる。
  If it were not for water, we could not live. は
  「もし水がなければ、私たちは生きられないだろう」という意味。
  If it had not been for + 名詞 は、「もし過去に〜がなかったなら」を表す。
  過去の事実に反する仮定なので、結果は would/could/might have + 過去分詞になる。
  Without / But for + 名詞 も、同じ意味を短く表せる。
  結果節が would be なら現在、would have been なら過去と判断する。

contrast_pairs:
  - present_unreal: If it were not for water, we could not live.
    past_unreal: If it had not been for your help, I would have failed.
    point: >
      If it were not for は現在あるものがない場合の仮定。
      If it had not been for は過去にあったものがなかった場合の仮定。

  - full_form: If it were not for music, my life would be boring.
    short_form: Without music, my life would be boring.
    point: >
      Without music は If it were not for music と近い。
      結果が would be なので現在の非現実。

  - full_form: If it had not been for his advice, I could not have solved it.
    short_form: But for his advice, I could not have solved it.
    point: >
      But for his advice は If it had not been for his advice と近い。
      could not have solved なので過去の非現実。

