common_mistakes:
  - mistake: If it were not for と If it had not been for を同じ時制で使ってしまう
    correction: >
      If it were not for は現在の非現実。
      If it had not been for は過去の非現実。
  - mistake: If it had not been for の結果節を would + 原形にしてしまう
    correction: >
      過去の非現実なので would/could/might have + 過去分詞を使う。
      would have failed, could have solved など。
  - mistake: If it were not for の結果節を would have + 過去分詞にしてしまう
    correction: >
      現在の非現実なら would/could/might + 動詞原形。
      would be, could live, could finish など。
  - mistake: Without を単なる「〜なしで」とだけ読む
    correction: >
      Without + 名詞 は、仮定法の If it were not for / If it had not been for と同じ意味で使われることがある。
  - mistake: But for を「しかし」と読んでしまう
    correction: >
      But for + 名詞 は「〜がなければ」という意味。
      Without と近い硬い表現。

learning_notes:
  - >
    If it were not for + 名詞 は「もし今〜がなければ」。
    現在の非現実を表す。
  - >
    If it had not been for + 名詞 は「もし過去に〜がなかったなら」。
    過去の非現実を表す。
  - >
    Without / But for + 名詞 は、同じ内容を短く表せる。
    後ろの would be / would have been で時を判断する。
  - >
    結果節が would/could + 原形なら現在。
    would/could have + 過去分詞なら過去。

