common_mistakes:
- mistake: must と have to をどちらも「〜しなければならない」とだけ覚える
  correction: must は話し手の判断・決意、have to は規則・状況など外部事情による必要を表すことが多い。
- mistake: have to を助動詞と同じように三単現でも have to のまま使う
  correction: '主語が三人称単数なら has to になる。例: She has to take this medicine.'
- mistake: must の否定 must not と have to の否定 do not have to を同じ意味だと思う
  correction: must not は禁止、do not have to は不要。この違いは g023 で扱う。
learning_notes:
- 肯定文の must と have to は意味が重なることもある。試験用には、文脈が「話し手の判断」か「外部事情」かを見る。
- must は強い勧めにも使える。You must try this. は「ぜひ試して」という意味になる。
- have to は普通の動詞 have を含む形なので、三単現では has to、過去では had to になる。
- 否定形の must not と do not have to は意味が大きく違うため、別カードで扱う。
