id: g022
file: g022.yaml
title: must vs have to
type: grammar_contrast
section:
  id: s03
  title: 助動詞・法
level: basic
target: 高校英文法基礎
core_question: 話し手の判断による義務か、外部事情による必要か？
core_concept:
  must:
    form: must + 動詞の原形
    meaning: 話し手が強く必要だと判断している義務・決意・強い勧めを表す
    image: 自分の判断として、どうしても必要だと思っている
    examples:
    - sentence: I must apologize to her.
      ja: 私は彼女に謝らなければならない。
      point: 話し手自身が、謝る必要があると強く感じている。
    - sentence: You must try this cake.
      ja: このケーキをぜひ食べてみて。
      point: 相手への強い勧めを表している。
    - sentence: I must stop wasting money.
      ja: 私はお金を無駄遣いするのをやめなければならない。
      point: 自分の決意・内側からの必要性を表している。
  have_to:
    form: have to + 動詞の原形
    meaning: 規則・状況・他人の指示など、外部事情による必要を表す
    image: 自分の気持ちとは別に、そうする必要がある
    examples:
    - sentence: We have to wear helmets in this factory.
      ja: この工場ではヘルメットを着用しなければならない。
      point: 工場の規則による必要を表している。
    - sentence: I have to work late tonight.
      ja: 私は今夜、遅くまで働かなければならない。
      point: 仕事や状況による必要を表している。
    - sentence: Passengers have to show their passports.
      ja: 乗客はパスポートを提示しなければならない。
      point: 手続き・規則による必要を表している。
main_rule: must は、話し手が「これは必要だ」と強く判断している時に使う。have to は、規則・状況・他人の指示など、外部から来る必要を表すことが多い。ただし肯定文では意味が重なることも多く、文脈から自然な方を選ぶ。
contrast_pairs:
- must: I must call my mother. I almost forgot.
  have_to: I have to call my boss at 3:00.
  point: must は自分の強い必要感、have to は予定・仕事上の必要を表す。
- must: You must read this book.
  have_to: Students have to read this book for class.
  point: must は強い勧め、have to は授業上の義務を表す。
- must: I must stop eating so much sugar.
  have_to: I have to stop eating sugar because of my doctor’s advice.
  point: must は自分の決意、have to は医師の指示による必要を表す。
