id: g061
file: g061.yaml

title: 関係代名詞 who / which
type: grammar_contrast

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 説明される名詞が人か、物・動物かを判断できるか？

core_concept:
  who:
    form: 人 + who + 動詞 ...
    meaning: 〜する人、〜である人
    image: 前の人を、後ろの文で説明する
    examples:
      - sentence: I know a boy who lives in Osaka.
        ja: 私は大阪に住んでいる少年を知っている。
        point: a boy は人なので who を使う。
      - sentence: The woman who teaches English is my aunt.
        ja: 英語を教えている女性は私のおばです。
        point: The woman を who teaches English が説明している。
      - sentence: Students who study every day improve quickly.
        ja: 毎日勉強する生徒は早く上達する。
        point: Students は人なので who を使う。

  which:
    form: 物・動物 + which + 動詞 ...
    meaning: 〜する物、〜である物・動物
    image: 前の物・動物を、後ろの文で説明する
    examples:
      - sentence: I have a book which explains grammar clearly.
        ja: 私は文法をわかりやすく説明している本を持っている。
        point: a book は物なので which を使う。
      - sentence: The dog which lives next door is very friendly.
        ja: 隣に住んでいる犬はとても人なつこい。
        point: The dog は動物なので which を使う。
      - sentence: This is a machine which makes bread.
        ja: これはパンを作る機械です。
        point: a machine は物なので which を使う。

main_rule: >
  関係代名詞は、前にある名詞を後ろから説明する語。
  説明される名詞を先行詞という。
  先行詞が人なら who、物・動物なら which を使うのが基本。
  a boy who lives in Osaka は「大阪に住んでいる少年」。
  a book which explains grammar は「文法を説明している本」。
  まずは関係代名詞の後ろの文よりも、
  その前にある名詞が人か物かを見る。

contrast_pairs:
  - person: I know a boy who lives in Osaka.
    thing: I have a book which explains grammar.
    point: >
      a boy は人なので who。
      a book は物なので which。

  - person: The woman who teaches English is my aunt.
    thing: The school which stands on the hill is old.
    point: >
      The woman は人なので who。
      The school は物・場所なので which。

  - person: Students who study hard pass the test.
    animal_or_thing: The dog which lives next door is friendly.
    point: >
      Students は人なので who。
      The dog は動物なので which を使うのが基本。

