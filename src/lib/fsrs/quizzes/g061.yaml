common_mistakes:
  - mistake: 関係代名詞の後ろだけを見て who / which を選ぶ
    correction: >
      まず関係代名詞の前にある先行詞を見る。
      先行詞が人なら who、物・動物なら which が基本。
  - mistake: book や school に who を使ってしまう
    correction: >
      book, school, bus, camera などは人ではない。
      which を使う。
  - mistake: people に which を使ってしまう
    correction: >
      people は人なので who を使う。
      The people who live here ... が自然。
  - mistake: 関係代名詞を「接続詞」とだけ考える
    correction: >
      関係代名詞は、前の名詞を後ろから説明する語。
      a boy who lives in Osaka は「大阪に住んでいる少年」。
  - mistake: 動物には必ず who を使うと思う
    correction: >
      動物は基本的には which。
      ただし、ペットなどを人のように扱う場合に who が使われることもある。

learning_notes:
  - >
    関係代名詞は、名詞を後ろから説明する仕組み。
    日本語では前から訳すことが多い。
  - >
    先行詞が人なら who、物・動物なら which。
    まずこの基本を反射的に判断できるようにする。
  - >
    who lives in Osaka は「大阪に住んでいる」。
    which explains grammar は「文法を説明している」。
  - >
    that も人・物の両方に使えるが、このカードでは who / which の基本対立に集中する。

