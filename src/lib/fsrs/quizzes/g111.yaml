id: g111
file: g111.yaml

title: 接続詞 as の用法
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 接続詞 as を、時・理由・様態・変化の文脈に応じて読めるか？

core_concept:
  as_time:
    form: as + 主語 + 動詞
    meaning: 〜するとき、〜しながら
    image: 二つの出来事がほぼ同時に起こる
    examples:
      - sentence: As I opened the door, the phone rang.
        ja: 私がドアを開けた時、電話が鳴った。
        point: ドアを開ける動作と電話が鳴る出来事がほぼ同時。
      - sentence: She smiled as she listened to the music.
        ja: 彼女は音楽を聴きながら微笑んだ。
        point: smiled と listened が同時に進んでいる。
      - sentence: As we walked along the river, we talked about school.
        ja: 川沿いを歩きながら、私たちは学校について話した。
        point: 歩くことと話すことが同時に行われている。

  as_reason:
    form: as + 主語 + 動詞
    meaning: 〜なので、〜だから
    image: 背景事情として理由を添える
    examples:
      - sentence: As it was late, we went home.
        ja: 遅かったので、私たちは家に帰った。
        point: 遅かったことを理由として前に出している。
      - sentence: As I was tired, I went to bed early.
        ja: 疲れていたので、私は早く寝た。
        point: 疲れていたことを背景事情として示している。
      - sentence: As she had no money, she could not buy the ticket.
        ja: お金がなかったので、彼女はその切符を買えなかった。
        point: お金がなかったことが理由。

  as_manner:
    form: as + 主語 + 動詞
    meaning: 〜するように、〜した通りに
    image: やり方・方法を示す
    examples:
      - sentence: Do as I say.
        ja: 私の言う通りにしなさい。
        point: as I say で「私が言うように」。
      - sentence: Leave the room as you found it.
        ja: 部屋を見つけた時のままにしておきなさい。
        point: as you found it で「あなたが見つけた通りに」。
      - sentence: Write the answer as the teacher showed you.
        ja: 先生が示した通りに答えを書きなさい。
        point: as the teacher showed you で方法を表す。

  as_change:
    form: as + 主語 + 動詞 比較級
    meaning: 〜するにつれて
    image: 一方の変化に合わせて、もう一方も変化する
    examples:
      - sentence: As he grew older, he became wiser.
        ja: 彼は年を取るにつれて、より賢くなった。
        point: 年を取る変化と賢くなる変化が連動している。
      - sentence: As the city grew, traffic became worse.
        ja: その都市が大きくなるにつれて、交通は悪化した。
        point: 都市の成長と交通の悪化が並行している。
      - sentence: As time passed, she felt better.
        ja: 時間がたつにつれて、彼女は気分がよくなった。
        point: 時間の経過と状態の変化を表す。

  as_vs_like:
    form: as + 文 / like + 名詞句
    meaning: 〜するように / 〜のように
    image: as は接続詞として文を取り、like は前置詞として名詞句を取る
    examples:
      - sentence: Do as I do.
        ja: 私がするようにしなさい。
        point: as の後ろに I do という文が来ている。
      - sentence: He talks like a teacher.
        ja: 彼は先生のように話す。
        point: like の後ろは名詞句 a teacher。
      - sentence: She sings like a professional singer.
        ja: 彼女はプロ歌手のように歌う。
        point: like の後ろは名詞句。

main_rule: >
  as は、文脈によって複数の意味を持つ接続詞。
  時を表す場合は「〜するとき」「〜しながら」。
  As I opened the door, the phone rang. は、
  ドアを開けたことと電話が鳴ったことがほぼ同時に起きたことを表す。
  理由を表す場合は「〜なので」。
  As it was late, we went home. は、遅かったことを理由として示す。
  様態を表す場合は「〜するように」「〜した通りに」。
  Do as I say. は「私の言う通りにしなさい」。
  変化を表す場合は「〜するにつれて」。
  As he grew older, he became wiser. は、年を取る変化と賢くなる変化が連動している。
  また、as は接続詞として後ろに文を取る。
  like は前置詞として後ろに名詞句を取るのが基本。
  Do as I do. と He talks like a teacher. の違いに注意する。

contrast_pairs:
  - time: As I opened the door, the phone rang.
    reason: As it was late, we went home.
    point: >
      as は同じ形でも、文脈によって時にも理由にもなる。
      同時性なら「〜するとき」、理由なら「〜なので」と読む。

  - manner: Do as I say.
    comparison: He talks like a teacher.
    point: >
      as は後ろに文を取って「〜するように」。
      like は後ろに名詞句を取って「〜のように」。

  - change: As he grew older, he became wiser.
    time: She smiled as she listened to the music.
    point: >
      as + 変化の文脈では「〜するにつれて」。
      同時進行の動作では「〜しながら」。

