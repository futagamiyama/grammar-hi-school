review_questions:
  - id: g111_q001
    question_type: two_choice
    prompt: As I opened the door, the phone rang.
    choices:
      - text: 時を表す as
        correct: true
      - text: 理由を表す as
        correct: false
    answer: 時を表す as
    explanation: >
      ドアを開けたことと電話が鳴ったことがほぼ同時に起きている。
      ここでの as は「〜するとき」。
    translation: 私がドアを開けた時、電話が鳴った。
    focus:
      - as_time
      - simultaneous
      - opened

  - id: g111_q002
    question_type: two_choice
    prompt: She smiled as she listened to the music.
    choices:
      - text: 〜しながら
        correct: true
      - text: 〜なので
        correct: false
    answer: 〜しながら
    explanation: >
      smiled と listened が同時に進んでいる。
      as はここでは「〜しながら」と読む。
    translation: 彼女は音楽を聴きながら微笑んだ。
    focus:
      - as_time
      - while
      - listened

  - id: g111_q003
    question_type: two_choice
    prompt: As we walked along the river, we talked about school.
    choices:
      - text: 歩きながら
        correct: true
      - text: 歩いたので
        correct: false
    answer: 歩きながら
    explanation: >
      walked と talked が同時に行われている。
      ここでは as を「〜しながら」と読む。
    translation: 川沿いを歩きながら、私たちは学校について話した。
    focus:
      - as_time
      - simultaneous_action
      - walked

  - id: g111_q004
    question_type: two_choice
    prompt: As it was late, we went home.
    choices:
      - text: 理由を表す as
        correct: true
      - text: 様態を表す as
        correct: false
    answer: 理由を表す as
    explanation: >
      遅かったことが、家に帰った理由になっている。
      as はここでは「〜なので」。
    translation: 遅かったので、私たちは家に帰った。
    focus:
      - as_reason
      - because
      - late

  - id: g111_q005
    question_type: two_choice
    prompt: As I was tired, I went to bed early.
    choices:
      - text: 疲れていたので
        correct: true
      - text: 疲れているように
        correct: false
    answer: 疲れていたので
    explanation: >
      疲れていたことが、早く寝た理由になっている。
      ここでの as は理由を表す。
    translation: 疲れていたので、私は早く寝た。
    focus:
      - as_reason
      - tired
      - reason

  - id: g111_q006
    question_type: two_choice
    prompt: As she had no money, she could not buy the ticket.
    choices:
      - text: お金がなかったので
        correct: true
      - text: お金があるように
        correct: false
    answer: お金がなかったので
    explanation: >
      お金がなかったことが、切符を買えなかった理由。
      as は理由の「〜なので」。
    translation: お金がなかったので、彼女はその切符を買えなかった。
    focus:
      - as_reason
      - no_money
      - could_not_buy

  - id: g111_q007
    question_type: two_choice
    prompt: Do ___ I say.
    choices:
      - text: as
        correct: true
      - text: like
        correct: false
    answer: as
    explanation: >
      I say は文。
      as I say で「私の言うように」「私の言う通りに」という意味。
    translation: 私の言う通りにしなさい。
    focus:
      - as_manner
      - do_as_i_say
      - clause

  - id: g111_q008
    question_type: two_choice
    prompt: Leave the room ___ you found it.
    choices:
      - text: as
        correct: true
      - text: like
        correct: false
    answer: as
    explanation: >
      you found it は文。
      as you found it で「あなたが見つけた時の通りに」。
    translation: 部屋を見つけた時のままにしておきなさい。
    focus:
      - as_manner
      - as_you_found_it
      - manner

  - id: g111_q009
    question_type: two_choice
    prompt: As he grew older, he became wiser.
    choices:
      - text: 〜するにつれて
        correct: true
      - text: 〜なので
        correct: false
    answer: 〜するにつれて
    explanation: >
      年を取る変化と、賢くなる変化が連動している。
      as はここでは「〜するにつれて」。
    translation: 彼は年を取るにつれて、より賢くなった。
    focus:
      - as_change
      - grew_older
      - became_wiser

  - id: g111_q010
    question_type: two_choice
    prompt: As the city grew, traffic became worse.
    choices:
      - text: その都市が大きくなるにつれて
        correct: true
      - text: その都市が大きかったので
        correct: false
    answer: その都市が大きくなるにつれて
    explanation: >
      都市の成長と交通の悪化が並行している。
      as は変化の「〜するにつれて」を表す。
    translation: その都市が大きくなるにつれて、交通は悪化した。
    focus:
      - as_change
      - city_grew
      - traffic

  - id: g111_q011
    question_type: two_choice
    prompt: Do ___ I do.
    choices:
      - text: as
        correct: true
      - text: like
        correct: false
    answer: as
    explanation: >
      I do は文。
      接続詞として文を取るので as を使う。
      Do as I do. で「私がするようにしなさい」。
    translation: 私がするようにしなさい。
    focus:
      - as_vs_like
      - clause
      - do_as

  - id: g111_q012
    question_type: two_choice
    prompt: He talks ___ a teacher.
    choices:
      - text: like
        correct: true
      - text: as
        correct: false
    answer: like
    explanation: >
      a teacher は名詞句。
      「先生のように」と名詞句を後ろに取るので like を使う。
    translation: 彼は先生のように話す。
    focus:
      - as_vs_like
      - like_noun
      - teacher

common_mistakes:
  - mistake: as を一つの日本語だけで覚える
    correction: >
      as は「〜するとき」「〜なので」「〜するように」「〜するにつれて」など、
      文脈によって意味が変わる。
  - mistake: as を理由の意味だけで読む
    correction: >
      As I opened the door, the phone rang. の as は時。
      As he grew older, he became wiser. の as は変化。
  - mistake: Do like I say. としてしまう
    correction: >
      標準的には、後ろに文を取るなら Do as I say.。
      like は基本的に名詞句を後ろに取る。
  - mistake: as + 名詞句 と like + 文を混同する
    correction: >
      基本形として、as + 文、like + 名詞句をまず覚える。
  - mistake: As he grew older を「年を取ったので」と読む
    correction: >
      grow older / become wiser のような変化が並ぶ場合、
      as は「〜するにつれて」と読むのが自然。

learning_notes:
  - >
    as は多義語なので、直後の形だけでなく、前後の関係を見る。
  - >
    同時に起こる出来事なら「〜するとき」「〜しながら」。
  - >
    理由になっていれば「〜なので」。
    because より背景事情を添える感じがある。
  - >
    やり方を示していれば「〜するように」「〜した通りに」。
    Do as I say. は基本表現。
  - >
    変化が並ぶ時は「〜するにつれて」。
    As he grew older, he became wiser. を基本形として覚える。

