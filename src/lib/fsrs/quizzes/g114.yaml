id: g114
file: g114.yaml

title: 接続副詞 however / therefore / moreover / otherwise
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 接続副詞 however / therefore / moreover / otherwise の意味と、等位接続詞との違いを判断できるか？

core_concept:
  however_contrast:
    form: 文. However, 文.
    meaning: しかしながら
    image: 前の文と反対・対比の内容を後ろに置く
    examples:
      - sentence: The plan was simple. However, it failed.
        ja: その計画は単純だった。しかしながら、失敗した。
        point: however は前の文と後ろの文を対比させる接続副詞。
      - sentence: I wanted to join them. However, I was too busy.
        ja: 私は彼らに加わりたかった。しかし、忙しすぎた。
        point: 行きたい気持ちと実際の状況を対比している。
      - sentence: The test was difficult. However, many students passed it.
        ja: そのテストは難しかった。しかし、多くの生徒が合格した。
        point: 難しいのに合格者が多いという対比。

  therefore_result:
    form: 文. Therefore, 文.
    meaning: したがって、それゆえ
    image: 前の内容から論理的な結論を出す
    examples:
      - sentence: It was raining. Therefore, the game was canceled.
        ja: 雨が降っていた。したがって、その試合は中止された。
        point: 雨から試合中止という結論を導いている。
      - sentence: He did not study. Therefore, he failed the test.
        ja: 彼は勉強しなかった。したがって、テストに落ちた。
        point: 原因から結果を述べている。
      - sentence: The data is incomplete. Therefore, we cannot draw a conclusion.
        ja: データは不完全だ。したがって、結論は出せない。
        point: therefore は論理的な結果・結論を示す。

  moreover_addition:
    form: 文. Moreover, 文.
    meaning: さらに、その上
    image: 前の内容に追加情報を加える
    examples:
      - sentence: The hotel is cheap. Moreover, it is close to the station.
        ja: そのホテルは安い。さらに、駅に近い。
        point: 安いことに加えて、駅に近い情報を加えている。
      - sentence: She is kind. Moreover, she is very reliable.
        ja: 彼女は親切だ。さらに、とても信頼できる。
        point: 性質を追加して評価を強めている。
      - sentence: The method is simple. Moreover, it saves time.
        ja: その方法は単純だ。さらに、時間を節約できる。
        point: 追加の利点を述べている。

  otherwise_warning:
    form: 命令文, or/otherwise 文
    meaning: さもないと、そうでなければ
    image: 前の条件を満たさない場合の悪い結果を示す
    examples:
      - sentence: Hurry up. Otherwise, you will miss the train.
        ja: 急ぎなさい。さもないと電車に乗り遅れます。
        point: 急がない場合の結果を otherwise で示している。
      - sentence: Follow the rules. Otherwise, you will be punished.
        ja: 規則に従いなさい。さもないと罰せられます。
        point: 規則に従わない場合の結果。
      - sentence: Take an umbrella. Otherwise, you may get wet.
        ja: 傘を持って行きなさい。さもないと濡れるかもしれません。
        point: そうしない場合の結果を表す。

  conjunctive_adverb_vs_conjunction:
    form: 文. However/Therefore/Moreover/Otherwise, 文.
    meaning: 接続副詞は文を意味的につなぐが、単独で接続詞にはならない
    image: 接続副詞は文法上は副詞なので、文と文を直接つなぎにくい
    examples:
      - sentence: I was tired, so I went home.
        ja: 私は疲れていたので、家に帰った。
        point: so は等位接続詞として文をつなげる。
      - sentence: I was tired. Therefore, I went home.
        ja: 私は疲れていた。したがって、家に帰った。
        point: therefore は接続副詞なので、新しい文で使うのが基本。
      - sentence: I wanted to go, but I stayed home.
        ja: 私は行きたかったが、家にいた。
        point: but は等位接続詞として文をつなげる。

main_rule: >
  however, therefore, moreover, otherwise は接続副詞。
  文と文を意味の上でつなぐが、and / but / or / so のような等位接続詞とは違う。
  however は「しかしながら」で、前の内容と対比する。
  therefore は「したがって」で、前の内容から結果・結論を出す。
  moreover は「さらに」で、追加情報を加える。
  otherwise は「さもないと」「そうでなければ」で、前の条件を満たさない場合の結果を示す。
  入試では、however と but、therefore と so、moreover と and、otherwise と or の違いが狙われやすい。
  I was tired, so I went home. の so は等位接続詞として文を直接つなげる。
  I was tired. Therefore, I went home. の therefore は接続副詞として、普通は新しい文やセミコロンの後で使う。
  意味だけでなく、文法上の働きにも注意する。

contrast_pairs:
  - conjunction: I was tired, so I went home.
    conjunctive_adverb: I was tired. Therefore, I went home.
    point: >
      so は等位接続詞。
      therefore は接続副詞。
      意味は近いが、文法上の扱いが違う。

  - conjunction: I wanted to go, but I stayed home.
    conjunctive_adverb: I wanted to go. However, I stayed home.
    point: >
      but は文を直接つなぐ等位接続詞。
      however は接続副詞で、新しい文として使うのが基本。

  - conjunction: Hurry up, or you will miss the train.
    conjunctive_adverb: Hurry up. Otherwise, you will miss the train.
    point: >
      or は命令文の後で「さもないと」。
      otherwise も同じ意味を表せるが、接続副詞として使う。

