      - text: Therefore
        correct: false
    answer: Moreover
    explanation: >
      親切であることに加えて、信頼できるという情報を足している。
      追加を表す moreover が自然。
    translation: 彼女は親切だ。さらに、とても信頼できる。
    focus:
