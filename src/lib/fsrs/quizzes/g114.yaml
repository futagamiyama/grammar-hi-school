    answer: Moreover
    explanation: >
      安いことに加えて、駅に近いという追加情報を述べている。
      moreover は「さらに」。
    translation: そのホテルは安い。さらに、駅に近い。
    focus:
      - moreover_addition
      - addition
      - hotel

  - id: g114_q006
    question_type: two_choice
    prompt: She is kind. ___, she is very reliable.
    choices:
      - text: Moreover
