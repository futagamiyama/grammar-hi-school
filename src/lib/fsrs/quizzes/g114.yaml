review_questions:
  - id: g114_q001
    question_type: two_choice
    prompt: The plan was simple. ___, it failed.
    choices:
      - text: However
        correct: true
      - text: Therefore
        correct: false
    answer: However
    explanation: >
      単純だったのに失敗した、という対比。
      逆接を表す接続副詞 however が自然。
    translation: その計画は単純だった。しかしながら、失敗した。
    focus:
      - however_contrast
      - contrast
      - failed

  - id: g114_q002
    question_type: two_choice
    prompt: I wanted to join them. ___, I was too busy.
    choices:
      - text: However
        correct: true
      - text: Moreover
        correct: false
    answer: However
    explanation: >
      参加したかったが、忙しすぎたという対比。
      however で「しかし」とつなぐ。
    translation: 私は彼らに加わりたかった。しかし、忙しすぎた。
    focus:
      - however_contrast
      - wanted
      - busy

  - id: g114_q003
    question_type: two_choice
    prompt: It was raining. ___, the game was canceled.
    choices:
      - text: Therefore
        correct: true
      - text: However
        correct: false
    answer: Therefore
    explanation: >
      雨が降っていた結果、試合が中止された。
      結果・結論を表す therefore が自然。
    translation: 雨が降っていた。したがって、その試合は中止された。
    focus:
      - therefore_result
      - result
      - canceled

  - id: g114_q004
    question_type: two_choice
    prompt: He did not study. ___, he failed the test.
    choices:
      - text: Therefore
        correct: true
      - text: Moreover
        correct: false
    answer: Therefore
    explanation: >
      勉強しなかったことから、テストに落ちたという結果を述べている。
      therefore が自然。
    translation: 彼は勉強しなかった。したがって、テストに落ちた。
    focus:
      - therefore_result
      - failed
      - result

  - id: g114_q005
    question_type: two_choice
    prompt: The hotel is cheap. ___, it is close to the station.
