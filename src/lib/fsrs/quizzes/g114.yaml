        correct: false
    answer: Otherwise
    explanation: >
      規則に従わない場合の悪い結果を述べている。
      otherwise が自然。
    translation: 規則に従いなさい。さもないと罰せられます。
    focus:
      - otherwise_warning
      - rules
      - punished

  - id: g114_q009
    question_type: two_choice
    prompt: I was tired, ___ I went home.
    choices:
      - text: so
        correct: true
      - text: therefore
        correct: false
    answer: so
    explanation: >
      コンマの後に文を直接つないでいるので、等位接続詞 so が自然。
      therefore は接続副詞なので、普通は I was tired. Therefore, I went home. とする。
    translation: 私は疲れていたので、家に帰った。
    focus:
      - conjunctive_adverb_vs_conjunction
      - so_vs_therefore
      - punctuation

  - id: g114_q010
    question_type: two_choice
    prompt: I was tired. ___, I went home.
    choices:
      - text: Therefore
        correct: true
      - text: So
        correct: false
    answer: Therefore
    explanation: >
      新しい文の文頭に置いて、前文からの結果を示している。
      接続副詞 Therefore が自然。
    translation: 私は疲れていた。したがって、家に帰った。
    focus:
      - conjunctive_adverb_vs_conjunction
      - therefore
      - new_sentence

  - id: g114_q011
    question_type: two_choice
    prompt: I wanted to go, ___ I stayed home.
    choices:
      - text: but
        correct: true
      - text: however
        correct: false
    answer: but
    explanation: >
      コンマの後で二つの文を直接つないでいる。
      等位接続詞 but が自然。
      however を使うなら I wanted to go. However, I stayed home.。
    translation: 私は行きたかったが、家にいた。
    focus:
      - conjunctive_adverb_vs_conjunction
      - but_vs_however
      - contrast

  - id: g114_q012
    question_type: two_choice
    prompt: Hurry up, ___ you will miss the train.
    choices:
      - text: or
        correct: true
      - text: otherwise
        correct: false
    answer: or
    explanation: >
      命令文 + or で「さもないと」。
      otherwise を使うなら Hurry up. Otherwise, you will miss the train. が自然。
    translation: 急ぎなさい、さもないと電車に乗り遅れます。
    focus:
      - conjunctive_adverb_vs_conjunction
      - or_vs_otherwise
      - warning

common_mistakes:
  - mistake: however を but とまったく同じように使う
    correction: >
      but は等位接続詞として文を直接つなげる。
      however は接続副詞なので、新しい文やセミコロンの後で使うのが基本。
  - mistake: therefore を so と同じ位置で使う
    correction: >
      so は等位接続詞。
      therefore は接続副詞。
      I was tired, so I went home. / I was tired. Therefore, I went home.。
  - mistake: moreover を逆接として読む
    correction: >
      moreover は「さらに」。
      前の内容に追加情報を加える。
  - mistake: otherwise を ordinary の意味と混同する
    correction: >
      otherwise は「さもないと」「そうでなければ」。
      条件を満たさない場合の結果を表す。
  - mistake: 接続副詞だけで文と文を雑につなぐ
    correction: >
      接続副詞は意味の上で文をつなぐ副詞。
      句読点や文の切れ目を意識する。

learning_notes:
  - >
    however は「しかしながら」。
    対比・逆接を表す接続副詞。
  - >
    therefore は「したがって」。
    結果・結論を表す接続副詞。
  - >
    moreover は「さらに」。
    追加情報を加える接続副詞。
  - >
    otherwise は「さもないと」「そうでなければ」。
    前の条件を満たさない場合の結果を表す。
  - >
    but / so / and / or は等位接続詞。
    however / therefore / moreover / otherwise は接続副詞。
    意味が近くても文法上の働きが違う。

