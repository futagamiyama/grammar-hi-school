id: g011
file: g011.yaml

title: have の現在形・進行形
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: have が「所有」か、「食事・会議・経験などの出来事」か？

core_concept:
  possessive_have:
    form: have / has
    meaning: 所有・持っている状態・身体的特徴・関係などを表す
    image: すでに持っている状態 / そういう性質・関係がある
    examples:
      - sentence: I have a car.
        ja: 私は車を持っている。
        point: 所有を表す have なので、普通は現在進行形にしない。
      - sentence: She has blue eyes.
        ja: 彼女は青い目をしている。
        point: 身体的特徴を表す状態なので has を使う。
      - sentence: We have a problem.
        ja: 私たちには問題がある。
        point: 問題を抱えている状態を表している。

  event_have:
    form: am / is / are having
    meaning: 食事・会議・パーティー・楽しい時間など、出来事や活動を表す
    image: 今その活動をしている / その出来事の最中である
    examples:
      - sentence: We are having lunch now.
        ja: 私たちは今、昼食を食べている。
        point: have lunch は「昼食を食べる」という活動なので、現在進行形にできる。
      - sentence: They are having a meeting.
        ja: 彼らは会議をしている。
        point: have a meeting は「会議を開く・会議をする」という出来事を表す。
      - sentence: She is having a good time.
        ja: 彼女は楽しい時間を過ごしている。
        point: have a good time は経験・活動なので、現在進行形にできる。

main_rule: >
  have は「持っている」という所有・状態を表すとき、普通は現在進行形にしない。
  しかし have lunch, have dinner, have a meeting, have a party, have a good time など、
  食事・会議・経験・出来事を表すときは、現在進行形にできる。
  have という形だけで判断せず、have の後ろの名詞が「状態」なのか「出来事」なのかを見る。

contrast_pairs:
  - possessive_have: I have a car.
    event_have: I am having lunch now.
    point: >
      have a car は所有なので現在形。
      have lunch は食事という活動なので現在進行形にできる。

  - possessive_have: She has blue eyes.
    event_have: She is having a good time.
    point: >
      has blue eyes は身体的特徴を表す状態。
      is having a good time は今の経験・活動を表す。

  - possessive_have: We have a problem.
    event_have: We are having a meeting now.
    point: >
      have a problem は問題を抱えている状態。
      have a meeting は会議をするという出来事。

quiz_policy:
  questions_per_review: 3
  question_selection: random
  choice_style: two_choice
  time_limit_seconds_per_question: 8
  easy_policy:
    method: average_and_max_time
    average_threshold_ratio: 0.60
    max_threshold_ratio: 0.85

fsrs_rating:
  again:
    condition: 2問以上ミス、または所有のhaveと出来事のhaveの違いを説明できない
  hard:
    condition: 1問ミス、または正解しても理由を説明できない
  good:
    condition: 全問正解。ただしEASY条件は満たさない
  easy:
    condition: 全問正解し、平均時間が制限時間の60%以内、かつ最遅問題も制限時間の85%以内

review_questions:
  - id: g011_q001
    question_type: two_choice
    prompt: I ___ a bicycle.
