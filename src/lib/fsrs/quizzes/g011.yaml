common_mistakes:
  - mistake: have は状態動詞だから、いつも進行形にできないと思う
    correction: >
      所有の have は普通、現在進行形にしない。
      しかし have lunch, have a meeting, have a party など、出来事や活動を表す have は進行形にできる。

  - mistake: 「持っている」を日本語で「〜している」と訳すため、I am having a car. としてしまう
    correction: >
      日本語の「持っている」に引っ張られない。
      所有は英語では状態なので、I have a car. が自然。

  - mistake: have の後ろの名詞を見ずに、now があれば必ず進行形にする
    correction: >
      now があっても、have の意味が所有・状態なら進行形にしにくい。
      have lunch や have a meeting のように、活動・出来事を表すかを見る。

learning_notes:
  - >
    このカードは、現在形・現在進行形の一般ルールではなく、have という動詞の使い方を扱う。
  - >
    have の後ろに来る名詞が「物・特徴・関係・状態」なら、基本は現在形。
  - >
    have の後ろに来る名詞が「食事・会議・パーティー・経験」なら、出来事として現在進行形にできる。
  - >
    have to は「〜しなければならない」という別の表現なので、このカードでは扱わない。

