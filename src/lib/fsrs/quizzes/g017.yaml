id: g017
file: g017.yaml

title: see / look / watch の使い分け
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 見える状態か、意識して見る動作か、じっと見る動作かを判断できるか？

core_concept:
  overview: >
    see, look, watch はどれも「見る」と訳されることがあるが、英語では意味が違う。
    see は「自然に目に入る・見える」という知覚の状態に近い。
    look は「意識して目を向ける」という動作で、普通は look at の形で使う。
    watch は「動いているもの・変化するものをしばらく見る、観察する」という動作である。
    そのため、see は現在形で使われやすく、look や watch は今している動作なら現在進行形になりやすい。

  see:
    meaning: 自然に見える・目に入る
    typical_form: 現在形
    example: I see a bird in the tree.
    ja: 木に鳥が見える。
    point: 意識して見ようとしている動作ではなく、目に入っている状態を表す。

  look:
    meaning: 意識して目を向ける
    typical_form: look at + 名詞
    example: She is looking at the picture.
    ja: 彼女はその絵を見ている。
    point: 意識して目を向けている動作なので、今しているなら現在進行形になりやすい。

  watch:
    meaning: 動いているもの・変化するものをしばらく見る
    typical_form: watch + 名詞
    example: We are watching a soccer game.
    ja: 私たちはサッカーの試合を見ている。
    point: 試合・映画・テレビ・人の動きなどを注意して見続ける動作を表す。

main_rule: >
  see は「見える」という知覚の状態を表すので、普通は現在形で使う。
  look は「目を向ける」という動作で、目的語を取るときは look at を使う。
  watch は「動いているもの・変化するものをしばらく見る」という動作を表す。
  日本語の「見る」だけで判断せず、自然に見えるのか、意識して目を向けるのか、
  しばらく観察するのかを区別する。

contrast_pairs:
  - natural: I see a dog over there.
    unnatural: I am seeing a dog over there.
    point: >
      ただ目に入っているという知覚なら、現在形 see が自然。

  - natural: She is looking at the blackboard.
    unnatural: She is seeing at the blackboard.
    point: >
      意識して黒板に目を向けているので look at を使う。see at とは言わない。

  - natural: We are watching TV now.
    unnatural: We see TV now.
    point: >
      テレビを意識して見続けている動作なので watch を使う。

  - natural: He watches the news every morning.
    unnatural: He is watching the news every morning.
    point: >
      every morning があるので習慣を表す。動作動詞 watch でも、習慣なら現在形を使う。

