id: g069
file: g069.yaml

title: 前置詞 + 関係代名詞
type: construction

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 前置詞を関係代名詞の前に置く形を理解できるか？

core_concept:
  preposition_plus_which:
    form: 前置詞 + which
    meaning: 物・場所・事柄について、前置詞との関係を含めて説明する
    image: in it, with it, about it などを in which, with which, about which にする
    examples:
      - sentence: This is the house in which he lives.
        ja: これが彼が住んでいる家です。
        point: he lives in the house の in the house が in which になっている。
      - sentence: This is the tool with which he fixed the bike.
        ja: これが彼が自転車を修理した道具です。
        point: he fixed the bike with the tool の with the tool が with which になっている。
      - sentence: The topic about which we talked was difficult.
        ja: 私たちが話した話題は難しかった。
        point: we talked about the topic の about the topic が about which になっている。

  preposition_plus_whom:
    form: 前置詞 + whom
    meaning: 人について、前置詞との関係を含めて説明する
    image: to him, with her, for them などを to whom, with whom, for whom にする
    examples:
      - sentence: The person to whom I spoke was polite.
        ja: 私が話しかけた人は礼儀正しかった。
        point: I spoke to the person の to the person が to whom になっている。
      - sentence: The woman with whom I worked was kind.
        ja: 私が一緒に働いた女性は親切だった。
        point: I worked with the woman の with the woman が with whom になっている。
      - sentence: The man for whom she works is famous.
        ja: 彼女が働いている相手の男性は有名だ。
        point: she works for the man の for the man が for whom になっている。

  preposition_at_end:
    form: 先行詞 + 関係代名詞/省略 + 主語 + 動詞 + 前置詞
    meaning: 前置詞を文末に残す形
    image: 口語では前置詞を後ろに残すことが多い
    examples:
      - sentence: This is the house which he lives in.
        ja: これが彼が住んでいる家です。
        point: in which he lives を which he lives in と言える。
      - sentence: The person I spoke to was polite.
        ja: 私が話しかけた人は礼儀正しかった。
        point: to whom I spoke を I spoke to と言える。
      - sentence: The topic we talked about was difficult.
        ja: 私たちが話した話題は難しかった。
        point: about which we talked を we talked about と言える。

main_rule: >
  関係代名詞は、前置詞とセットで使われることがある。
  he lives in the house を関係詞でつなぐと、
  the house in which he lives になる。
  I spoke to the person なら、the person to whom I spoke になる。
  物・場所なら which、人なら whom を使う。
  前置詞 + which/whom は硬い表現で、入試英文や書き言葉でよく出る。
  口語では the house he lives in, the person I spoke to のように、
  前置詞を後ろに残し、目的格の関係代名詞を省略することも多い。
  ただし、前置詞の直後の which/whom は省略できない。

contrast_pairs:
  - formal: This is the house in which he lives.
    informal: This is the house which he lives in.
    point: >
      in which は硬い形。
      which he lives in は前置詞を後ろに残す形。
      さらに This is the house he lives in. と省略もできる。

  - formal: The person to whom I spoke was polite.
    informal: The person I spoke to was polite.
    point: >
      to whom は硬い形。
      spoke to の to を後ろに残すと、目的格の whom は省略しやすい。

  - formal: The topic about which we talked was difficult.
    informal: The topic we talked about was difficult.
    point: >
      about which は硬い形。
      talked about の about を後ろに残す形も自然。

