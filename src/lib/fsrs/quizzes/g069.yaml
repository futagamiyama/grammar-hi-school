common_mistakes:
  - mistake: 前置詞を落としてしまう
    correction: >
      live in the house, speak to the person, talk about the topic のように、
      元の動詞句で必要な前置詞は関係詞節でも残る。
  - mistake: in which の which を省略してしまう
    correction: >
      前置詞の直後にある which/whom は省略できない。
      This is the house in which he lives. が正しい。
  - mistake: 人に which を使ってしまう
    correction: >
      前置詞の後ろでも、人なら whom、物なら which が基本。
      the person to whom I spoke / the house in which he lives。
  - mistake: whom を主格の who と混同する
    correction: >
      前置詞の目的語になる形は whom。
      to whom, with whom, for whom のように使う。
  - mistake: 文末前置詞を必ず誤りだと思う
    correction: >
      the house he lives in, the person I spoke to のように、
      前置詞を文末に残す形は特に口語で自然。
      ただし、硬い英文では in which, to whom もよく使われる。

learning_notes:
  - >
    前置詞 + 関係代名詞は、元の文の前置詞関係を保った形。
    he lives in the house → the house in which he lives。
  - >
    物・場所なら which、人なら whom を使う。
    in which, with which, about which / to whom, with whom。
  - >
    前置詞を後ろに残す形もよく使う。
    the house he lives in, the topic we talked about。
  - >
    省略できるのは、前置詞を後ろに残した目的格関係代名詞。
    in which の which は省略できない。

