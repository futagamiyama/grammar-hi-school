id: g034
file: g034.yaml

title: 完了形の受動態
type: construction

section:
  id: s04
  title: 受動態・態

level: basic
target: 高校英文法基礎

core_question: すでに行われた結果が現在に関係しているか？

core_concept:
  simple_past_passive:
    form: was/were + 過去分詞
    meaning: 過去のある時点で〜されたことを表す
    image: 過去の出来事として切って述べる
    examples:
      - sentence: The window was repaired yesterday.
        ja: その窓は昨日修理された。
        point: yesterday により、過去の出来事として述べている。
      - sentence: The bridge was built in 1990.
        ja: その橋は1990年に建てられた。
        point: 過去の具体的な時点で建てられた事実。
      - sentence: The room was cleaned this morning.
        ja: その部屋は今朝掃除された。
        point: 今朝という過去の時点に焦点がある。

  present_perfect_passive:
    form: has/have been + 過去分詞
    meaning: すでに〜されている、〜された結果が今に関係していることを表す
    image: 過去に行われたことの結果が、今見える・今問題になる
    examples:
      - sentence: The window has been repaired.
        ja: その窓は修理されている。
        point: 修理が完了し、その結果が今も関係している。
      - sentence: The report has been submitted.
        ja: その報告書は提出されている。
        point: 提出済みであることが現在の状況として重要。
      - sentence: All the tickets have been sold.
        ja: チケットはすべて売り切れている。
        point: 売れた結果、今は残っていない。

main_rule: >
  完了形の受動態は has/have been + 過去分詞。
  「すでに〜されている」「〜された結果が今に関係している」という意味を表す。
  was/were + 過去分詞は、過去の具体的な時点で「〜された」と述べる形。
  already, yet, just, so far, recently などは現在完了の受動態と結びつきやすい。
  yesterday, last week, in 1990 など過去の具体的時点がある場合は、
  普通は過去形の受動態を使う。

contrast_pairs:
  - simple_past_passive: The window was repaired yesterday.
    present_perfect_passive: The window has been repaired.
    point: >
      was repaired yesterday は昨日修理されたという過去の出来事。
      has been repaired は修理済みで、今その結果が関係している。

  - simple_past_passive: The bridge was built in 1990.
    present_perfect_passive: The bridge has been built.
    point: >
      in 1990 があれば過去の時点なので was built。
      has been built は、建設が完了して今存在していることに焦点がある。

  - simple_past_passive: The documents were checked this morning.
    present_perfect_passive: The documents have been checked.
    point: >
      this morning を過去の時点として述べるなら were checked。
      have been checked は、確認済みである現在の状態を表す。

quiz_policy:
