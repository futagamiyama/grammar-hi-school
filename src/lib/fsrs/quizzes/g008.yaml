      - text: would
        correct: true
    answer: would
    ja: 私が彼女を訪ねると、彼女はいつも私にお茶を入れてくれたものだった。
    explanation: make tea は訪問のたびに繰り返された動作。would が特に自然。
    focus:
      - past_habit
      - repeated_action
      - would

common_mistakes:
  - mistake: used to と would をどちらも「〜したものだ」とだけ覚える
    correction: used to は過去の状態にも使えるが、would は原則として過去の反復的な動作に使う。
  - mistake: I would live in Kyoto. を「京都に住んでいたものだ」と考える
    correction: live は状態なので、この意味では I used to live in Kyoto. が自然。
  - mistake: would が使える文は used to が使えないと思う
    correction: 反復的な動作なら used to も would も使えることが多い。would は回想的・物語的に響きやすい。
  - mistake: 過去の習慣なら必ず would を使うと思う
    correction: would は過去の反復動作には使えるが、現在との対比を強く出すなら used to が自然なことが多い。

learning_notes:
  - used to は「以前はそうだったが、今は違う」という対比を含みやすい。
  - would は過去の状態ではなく、過去に繰り返した動作に使う。
  - 過去の状態を表す live, be, know, have, belong などでは used to を選ぶ。
  - When I was a child などの過去の枠組みがあると、would は自然になりやすい。
  - 反復的動作では used to も would も可能なことがあるため、このカードでは「would が自然に使える場面」と「would が不自然な状態」を対比する。

