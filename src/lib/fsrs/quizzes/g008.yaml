      - text: would
        correct: true
    answer: would
    ja: 子どものころ、私たちは毎週日曜日によく釣りに行ったものだった。
    explanation: go fishing は反復的な動作。would が自然に使える。
    focus:
      - past_habit
      - repeated_action
      - would

  - id: g008_q005
    question_type: two_choice
    prompt: My grandfather ___ tell us old stories after dinner.
    choices:
      - text: used to
        correct: false
      - text: would
        correct: true
    answer: would
    ja: 祖父は夕食後、よく昔話をしてくれたものだった。
    explanation: tell は反復的な動作を表しているので would が自然。used to も可能だが、ここでは would の典型例を問う。
    focus:
      - past_habit
      - repeated_action
      - tell
      - would

  - id: g008_q006
    question_type: two_choice
    prompt: She ___ be very shy.
    choices:
      - text: used to
        correct: true
      - text: would
        correct: false
    answer: used to
    ja: 彼女は以前、とても内気だった。
    explanation: be shy は過去の状態。状態には used to が自然で、would は不自然。
    focus:
      - past_state
      - be
      - used_to

  - id: g008_q007
    question_type: two_choice
    prompt: I ___ know him well.
    choices:
      - text: used to
        correct: true
      - text: would
        correct: false
    answer: used to
    ja: 私は以前、彼のことをよく知っていた。
    explanation: know は状態動詞。過去の状態なので used to が自然。
    focus:
      - past_state
      - know
      - used_to

  - id: g008_q008
    question_type: two_choice
    prompt: Every summer, my family ___ stay at this hotel.
    choices:
      - text: used to
        correct: false
      - text: would
        correct: true
    answer: would
    ja: 毎年夏、私の家族はこのホテルに泊まったものだった。
    explanation: stay at this hotel は毎年繰り返された行動として読める。every summer があるので would が自然。
    focus:
      - past_habit
      - repeated_action
      - stay
      - would

  - id: g008_q009
    question_type: two_choice
    prompt: This building ___ belong to a bank.
    choices:
      - text: used to
        correct: true
      - text: would
        correct: false
    answer: used to
    ja: この建物は以前、銀行のものだった。
    explanation: belong は所有・所属の状態を表す。過去の状態なので used to が自然。
    focus:
      - past_state
      - belong
      - used_to

  - id: g008_q010
    question_type: two_choice
    prompt: On rainy days, we ___ sit by the window and read books.
    choices:
      - text: used to
        correct: false
      - text: would
        correct: true
    answer: would
    ja: 雨の日には、私たちはよく窓辺に座って本を読んだものだった。
    explanation: sit and read は過去に繰り返した動作。would が自然に使える。
    focus:
      - past_habit
      - repeated_action
      - would

  - id: g008_q011
    question_type: two_choice
    prompt: He ___ have long hair when he was young.
