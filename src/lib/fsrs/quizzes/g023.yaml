common_mistakes:
- mistake: must not を『〜する必要がない』と訳してしまう
  correction: must not は『〜してはいけない』という禁止。不要を表すなら do not have to を使う。
- mistake: do not have to を『〜してはいけない』と訳してしまう
  correction: do not have to は『〜しなくてもよい』『〜する必要はない』という意味。禁止ではない。
- mistake: She do not have to のように三単現を崩してしまう
  correction: '主語が三人称単数なら does not have to になる。例: She does not have to wear a uniform.'
learning_notes:
- must not と do not have to は、肯定形の must / have to よりも意味差が大きい。
- must not は禁止。相手の行動を止める表現なので、かなり強い。
- do not have to は不要。してもよいが、義務ではないという意味。
- 日本語では『〜しなくてよい』と『〜してはいけない』をはっきり分けて考えると間違いにくい。
