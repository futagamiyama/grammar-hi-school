id: g023
file: g023.yaml
title: must not vs do not have to
type: grammar_contrast
section:
  id: s03
  title: 助動詞・法
level: basic
target: 高校英文法基礎
core_question: 禁止か、不要か？
core_concept:
  must_not:
    form: must not + 動詞の原形
    meaning: 〜してはいけない、という禁止を表す
    image: してはいけない / 禁止されている / 強く止めている
    examples:
    - sentence: You must not touch this wire.
      ja: この電線に触ってはいけない。
      point: 危険なので、触ることを禁止している。
    - sentence: Students must not use phones during the test.
      ja: 生徒は試験中に携帯電話を使ってはいけない。
      point: 試験中の行為を禁止している。
    - sentence: You must not tell anyone this secret.
      ja: この秘密を誰にも話してはいけない。
      point: 話すことを強く禁止している。
  do_not_have_to:
    form: do not have to + 動詞の原形
    meaning: 〜する必要はない、という不要を表す
    image: しなくてもよい / 義務ではない / 必要がない
    examples:
    - sentence: You do not have to come early tomorrow.
      ja: 明日は早く来る必要はない。
      point: 早く来てもよいが、そうする必要はない。
    - sentence: She does not have to wear a uniform on Friday.
      ja: 彼女は金曜日には制服を着る必要がない。
      point: 制服を着てもよいが、義務ではない。
    - sentence: We do not have to pay today.
      ja: 私たちは今日支払う必要はない。
      point: 今日支払う義務がないことを表している。
main_rule: must not は「〜してはいけない」という禁止を表す。do not have to は「〜する必要はない」という不要を表す。日本語の『〜してはいけない』と『〜しなくてもよい』を混同しないことが重要。must
  の否定は『不要』ではなく『禁止』になる。
contrast_pairs:
- must_not: You must not enter this room.
  do_not_have_to: You do not have to enter this room.
  point: must not は入室禁止、do not have to は入室する必要がないという意味。
- must_not: Students must not talk during the test.
  do_not_have_to: Students do not have to write their names on this form.
  point: must not は話すことを禁止し、do not have to は名前を書く必要がないことを表す。
- must_not: You must not forget this password.
  do_not_have_to: You do not have to remember this old password.
  point: must not は忘れてはいけない、do not have to は覚えておく必要がない。
