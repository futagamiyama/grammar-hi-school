review_questions:
  - id: g064_q001
    question_type: two_choice
    prompt: This is the town ___ I was born.
    choices:
      - text: where
        correct: true
      - text: when
        correct: false
    answer: where
    explanation: >
      the town は場所を表す名詞。
      「そこで生まれた町」なので where を使う。
    translation: ここは私が生まれた町です。
    focus:
      - where
      - place_antecedent
      - relative_adverb

  - id: g064_q002
    question_type: two_choice
    prompt: I remember the day ___ we first met.
    choices:
      - text: where
        correct: false
      - text: when
        correct: true
    answer: when
    explanation: >
      the day は時を表す名詞。
      「その日に初めて会った」なので when を使う。
    translation: 私は私たちが初めて会った日を覚えている。
    focus:
      - when
      - time_antecedent
      - relative_adverb

  - id: g064_q003
    question_type: two_choice
    prompt: This is the school ___ my father studied.
    choices:
      - text: where
        correct: true
      - text: when
        correct: false
    answer: where
    explanation: >
      the school は場所。
      父がそこで学んだ学校を表すので where が自然。
    translation: ここは私の父が学んだ学校です。
    focus:
      - where
      - place_antecedent
      - school

  - id: g064_q004
    question_type: two_choice
    prompt: Summer is the season ___ many people travel.
    choices:
      - text: where
        correct: false
      - text: when
        correct: true
    answer: when
    explanation: >
      the season は時期を表す名詞。
      その時期に多くの人が旅行するので when を使う。
    translation: 夏は多くの人が旅行する季節だ。
    focus:
      - when
      - time_antecedent
      - season

  - id: g064_q005
    question_type: two_choice
    prompt: This is the room ___ we had the meeting.
    choices:
      - text: where
        correct: true
      - text: when
        correct: false
    answer: where
    explanation: >
      the room は場所。
      そこで会議をしたという意味なので where を使う。
    translation: ここは私たちが会議をした部屋です。
    focus:
      - where
      - place_antecedent
      - room

  - id: g064_q006
    question_type: two_choice
    prompt: There are times ___ I feel nervous.
    choices:
      - text: where
        correct: false
      - text: when
        correct: true
    answer: when
    explanation: >
      times は時を表す名詞。
      「緊張する時がある」なので when が自然。
    translation: 私が緊張する時がある。
    focus:
      - when
      - time_antecedent
      - times

  - id: g064_q007
    question_type: two_choice
    prompt: I visited the village ___ my grandmother grew up.
    choices:
      - text: where
        correct: true
      - text: when
        correct: false
    answer: where
    explanation: >
      the village は場所。
      祖母がそこで育った村を表すので where を使う。
    translation: 私は祖母が育った村を訪れた。
    focus:
      - where
      - place_antecedent
      - village

  - id: g064_q008
    question_type: two_choice
    prompt: I will never forget the year ___ I moved to Tokyo.
    choices:
      - text: where
        correct: false
      - text: when
        correct: true
    answer: when
    explanation: >
      the year は時を表す名詞。
      東京へ引っ越した年を説明しているので when を使う。
    translation: 私は東京へ引っ越した年を決して忘れない。
    focus:
      - when
      - time_antecedent
      - year

  - id: g064_q009
    question_type: two_choice
    prompt: This is the restaurant ___ we had dinner.
    choices:
      - text: where
        correct: true
      - text: when
        correct: false
    answer: where
    explanation: >
      the restaurant は場所。
      そこで夕食を食べたという意味なので where が自然。
    translation: ここは私たちが夕食を食べたレストランです。
    focus:
      - where
      - place_antecedent
      - restaurant

  - id: g064_q010
    question_type: two_choice
    prompt: Monday is the day ___ the shop is closed.
    choices:
      - text: where
        correct: false
      - text: when
        correct: true
    answer: when
    explanation: >
      the day は時を表す名詞。
      その日に店が閉まっているので when を使う。
    translation: 月曜日はその店が閉まっている日です。
    focus:
      - when
      - time_antecedent
      - day

  - id: g064_q011
    question_type: two_choice
    prompt: This is the house ___ he lives.
    choices:
      - text: where
        correct: true
      - text: which
        correct: false
    answer: where
    explanation: >
      live はここでは「そこに住む」という場所の情報を必要とする。
      the house を場所として説明しているので where が自然。
      which を使うなら This is the house in which he lives. となる。
    translation: これが彼が住んでいる家です。
    focus:
      - where
      - relative_adverb
      - where_vs_which

  - id: g064_q012
    question_type: two_choice
    prompt: This is the house ___ he bought.
    choices:
      - text: where
        correct: false
      - text: which
        correct: true
    answer: which
    explanation: >
      bought の目的語が必要で、「彼がそれを買った家」という意味。
      場所の副詞ではなく目的語を表す関係代名詞 which が自然。
    translation: これが彼が買った家です。
    focus:
      - which
      - object_relative
      - where_vs_which

common_mistakes:
  - mistake: 場所を表す名詞の後なら必ず where を使う
    correction: >
      後ろの文で場所の副詞が必要なときは where。
      目的語が欠けているなら which を使う。
      the house where he lives / the house which he bought。
  - mistake: 時を表す名詞の後に where を使ってしまう
    correction: >
      day, year, season, time など時を説明するなら when を使う。
  - mistake: where を関係代名詞だと思う
    correction: >
      where は関係副詞。
      in which, at which などに近い働きをする。
  - mistake: when を疑問詞の「いつ」だけだと思う
    correction: >
      when は関係副詞として「〜する時」を表すこともできる。
      the day when we met のように使う。
  - mistake: which と where の違いを先行詞だけで判断する
    correction: >
      先行詞が場所でも、後ろの文で目的語が欠けていれば which。
      後ろの文が完全で、場所情報だけを足すなら where。

learning_notes:
  - >
    where は場所を説明する関係副詞。
    the town where I was born は「私が生まれた町」。
  - >
    when は時を説明する関係副詞。
    the day when we first met は「私たちが初めて会った日」。
  - >
    関係副詞の後ろの文は、基本的に主語・動詞・目的語がそろった形になりやすい。
    where I was born, when we first met のように読む。
  - >
    場所名詞の後でも、which になる場合がある。
    the house which he bought は bought の目的語が欠けている。

