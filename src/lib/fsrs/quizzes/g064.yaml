id: g064
file: g064.yaml

title: 関係副詞 where / when
type: grammar_contrast

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 場所を説明しているのか、時を説明しているのか？

core_concept:
  where:
    form: 場所を表す名詞 + where + 主語 + 動詞 ...
    meaning: そこで〜する場所、そこで〜した場所
    image: 前の場所を、後ろの文で説明する
    examples:
      - sentence: This is the town where I was born.
        ja: ここは私が生まれた町です。
        point: the town という場所を where I was born が説明している。
      - sentence: I visited the school where my father studied.
        ja: 私は父が学んだ学校を訪れた。
        point: the school という場所を説明しているので where。
      - sentence: This is the room where we had the meeting.
        ja: ここは私たちが会議をした部屋です。
        point: the room という場所を説明している。

  when:
    form: 時を表す名詞 + when + 主語 + 動詞 ...
    meaning: その時に〜する時、〜した時
    image: 前の時を、後ろの文で説明する
    examples:
      - sentence: I remember the day when we first met.
        ja: 私は私たちが初めて会った日を覚えている。
        point: the day という時を when we first met が説明している。
      - sentence: Summer is the season when many people travel.
        ja: 夏は多くの人が旅行する季節だ。
        point: the season という時期を説明しているので when。
      - sentence: There are times when I feel nervous.
        ja: 私が緊張する時がある。
        point: times という時を説明している。

  relation_to_preposition_plus_which:
    form: where = in/at which, when = in/on/at which
    meaning: 関係副詞は、前置詞 + which に近い働きをする
    image: 場所・時の中で起きることを表す
    examples:
      - sentence: This is the town where I was born.
        ja: ここは私が生まれた町です。
        point: where は in which に近い。
      - sentence: I remember the day when we first met.
        ja: 私は私たちが初めて会った日を覚えている。
        point: when は on which に近い。
      - sentence: This is the house where he lives.
        ja: これが彼が住んでいる家です。
        point: where は in which に近い。

main_rule: >
  関係副詞は、場所や時を後ろから説明する関係詞。
  場所を表す名詞を説明するなら where、時を表す名詞を説明するなら when を使う。
  This is the town where I was born. は「私が生まれた町」。
  I remember the day when we first met. は「私たちが初めて会った日」。
  where は in/at which、when は in/on/at which に近い働きをする。
  まず先行詞が場所か時かを見る。

contrast_pairs:
  - place: This is the town where I was born.
    time: I remember the day when I was born.
    point: >
      the town は場所なので where。
      the day は時なので when。

  - place: This is the school where my father studied.
    time: This is the year when my father graduated.
    point: >
      school は場所。
      year は時。

  - relative_adverb: This is the house where he lives.
    relative_pronoun: This is the house which he bought.
    point: >
      where he lives は「そこで住んでいる」。
      which he bought は「それを買った」。
      後ろの文で場所の副詞が必要か、目的語が必要かを見る。

