common_mistakes:
  - mistake: 関係代名詞はいつでも省略できると思う
    correction: >
      省略できるのは目的格の関係代名詞。
      主格の関係代名詞は省略できない。
  - mistake: The man lives next door is a doctor. としてしまう
    correction: >
      lives の主語として who が必要。
      The man who lives next door is a doctor. が正しい。
  - mistake: The book I bought yesterday を不完全だと思う
    correction: >
      The book which/that I bought yesterday の目的格関係代名詞が省略された正しい形。
  - mistake: in which の which を省略してしまう
    correction: >
      前置詞の直後にある関係代名詞は省略できない。
      in which は残す。
  - mistake: 関係代名詞の前後だけで判断し、関係詞節の中の欠けを見ない
    correction: >
      関係詞節の中で主語が欠けているなら省略不可。
      目的語が欠けているなら省略可。

learning_notes:
  - >
    省略判断の中心は、関係代名詞が主語か目的語か。
  - >
    目的格は省略できる。
    the book I bought, the man I met, the movie we watched のように使う。
  - >
    主格は省略できない。
    the man who lives next door, the book which is on the desk のように使う。
  - >
    前置詞が前に出ている in which, to whom では、関係代名詞は省略できない。
    前置詞を後ろに残すと省略できる場合がある。

