id: g068
file: g068.yaml

title: 関係代名詞の省略
type: construction

section:
  id: s08
  title: 関係詞

level: basic
target: 高校英文法基礎

core_question: 省略できる関係代名詞と、省略できない関係代名詞を判断できるか？

core_concept:
  object_relative_omission:
    form: 先行詞 + 主語 + 動詞 ...
    meaning: 目的格の関係代名詞は省略できる
    image: 関係詞節の中で目的語が欠けている
    examples:
      - sentence: The book I bought yesterday is interesting.
        ja: 私が昨日買った本は面白い。
        point: The book which/that I bought yesterday の which/that が省略されている。
      - sentence: The man I met yesterday was kind.
        ja: 私が昨日会った男性は親切だった。
        point: The man who/whom/that I met yesterday の関係代名詞が省略されている。
      - sentence: This is the movie we watched last night.
        ja: これは私たちが昨夜見た映画です。
        point: the movie which/that we watched の which/that が省略されている。

  subject_relative_no_omission:
    form: 先行詞 + who/which/that + 動詞 ...
    meaning: 主格の関係代名詞は省略できない
    image: 関係詞節の中で主語が欠けているので、関係代名詞が必要
    examples:
      - sentence: The man who lives next door is a doctor.
        ja: 隣に住んでいる男性は医者です。
        point: who が lives の主語なので省略できない。
      - sentence: The book which is on the desk is mine.
        ja: 机の上にある本は私のものです。
        point: which が is の主語なので省略できない。
      - sentence: Students who study hard usually improve.
        ja: 一生懸命勉強する生徒はたいてい上達する。
        point: who が study の主語なので省略できない。

  preposition_and_omission:
    form: 前置詞 + whom/which
    meaning: 前置詞の直後の関係代名詞は省略できない
    image: 前置詞の目的語として関係代名詞が必要
    examples:
      - sentence: This is the house in which he lives.
        ja: これが彼が住んでいる家です。
        point: in which の which は省略できない。
      - sentence: The person to whom I spoke was polite.
        ja: 私が話しかけた人は礼儀正しかった。
        point: to whom の whom は省略できない。
      - sentence: This is the house he lives in.
        ja: これが彼が住んでいる家です。
        point: 前置詞 in を後ろに残す形なら関係代名詞を省略できる。

main_rule: >
  関係代名詞は、目的格なら省略できる。
  The book which I bought yesterday is interesting. は
  The book I bought yesterday is interesting. とできる。
  一方、主格の関係代名詞は省略できない。
  The man who lives next door is a doctor. の who は lives の主語なので省略できない。
  また、in which, to whom のように前置詞の直後にある関係代名詞も省略できない。
  省略できるかどうかは、関係詞節の中で関係代名詞が主語か目的語かで判断する。

contrast_pairs:
  - object_relative: The book I bought yesterday is interesting.
    subject_relative: The book which is on the desk is mine.
    point: >
      I bought の目的語が欠けているので、which/that は省略できる。
      which is on the desk では which が is の主語なので省略できない。

  - object_relative: The man I met yesterday was kind.
    subject_relative: The man who lives next door is kind.
    point: >
      I met の目的語なら省略できる。
      lives の主語なら who は省略できない。

  - preposition_front: This is the house in which he lives.
    preposition_end: This is the house he lives in.
    point: >
      in which の which は省略できない。
      in を後ろに残すと、which/that を省略できる。

