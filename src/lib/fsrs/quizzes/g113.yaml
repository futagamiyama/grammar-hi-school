id: g113
file: g113.yaml

title: 等位接続詞 and / but / or / so / for
type: grammar_contrast

section:
  id: s11
  title: 名詞節・接続詞

level: basic
target: 高校英文法基礎

core_question: 等位接続詞 and / but / or / so / for の意味を、前後の関係から選べるか？

core_concept:
  and_addition:
    form: A and B
    meaning: AそしてB、AもBも
    image: 情報を足す
    examples:
      - sentence: She opened the door and entered the room.
        ja: 彼女はドアを開けて、部屋に入った。
        point: 二つの動作を順に並べている。
      - sentence: He is kind and honest.
        ja: 彼は親切で正直だ。
        point: kind と honest という二つの性質を足している。
      - sentence: I bought bread and milk.
        ja: 私はパンと牛乳を買った。
        point: bread と milk を並列している。

  but_contrast:
    form: A, but B
    meaning: AだがB
    image: 予想と反対・対比を示す
    examples:
      - sentence: The bag is small, but it is heavy.
        ja: そのかばんは小さいが、重い。
        point: small から予想される軽さと heavy が対比されている。
      - sentence: I wanted to go, but I was too busy.
        ja: 私は行きたかったが、忙しすぎた。
        point: 行きたい気持ちと実際に行けない状況の対比。
      - sentence: He is strict but fair.
        ja: 彼は厳しいが公平だ。
        point: strict と fair を対比している。

  or_choice:
    form: A or B
    meaning: AかB、さもないとB
    image: 選択肢または条件の結果を示す
    examples:
      - sentence: You can have tea or coffee.
        ja: 紅茶かコーヒーを飲めます。
        point: tea と coffee の選択。
      - sentence: Hurry up, or you will miss the train.
        ja: 急ぎなさい、さもないと電車に乗り遅れます。
        point: 命令文 + or で「さもないと」。
      - sentence: Is he a student or a teacher?
        ja: 彼は学生ですか、それとも先生ですか。
        point: 二つの可能性を選ばせている。

  so_result:
    form: A, so B
    meaning: AなのでB、だからB
    image: 前の内容から結果が出る
    examples:
      - sentence: It was raining, so we stayed home.
        ja: 雨が降っていたので、私たちは家にいた。
        point: 雨が原因で、家にいたという結果になる。
      - sentence: I was tired, so I went to bed early.
        ja: 私は疲れていたので、早く寝た。
        point: tired が理由、went to bed early が結果。
      - sentence: He studied hard, so he passed the exam.
        ja: 彼は一生懸命勉強したので、試験に合格した。
        point: 勉強した結果、合格した。

  for_reason:
    form: A, for B
    meaning: Aである。というのはBだからだ。
    image: 後ろから理由を補足する、やや硬い表現
    examples:
      - sentence: I stayed home, for it was raining.
        ja: 私は家にいた。というのは雨が降っていたからだ。
        point: for は後ろから理由を説明する等位接続詞。
      - sentence: She must be tired, for she has worked all day.
        ja: 彼女は疲れているに違いない。というのは一日中働いたからだ。
        point: 推測の理由を for で補足している。
      - sentence: We left early, for the road was dangerous.
        ja: 私たちは早く出発した。というのは道路が危険だったからだ。
        point: 理由を後ろに加える硬めの表現。

  coordinate_clause_punctuation:
    form: 文, and/but/or/so/for 文
    meaning: 二つの独立した文をつなぐ
    image: 文と文をつなぐ時はコンマを置くことが多い
    examples:
      - sentence: I was tired, so I went home.
        ja: 私は疲れていたので、家に帰った。
        point: 二つの文を so でつないでいる。
      - sentence: I wanted to go, but I stayed home.
        ja: 私は行きたかったが、家にいた。
        point: 二つの文の対比。
      - sentence: Hurry up, or you will be late.
        ja: 急ぎなさい、さもないと遅れます。
        point: 命令文 + or の形。

main_rule: >
  等位接続詞は、語と語、句と句、文と文を対等につなぐ接続詞。
  and は情報の追加、「そして」「〜と」。
  but は対比、「しかし」「〜だが」。
  or は選択、「AかB」、また命令文の後では「さもないと」。
  so は結果、「だから」「それで」。
  for は理由を後ろから補足し、「というのは〜だからだ」という硬めの表現になる。
  because は従属接続詞だが、for は等位接続詞なので、
  I stayed home, for it was raining. のように、前の文に理由を後から加える。
  文と文を等位接続詞でつなぐ場合、英語では接続詞の前にコンマを置くことが多い。
  ただし、語や短い句を並べるだけならコンマは不要。
  bread and milk / kind but strict / tea or coffee のように使う。

contrast_pairs:
  - addition: He is kind and honest.
    contrast: He is strict but fair.
    point: >
      and は情報を足す。
      but は対比を表す。

  - choice: You can have tea or coffee.
    warning: Hurry up, or you will miss the train.
    point: >
      or は選択を表す。
      命令文の後では「さもないと」という警告になる。

  - result: It was raining, so we stayed home.
    reason: We stayed home, for it was raining.
    point: >
      so は前から後ろへ結果を示す。
      for は後ろから理由を補足する。

