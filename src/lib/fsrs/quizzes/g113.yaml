review_questions:
  - id: g113_q001
    question_type: two_choice
    prompt: She opened the door ___ entered the room.
    choices:
      - text: and
        correct: true
      - text: but
        correct: false
    answer: and
    explanation: >
      ドアを開ける、部屋に入る、という二つの動作を順に並べている。
      情報を足すので and が自然。
    translation: 彼女はドアを開けて、部屋に入った。
    focus:
      - and_addition
      - sequence
      - entered

  - id: g113_q002
    question_type: two_choice
    prompt: He is kind ___ honest.
    choices:
      - text: and
        correct: true
      - text: or
        correct: false
    answer: and
    explanation: >
      kind と honest の両方の性質を述べている。
      追加なので and を使う。
    translation: 彼は親切で正直だ。
    focus:
      - and_addition
      - adjectives
      - kind_honest

  - id: g113_q003
    question_type: two_choice
    prompt: The bag is small, ___ it is heavy.
    choices:
      - text: but
        correct: true
      - text: so
        correct: false
    answer: but
    explanation: >
      small なのに heavy という対比がある。
      予想と反対の内容をつなぐので but。
    translation: そのかばんは小さいが、重い。
    focus:
      - but_contrast
      - contrast
      - small_heavy

  - id: g113_q004
    question_type: two_choice
    prompt: I wanted to go, ___ I was too busy.
    choices:
      - text: but
        correct: true
      - text: and
        correct: false
    answer: but
    explanation: >
      行きたかったが、忙しすぎて行けなかったという対比。
      but が自然。
    translation: 私は行きたかったが、忙しすぎた。
    focus:
      - but_contrast
      - wanted
      - busy

  - id: g113_q005
    question_type: two_choice
    prompt: You can have tea ___ coffee.
    choices:
      - text: or
        correct: true
      - text: but
        correct: false
    answer: or
    explanation: >
      tea と coffee のどちらかを選ぶ意味。
      選択を表すので or を使う。
    translation: 紅茶かコーヒーを飲めます。
    focus:
      - or_choice
      - choice
      - tea_coffee

  - id: g113_q006
    question_type: two_choice
    prompt: Hurry up, ___ you will miss the train.
    choices:
      - text: or
        correct: true
      - text: and
        correct: false
    answer: or
    explanation: >
      命令文 + or で「さもないと」。
      急がないと電車に乗り遅れる、という警告を表す。
    translation: 急ぎなさい、さもないと電車に乗り遅れます。
    focus:
      - or_choice
      - warning
      - hurry_up

  - id: g113_q007
    question_type: two_choice
    prompt: It was raining, ___ we stayed home.
    choices:
      - text: so
        correct: true
      - text: but
        correct: false
    answer: so
    explanation: >
      雨が降っていたことが理由で、家にいたという結果になる。
      結果を表す so が自然。
    translation: 雨が降っていたので、私たちは家にいた。
    focus:
      - so_result
      - result
      - raining

  - id: g113_q008
    question_type: two_choice
    prompt: I was tired, ___ I went to bed early.
    choices:
      - text: so
        correct: true
      - text: or
        correct: false
    answer: so
    explanation: >
      疲れていた結果、早く寝た。
      原因から結果へつなぐので so を使う。
    translation: 私は疲れていたので、早く寝た。
    focus:
      - so_result
      - tired
      - went_to_bed

  - id: g113_q009
    question_type: two_choice
    prompt: He studied hard, ___ he passed the exam.
    choices:
      - text: so
        correct: true
      - text: for
        correct: false
    answer: so
    explanation: >
      一生懸命勉強した結果、試験に合格した。
      結果を表す so が自然。
    translation: 彼は一生懸命勉強したので、試験に合格した。
    focus:
      - so_result
      - studied
      - passed

  - id: g113_q010
    question_type: two_choice
    prompt: I stayed home, ___ it was raining.
    choices:
      - text: for
        correct: true
      - text: so
        correct: false
    answer: for
    explanation: >
      for は後ろから理由を補足する等位接続詞。
      「というのは雨が降っていたからだ」という意味。
    translation: 私は家にいた。というのは雨が降っていたからだ。
    focus:
      - for_reason
      - reason
      - raining

  - id: g113_q011
    question_type: two_choice
    prompt: She must be tired, ___ she has worked all day.
    choices:
      - text: for
        correct: true
      - text: or
        correct: false
    answer: for
    explanation: >
      一日中働いたことが、「疲れているに違いない」という判断の理由。
      for が理由を後ろから補足している。
    translation: 彼女は疲れているに違いない。というのは一日中働いたからだ。
    focus:
      - for_reason
      - must_be
      - worked_all_day

  - id: g113_q012
    question_type: two_choice
    prompt: I was tired, ___ I went home.
    choices:
      - text: so
        correct: true
      - text: because
        correct: false
    answer: so
    explanation: >
      ここでは二つの文を等位接続詞でつないでいる。
      I was tired が原因、I went home が結果なので so が自然。
      because を使うなら I went home because I was tired. のように語順を変える。
    translation: 私は疲れていたので、家に帰った。
    focus:
      - coordinate_clause_punctuation
      - so_result
      - because_contrast

common_mistakes:
  - mistake: and を何でもつなげる接続詞として使う
    correction: >
      and は追加や順序を表す。
      対比なら but、結果なら so、選択なら or を使う。
  - mistake: but と so を混同する
    correction: >
      but は対比。
      so は前の内容から出る結果。
  - mistake: 命令文 + or を普通の選択として読む
    correction: >
      Hurry up, or you will miss the train. の or は
      「さもないと」という警告を表す。
  - mistake: for を because と完全に同じだと思う
    correction: >
      for は等位接続詞で、後ろから理由を補足する硬めの表現。
      because は従属接続詞で、理由節を作る。
  - mistake: because を so と同じ位置で使う
    correction: >
      I was tired, so I went home. は自然。
      I was tired, because I went home. では意味が逆になる。
  - mistake: 文と文をつなぐ時のコンマを意識しない
    correction: >
      独立した文同士を and / but / or / so / for でつなぐ時は、
      接続詞の前にコンマを置くことが多い。

learning_notes:
  - >
    and は追加・順序。
    A and B で情報を足す。
  - >
    but は対比。
    予想と反対の内容や、対照的な性質をつなぐ。
  - >
    or は選択。
    命令文の後では「さもないと」という警告になる。
  - >
    so は結果。
    前の内容を原因として、後ろに結果を述べる。
  - >
    for は理由。
    後ろから「というのは〜だからだ」と補足する硬めの等位接続詞。

