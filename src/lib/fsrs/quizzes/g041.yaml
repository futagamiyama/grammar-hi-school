        correct: true
      - text: taking
        correct: false
    answer: to take
    explanation: >
      夕食後に薬を飲むという、これからする必要のある行為。
      don't forget to take が自然。
    translation: 夕食後に薬を飲むのを忘れないでください。
    focus:
      - forget_to_do
      - future_action
      - medicine

  - id: g041_q010
    question_type: two_choice
    prompt: I forgot ___ the medicine and took it again.
    choices:
      - text: to take
        correct: false
      - text: taking
        correct: true
    answer: taking
    explanation: >
      すでに薬を飲んだことを忘れて、もう一度飲んだという意味。
      過去の行為を忘れたので forgot taking が自然。
    translation: 私は薬を飲んだことを忘れて、もう一度飲んだ。
    focus:
      - forget_doing
      - past_action_forgotten
      - took_again

  - id: g041_q011
    question_type: two_choice
    prompt: I will never forget ___ Paris for the first time.
