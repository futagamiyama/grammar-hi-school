      - past_experience
      - never_forget

  - id: g041_q012
    question_type: two_choice
    prompt: Don't forget ___ your passport before you leave.
    choices:
      - text: to check
        correct: true
      - text: checking
        correct: false
    answer: to check
    explanation: >
      出発前にパスポートを確認するという、これから必要な行為。
      don't forget to check が自然。
    translation: 出発前にパスポートを確認するのを忘れないで。
    focus:
      - forget_to_do
      - future_action
      - passport

common_mistakes:
  - mistake: forget to do と forget doing をどちらも同じ「忘れる」と考える
    correction: >
      forget to do は「し忘れる」。
      forget doing は「したことを忘れる」。
      行為が実行されなかったのか、実行されたが記憶を忘れたのかで判断する。
  - mistake: I forgot locking the door. を「鍵をかけ忘れた」と読む
    correction: >
      「鍵をかけ忘れた」は I forgot to lock the door.。
      I forgot locking the door. は「鍵をかけたことを忘れた」。
  - mistake: Don't forget doing ... と言ってしまう
    correction: >
      「忘れずに〜しなさい」は、これからする行為なので
      Don't forget to do ... を使う。
  - mistake: never forget to visit Paris のように過去の経験に to do を使う
    correction: >
      「パリを訪れたことを忘れない」は過去の経験なので
      I will never forget visiting Paris. とする。

learning_notes:
  - >
    forget to do は、行為がまだ先にあり、それを忘れて実行しない。
    「〜し忘れる」と覚える。
  - >
    forget doing は、行為はすでに起きており、その記憶を忘れる。
    「〜したことを忘れる」と考える。
  - >
    remember to do / remember doing と完全に対になる。
    remember to lock は「忘れずに鍵をかける」、
    forget to lock は「鍵をかけ忘れる」。
  - >
    実際の会話では forget doing より remember doing の方がよく出るが、
    入試英文法では意味の対立として重要。

