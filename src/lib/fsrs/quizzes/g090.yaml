common_mistakes:
  - mistake: to だけで終わる文を不完全だと思う
    correction: >
      前に出た動詞句がわかる場合、不定詞句を to だけで受けることがある。
      I wanted to go, but I was not able to. は正しい。
  - mistake: able to の to を消してしまう
    correction: >
      代不定詞では、動詞句を省略しても to は残す。
      able to, want to, need to, have to の to が目印になる。
  - mistake: I was going to. を未来表現として読めない
    correction: >
      I was going to. は、前の文脈の動詞句を補って
      「〜するつもりだった」と読む。
  - mistake: how to / when to の後ろに必ず動詞が必要だと思う
    correction: >
      前の文脈で動詞がわかる場合は、how to / when to だけで終われる。
  - mistake: used to を「使った」と読んでしまう
    correction: >
      I used to. は、前の動詞句を受けて
      「以前はそうしていた」という意味になる。

learning_notes:
  - >
    代不定詞は、前に出た to do の内容を to だけで受ける省略。
  - >
    want to, hope to, try to, decide to, promise to などでよく使う。
  - >
    be able to, be going to, have to, used to, need to でも、
    後ろの動詞句を省略して to だけを残せる。
  - >
    読む時は、to の後ろに何が省略されているかを前の文脈から補う。
  - >
    日本語では「そうする」「それをする」と補うとわかりやすい。

