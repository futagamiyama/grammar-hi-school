id: g090
file: g090.yaml

title: 代不定詞 to
type: construction

section:
  id: s10
  title: 強調・倒置・省略

level: basic
target: 高校英文法基礎

core_question: 前に出た不定詞句を to だけで受ける省略を読めるか？

core_concept:
  pro_infinitive_after_want:
    form: want/hope/plan/try/decide + to
    meaning: そうしたい、そうするつもりだ
    image: 前に出た to do を to だけで受ける
    examples:
      - sentence: I wanted to go, but I was not able to.
        ja: 私は行きたかったが、行くことができなかった。
        point: able to の後ろに go が省略されている。
      - sentence: I asked him to help me, but he did not want to.
        ja: 私は彼に手伝ってくれるよう頼んだが、彼は手伝いたがらなかった。
        point: want to の後ろに help me が省略されている。
      - sentence: She did not come, though she had promised to.
        ja: 彼女は来ると約束していたのに、来なかった。
        point: promised to の後ろに come が省略されている。

  pro_infinitive_after_modal_like:
    form: be able to / be going to / have to / used to + 省略
    meaning: 〜できる、〜するつもりだ、〜しなければならない、以前は〜した
    image: to を含む表現の後ろで動詞句を省略する
    examples:
      - sentence: I cannot swim, but my brother is able to.
        ja: 私は泳げないが、兄は泳げる。
        point: able to の後ろに swim が省略されている。
      - sentence: I did not call her, but I was going to.
        ja: 私は彼女に電話しなかったが、電話するつもりだった。
        point: going to の後ろに call her が省略されている。
      - sentence: I do not want to go, but I have to.
        ja: 行きたくないが、行かなければならない。
        point: have to の後ろに go が省略されている。

  pro_infinitive_with_to_required:
    form: 動詞句を省略しても to は残す
    meaning: 何をするかは前の文脈からわかる
    image: to が省略された動詞の目印として残る
    examples:
      - sentence: You may leave if you want to.
        ja: そうしたければ、帰ってもよい。
        point: want to の後ろに leave が省略されている。
      - sentence: I will help you if I need to.
        ja: 必要ならあなたを手伝います。
        point: need to の後ろに help you が省略されている。
      - sentence: I did not answer because I did not know how to.
        ja: どう答えればよいかわからなかったので、私は答えなかった。
        point: how to の後ろに answer が省略されている。

main_rule: >
  代不定詞とは、前に出た to do の内容を、to だけで受ける省略表現。
  I wanted to go, but I was not able to. では、
  able to の後ろに go が省略されている。
  I asked him to help me, but he did not want to. では、
  want to の後ろに help me が省略されている。
  この to は「何をするか」が前の文脈でわかる時に残される。
  want to, hope to, try to, decide to, promise to, be able to,
  be going to, have to, used to, need to, how to などでよく使われる。
  日本語では「そうする」「それをする」と補って読むと自然。

contrast_pairs:
  - full: I wanted to go, but I was not able to go.
    reduced: I wanted to go, but I was not able to.
    point: >
      2回目の go を省略し、to だけを残している。
      able to の to は残る。

  - full: I asked him to help me, but he did not want to help me.
    reduced: I asked him to help me, but he did not want to.
    point: >
      want to の後ろの help me が省略されている。
      「手伝いたがらなかった」と読む。

  - full: I did not call her, but I was going to call her.
    reduced: I did not call her, but I was going to.
    point: >
      be going to の後ろの call her が省略されている。
      「電話するつもりだった」と読む。

