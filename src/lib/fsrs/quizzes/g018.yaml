id: g018
file: g018.yaml

title: hear / listen の使い分け
type: verb_usage

section:
  id: s02
  title: 現在形・現在進行形と動詞用法

level: basic
target: 高校英文法基礎

core_question: 聞こえる状態か、意識して聞く動作かを判断できるか？

core_concept:
  overview: >
    hear と listen はどちらも「聞く」と訳されることがあるが、英語では意味が違う。
    hear は「自然に耳に入る・聞こえる」という知覚を表す。
    listen は「意識して耳を向ける」という動作を表し、目的語を取るときは普通 listen to を使う。
    そのため、hear は現在形で使われやすく、listen は今している動作なら現在進行形になりやすい。

  hear:
    meaning: 自然に聞こえる・耳に入る
    typical_form: 現在形
    example: I hear a strange noise.
    ja: 変な音が聞こえる。
    point: 意識して聞こうとしている動作ではなく、音が耳に入っている状態を表す。

  listen:
    meaning: 意識して聞く・耳を傾ける
    typical_form: listen to + 名詞
    example: She is listening to music.
    ja: 彼女は音楽を聞いている。
    point: 意識して耳を向けている動作なので、今しているなら現在進行形になりやすい。

  listen_without_object:
    meaning: 注意して聞く
    typical_form: listen
    example: Please listen carefully.
    ja: 注意して聞いてください。
    point: 目的語がない場合は listen だけで使える。目的語がある場合は listen to を使う。

main_rule: >
  hear は「聞こえる」という知覚の状態を表すので、普通は現在形で使う。
  listen は「意識して聞く」という動作を表し、目的語を取るときは listen to を使う。
  日本語の「聞く」だけで判断せず、自然に聞こえているのか、意識して耳を向けているのかを区別する。

contrast_pairs:
  - natural: I hear a noise outside.
    unnatural: I am hearing a noise outside.
    point: >
      ただ音が耳に入っている知覚なら、現在形 hear が自然。

  - natural: She is listening to the radio now.
    unnatural: She is hearing the radio now.
    point: >
      ラジオを意識して聞いている動作なので listen to を使う。

  - natural: Can you hear me?
    unnatural: Can you listen me?
    point: >
      声が聞こえているかを尋ねる文なので hear を使う。
      listen は目的語を取るとき listen to の形にする。

  - natural: Please listen to me.
    unnatural: Please hear me.
    point: >
      相手に注意して聞くように求めているので listen to を使う。

