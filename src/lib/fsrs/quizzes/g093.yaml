    max_threshold_ratio: 0.85

review_questions:
  - id: g093_q001
    question_type: two_choice
    prompt: Will he come? I think ___.
    choices:
      - text: so
        correct: true
      - text: such
        correct: false
    answer: so
    explanation: >
      I think so の so は that he will come を受けている。
      「そう思います」という意味。
    translation: 彼は来ますか。そう思います。
    focus:
      - so_clause_substitution
      - think_so
      - will_come

  - id: g093_q002
    question_type: two_choice
    prompt: Is she right? I believe ___.
    choices:
      - text: so
        correct: true
      - text: it
        correct: false
    answer: so
    explanation: >
      I believe so は「そう信じています」。
      so は that she is right を受けている。
    translation: 彼女は正しいですか。そう信じています。
    focus:
      - so_clause_substitution
      - believe_so
      - right

  - id: g093_q003
    question_type: two_choice
    prompt: Will the plan work? I suppose ___.
    choices:
      - text: so
        correct: true
      - text: this
        correct: false
    answer: so
    explanation: >
      I suppose so は「たぶんそうでしょう」。
      so が前の内容 the plan will work を受けている。
    translation: その計画はうまくいきますか。たぶんそうでしょう。
    focus:
      - so_clause_substitution
      - suppose_so
      - plan

  - id: g093_q004
    question_type: two_choice
    prompt: Will it rain tomorrow? I hope ___.
    choices:
      - text: not
        correct: true
      - text: no
        correct: false
    answer: not
    explanation: >
      I hope not は「そうでないといい」という意味。
      not は that it will not rain を受けている。
    translation: 明日は雨が降りますか。降らないといいのですが。
    focus:
      - not_clause_substitution
      - hope_not
      - rain

  - id: g093_q005
    question_type: two_choice
    prompt: Will he pass the exam? I hope ___.
    choices:
      - text: so
        correct: true
      - text: not
        correct: false
    answer: so
    explanation: >
      合格してほしいという意味なので I hope so。
      so は that he will pass the exam を受けている。
    translation: 彼は試験に合格しますか。そうだといいのですが。
    focus:
      - so_clause_substitution
      - hope_so
      - exam

  - id: g093_q006
    question_type: two_choice
    prompt: Is he angry? I think ___.
    choices:
      - text: not
        correct: true
      - text: no
        correct: false
    answer: not
    explanation: >
      I think not は「そうではないと思う」。
      not が he is not angry という内容を受けている。
    translation: 彼は怒っていますか。そうではないと思います。
    focus:
      - not_clause_substitution
      - think_not
      - angry

  - id: g093_q007
    question_type: two_choice
    prompt: Is the train late? I am afraid ___.
    choices:
      - text: so
        correct: true
      - text: not
        correct: false
    answer: so
    explanation: >
      I am afraid so は「残念ながらそうです」。
      電車が遅れているという悪い知らせを認めている。
    translation: 電車は遅れていますか。残念ながらそうです。
    focus:
      - afraid_so_not
      - afraid_so
      - train_late

  - id: g093_q008
    question_type: two_choice
    prompt: Can you come tomorrow? I am afraid ___.
    choices:
      - text: not
        correct: true
      - text: no
        correct: false
    answer: not
    explanation: >
      I am afraid not は「残念ながらそうではありません」。
      ここでは「残念ながら行けません」という意味。
    translation: 明日来られますか。残念ながら無理です。
    focus:
      - afraid_so_not
      - afraid_not
      - cannot_come

  - id: g093_q009
    question_type: two_choice
    prompt: Did we miss the bus? I am afraid ___.
    choices:
      - text: so
        correct: true
      - text: it
        correct: false
    answer: so
    explanation: >
      I am afraid so は、悪い内容を「残念ながらそうです」と認める表現。
      so は that we missed the bus を受けている。
    translation: 私たちはバスに乗り遅れましたか。残念ながらそうです。
    focus:
      - afraid_so_not
      - missed_bus
      - so

  - id: g093_q010
    question_type: two_choice
    prompt: If you think it is wrong, say ___.
    choices:
      - text: so
        correct: true
      - text: it
        correct: false
    answer: so
    explanation: >
      say so は「そう言う」。
      so は it is wrong という内容を受けている。
    translation: それが間違っていると思うなら、そう言いなさい。
    focus:
      - say_so_do_so
      - say_so
      - wrong

  - id: g093_q011
    question_type: two_choice
    prompt: He promised to help us, and he did ___.
    choices:
      - text: so
        correct: true
      - text: it
        correct: false
    answer: so
    explanation: >
      did so は helped us を受けて「実際にそうした」という意味。
      do so は前の動作を受ける。
    translation: 彼は私たちを助けると約束し、実際にそうした。
    focus:
      - say_so_do_so
      - did_so
      - help_us

  - id: g093_q012
    question_type: two_choice
    prompt: She told me to wait, so I did ___.
    choices:
      - text: so
        correct: true
      - text: wait
        correct: false
    answer: so
    explanation: >
      did so は waited を受けている。
      「彼女がそう言ったので、私はそうした」という意味。
    translation: 彼女は私に待つように言ったので、私はそうした。
    focus:
      - say_so_do_so
      - did_so
      - wait

common_mistakes:
  - mistake: I think so の so を「とても」と読む
    correction: >
      I think so の so は「そのように」という意味で、
      前の文全体を受けている。
  - mistake: I hope not を I hope no としてしまう
    correction: >
      文や節を否定して受ける時は not を使う。
      I hope not. が正しい。
  - mistake: I am afraid so を「私はそう恐れている」と直訳する
    correction: >
      I am afraid so は「残念ながらそうです」。
      悪い知らせをやわらかく認める表現。
  - mistake: I am afraid not を「怖くない」と読む
    correction: >
      I am afraid not は「残念ながらそうではありません」。
      断る時にもよく使う。
  - mistake: did so の so が何を受けているか見ない
    correction: >
      did so は前に出た動作を受ける。
      he did so = he helped us のように補って読む。

learning_notes:
  - >
    so は、前の文・節・動作を受けて「そう」と表す。
    I think so / I believe so / I suppose so の形。
  - >
    not は、前の内容を否定して受ける。
    I hope not / I think not / I expect not の形。
  - >
    I am afraid so は「残念ながらそうです」。
    I am afraid not は「残念ながらそうではありません」。
  - >
    say so は「そう言う」。
    do so は「そうする」。
  - >
    so / not は短いが、前のどの内容を受けているかを補わないと意味を取り違える。

