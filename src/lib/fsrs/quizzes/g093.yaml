id: g093
file: g093.yaml

title: so / not による代用表現
type: construction

section:
  id: s10
  title: 強調・倒置・省略

level: basic
target: 高校英文法基礎

core_question: so / not が前の文や節の内容を受けることを読めるか？

core_concept:
  so_clause_substitution:
    form: think/believe/suppose/guess/expect + so
    meaning: そう思う、そう信じる、そう推測する
    image: 前に出た文全体を so で受ける
    examples:
      - sentence: Will he come? I think so.
        ja: 彼は来ますか。そう思います。
        point: so = that he will come。
      - sentence: Is she right? I believe so.
        ja: 彼女は正しいですか。そう信じています。
        point: so = that she is right。
      - sentence: Will the plan work? I suppose so.
        ja: その計画はうまくいきますか。たぶんそうでしょう。
        point: so が前の内容を受けている。

  not_clause_substitution:
    form: hope/think/believe/suppose/expect + not
    meaning: そうでないことを望む、そうではないと思う
    image: 前の文全体の否定を not で受ける
    examples:
      - sentence: Will it rain tomorrow? I hope not.
        ja: 明日は雨が降りますか。降らないといいのですが。
        point: not = that it will not rain。
      - sentence: Is he angry? I think not.
        ja: 彼は怒っていますか。そうではないと思います。
        point: not が前の内容を否定して受けている。
      - sentence: Will the meeting be canceled? I expect not.
        ja: 会議は中止されますか。中止されないと思います。
        point: expect not は「そうならないと思う」。

  afraid_so_not:
    form: I am afraid so / I am afraid not
    meaning: 残念ながらそうです / 残念ながらそうではありません
    image: よくない答えをやわらかく伝える
    examples:
      - sentence: Is the train late? I am afraid so.
        ja: 電車は遅れていますか。残念ながらそうです。
        point: so = that the train is late。
      - sentence: Can you come tomorrow? I am afraid not.
        ja: 明日来られますか。残念ながら無理です。
        point: not = that I cannot come tomorrow。
      - sentence: Did we miss the bus? I am afraid so.
        ja: 私たちはバスに乗り遅れましたか。残念ながらそうです。
        point: 悪い知らせに対して I am afraid so を使う。

  say_so_do_so:
    form: say so / do so
    meaning: そう言う / そうする
    image: 前に出た発言・行動を so で受ける
    examples:
      - sentence: If you think it is wrong, say so.
        ja: それが間違っていると思うなら、そう言いなさい。
        point: so = that it is wrong。
      - sentence: He promised to help us, and he did so.
        ja: 彼は私たちを助けると約束し、実際にそうした。
        point: did so = helped us。
      - sentence: She told me to wait, so I did so.
        ja: 彼女は私に待つように言ったので、私はそうした。
        point: did so = waited。

main_rule: >
  so / not は、前に出た文や節の内容を短く受けることがある。
  Will he come? I think so. の so は that he will come を受けている。
  Will it rain tomorrow? I hope not. の not は that it will not rain を受けている。
  I am afraid so. は「残念ながらそうです」、
  I am afraid not. は「残念ながらそうではありません」という意味。
  say so は「そう言う」、do so は「そうする」。
  so は単語1語だが、文全体・節全体・動作全体を受けることがあるので、
  何を受けているのかを前の文脈から補って読む。

contrast_pairs:
  - positive: Will he come? I think so.
    negative: Will he come? I do not think so.
    point: >
      I think so は「来ると思う」。
      I do not think so は「来るとは思わない」。

  - hope_positive: Will he pass the exam? I hope so.
    hope_negative: Will it rain tomorrow? I hope not.
    point: >
      I hope so は「そうだといい」。
      I hope not は「そうでないといい」。

  - afraid_positive: Is the train late? I am afraid so.
    afraid_negative: Can you come tomorrow? I am afraid not.
    point: >
      I am afraid so は悪い内容を「残念ながらそう」と認める。
      I am afraid not は「残念ながらそうではない」と断る。

