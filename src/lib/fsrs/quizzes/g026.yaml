id: g026
file: g026.yaml
title: will vs would
type: grammar_contrast
section:
  id: s03
  title: 助動詞・法
level: basic
target: 高校英文法基礎
core_question: 直接的な意志・予測なのか、距離を置いた表現・丁寧表現・過去から見た未来なのか？
core_concept:
  will:
    form: will + 動詞の原形
    meaning: 未来についての意志・予測・申し出を、比較的直接的に表す。
    image: 今ここから未来へまっすぐ向かう感じ / その場で決める感じ
    examples:
    - sentence: I will call you later.
      ja: 後で電話します。
      point: 今決めた意志や約束を直接的に述べている。
    - sentence: It will be cold tomorrow.
      ja: 明日は寒くなるだろう。
      point: 未来について比較的まっすぐ予測している。
    - sentence: I will help you.
      ja: 手伝います。
      point: その場で申し出る意志を表している。
  would:
    form: would + 動詞の原形
    meaning: will に距離感を加えた形。丁寧さ、控えめさ、仮定、過去から見た未来などを表す。
    image: 直接言わずに少し距離を置く / 現実から一歩引く / 過去の視点から未来を見る
    examples:
    - sentence: Would you help me?
      ja: 手伝っていただけますか。
      point: Will you ...? より丁寧で控えめな依頼。
    - sentence: I would call him, but I do not have his number.
      ja: 彼に電話するのだが、番号を知らない。
      point: 仮定的な状況での意志を表している。
    - sentence: He said he would come.
      ja: 彼は来ると言った。
      point: 過去の時点から見た未来なので would を使う。
main_rule: 'will は、未来についての意志・予測・申し出を比較的直接的に表す。

  would は will に距離を置いた形で、丁寧な依頼、控えめな表現、仮定の話、過去から見た未来などに使う。

  日本語ではどちらも「〜するだろう」「〜してくれる？」のように訳せることがあるため、

  直接的に言っているのか、距離を置いているのか、文脈が現在か過去かを見て判断する。'
contrast_pairs:
- will: Will you open the window?
  would: Would you open the window?
  point: will は直接的な依頼。would は距離を置くため、より丁寧に聞こえる。
- will: I will help you.
  would: I would help you if I had time.
  point: will は実際に手伝う意志。would は条件が満たされれば手伝う、という仮定。
- will: He says he will come.
  would: He said he would come.
  point: 現在の発言なら will、過去の発言から見た未来なら would。
