common_mistakes:
- mistake: would を will の過去形としてだけ覚える
  correction: would は過去の文脈でも使うが、丁寧さ・仮定・控えめな表現にも使う。Would you ...? は現在の丁寧な依頼である。
- mistake: will は単なる未来、would は単なる過去だと思う
  correction: will は意志・予測・申し出を直接的に表す。would は will に距離を置いた表現で、仮定や丁寧さにも使う。
- mistake: Will you ...? と Would you ...? を同じ丁寧さだと思う
  correction: Will you ...? は比較的直接的な依頼。Would you ...? は距離を置くため、より丁寧に聞こえる。
- mistake: He said he will come. のように、過去の発言でも will をそのまま使う
  correction: 過去の発言から見た未来は、通常 would を使う。He said he would come. が基本。
learning_notes:
- will と would の中心差は、単なる時制差ではなく「距離感」で考えるとわかりやすい。
- will は、今の地点から未来へまっすぐ向かう感じがある。意志・予測・申し出を直接的に言う。
- would は、現実・相手・現在から少し距離を置く。だから仮定法、丁寧表現、過去から見た未来に使われる。
- Would you ...? は丁寧な依頼、I would ... if ... は仮定の結果、He said he would ... は過去から見た未来。
- 過去の習慣を表す would は used to との違いがあるため、必要なら別カードで扱う。
